ign-items:center;justify-content:center;font-size:11px;font-weight:900}.chapter-item.active .chapter-num{background:#111827;color:#fff}.chapter-copy{min-width:0}.chapter-kicker{font-size:10.5px;color:var(--muted);font-weight:800;margin-bottom:2px}.chapter-name{font-size:13px;font-weight:850;line-height:1.4;overflow-wrap:anywhere}.screen{padding:23px 19px 18px;min-height:640px;display:flex;flex-direction:column}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:13px}h1{font-size:28px;line-height:1.2;margin:0 0 10px;letter-spacing:-.02em}.lead{font-size:16px;line-height:1.65;color:#374151;margin:0 0 17px}.visual{margin:6px 0 14px}.bigmath{font-variant-numeric:tabular-nums;text-align:center;font-weight:950;font-size:36px;letter-spacing:.04em;padding:20px 10px;background:var(--soft);border:1px solid var(--line);border-radius:20px}.callout{padding:12px 13px;border-radius:14px;background:#f8fafc;border:1px solid var(--line);font-size:14px;line-height:1.65;color:#4b5563}.audio-stack{display:grid;gap:8px;margin:5px 0 12px}.audio{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--dark);color:#fff;padding:11px;border-radius:17px}.audio.alt{background:#eef2ff;color:#1f2937;border:1px solid #dbe3ff}.play{width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;background:#fff;color:#111827;font-weight:900}.alt .play{background:#111827;color:#fff}.audio-title{font-weight:850;font-size:13px;margin-bottom:2px}.audio-sub{font-size:11.5px;color:#cbd5e1}.alt .audio-sub{color:#64748b}.inline-transcript{grid-column:1/-1;margin-top:2px;padding:10px 11px 2px;border-top:1px solid rgba(255,255,255,.16);font-size:13px;line-height:1.75;color:#e5e7eb}.alt .inline-transcript{border-top-color:#dbe3ff;color:#334155}.inline-transcript::before{content:"文字稿";display:block;font-size:10.5px;letter-spacing:.08em;font-weight:900;color:#9ca3af;margin-bottom:4px}.assist{border-top:1px solid var(--line);margin-top:3px;padding-top:8px}.assist-label{font-size:12px;font-weight:900;color:var(--muted);margin:4px 0 8px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;overflow:hidden}.panel summary{cursor:pointer;list-style:none;padding:12px 13px;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:space-between}.panel summary::-webkit-details-marker{display:none}.panel summary::after{content:'＋';color:#9ca3af;font-size:18px}.panel[open] summary::after{content:'－'}.panel-body{padding:0 13px 13px;font-size:14px;line-height:1.72;color:#374151}.panel.why{background:#fffbeb}.panel.detail{background:#eff6ff}.panel.note{background:#f8fafc}.quiz{display:grid;gap:9px;margin:8px 0 12px}.choice{border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left;padding:14px 15px;font-size:15px;font-weight:800;cursor:pointer}.choice.correct{border-color:#99f6e4;background:#ecfdf5;color:#065f46}.choice.wrong{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.feedback{display:none;padding:11px 13px;border-radius:13px;background:#f8fafc;font-size:14px;line-height:1.6}.feedback.show{display:block}.footer{margin-top:auto;padding-top:15px;display:flex;gap:9px}.btn{flex:1;border:0;border-radius:15px;padding:13px 15px;font-weight:900;cursor:pointer}.secondary{background:#f3f4f6;color:#1f2937}.primary{background:#111827;color:#fff}.btn:disabled{opacity:.35}.tiny{text-align:center;color:var(--muted);font-size:11.5px;margin-top:10px}.empty{padding:28px 16px;text-align:center;color:var(--muted);line-height:1.7}.term-grid{display:grid;gap:10px;margin:8px 0 12px}.term-card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px}.term-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.term-zh{font-size:18px;font-weight:950}.term-en-row{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}.term-en{font-size:12px;color:var(--muted)}.term-en-play{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111827;padding:0;font-size:11px;font-weight:900;cursor:pointer;flex:0 0 24px;line-height:1}.term-play{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#111827;color:#fff;padding:0;font-size:16px;font-weight:900;cursor:pointer;flex:0 0 40px;line-height:1}.term-exp{font-size:14px;line-height:1.7;color:#374151;margin-top:10px}.term-transcript{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.75;color:#4b5563}.term-transcript::before{content:'語音逐字稿';display:block;font-size:10.5px;letter-spacing:.08em;font-weight:900;color:#9ca3af;margin-bottom:4px}.recall-score{font-size:13px;color:var(--muted);margin:2px 0 12px}.recall-item{border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:11px;background:#fff}.recall-q{font-weight:900;font-size:15px;line-height:1.55;margin-bottom:9px}.recall-options{display:grid;gap:7px}.recall-choice{border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:11px 12px;font-size:14px;font-weight:750;cursor:pointer}.recall-choice.correct{border-color:#99f6e4;background:#ecfdf5;color:#065f46}.recall-choice.wrong{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.recall-feedback{display:none;margin-top:8px;padding:9px 10px;border-radius:11px;background:#f8fafc;font-size:13px;line-height:1.55}.recall-feedback.show{display:block}.section-kicker{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:10px}@media(max-width:360px){h1{font-size:24px}.screen{min-height:620px}.bigmath{font-size:31px}.audio-title{font-size:12px}.mode{display:none}.topbar{align-items:flex-start}}

/* ===== 通勤大字舒適版：閱讀與觸控優化 ===== */
h1{
  font-size:30px;
  line-height:1.28;
}
.lead{
  font-size:17px;
  line-height:1.75;
}
.callout{
  font-size:16px;

}

}

.panel summary{

}

  line-height:1.82;
  padding:0 14px 14px;
}
.choice{

  padding:15px 16px;

}
.feedback{
  font-size:16px;

.btn{

}
.term-zh{
  font-size:20px;
}
.term-en{
  font-size:14px;
  line-height:1.5;
}
.term-en-play{
  width:30px;
  height:30px;
  flex-basis:30px;
  font-size:12px;
}
.term-play{
  width:46px;
  height:46px;
  flex-basis:46px;
}
.term-exp{

}

}

  font-size:14px;
}
.recall-q{
  font-size:16px;
  line-height:1.65;
}
.recall-choice{
  font-size:16px;
  line-height:1.55;
  padding:13px 14px;
  min-height:48px;
}
.recall-feedback{
  font-size:16px;
  line-height:1.7;
}
.chapter-name{

}
.chapter-kicker,
.chapter-nav-count,
.chapter-num{

}
.section-kicker,

}

/* 內嵌視覺裡原本的 12px 小字也提升，避免通勤時難讀 */
.visual span[style*="font-size:12px"]{
  font-size:14px !important;
  line-height:1.5;
}

/* 窄螢幕也不縮回過小字體 */
@media(max-width:360px){
  h1{font-size:28px}
  .lead{font-size:17px}
  .callout,
  .inline-transcript,
  .panel-body,
  .choice,
  .feedback,
  .term-exp,
  .term-transcript,
  .recall-q,
  .recall-choice,
  .recall-feedback{
    font-size:16px;
  }
  .audio-title{font-size:14px}
}

<body>
<div class="page">
  <div class="topbar"><div class="brand" id="brand">通勤微課 Template</div><div class="top-actions"><div class="mode">🎧 語音＋同步逐字稿</div><button type="button" class="chapter-toggle" id="chapterToggle" aria-expanded="false" aria-controls="chapterNav">段落</button></div></div>
  <main class="shell">
    <div class="progress-wrap"><div class="progress-row"><span id="stepLabel"></span><span id="timeLabel"></span></div><div class="track"><div class="bar" id="bar"></div></div></div>
    <nav class="chapter-nav" id="chapterNav" aria-label="課程段落導覽"><div class="chapter-nav-head"><div class="chapter-nav-title">跳到某一段</div><div class="chapter-nav-count" id="chapterNavCount"></div></div><div class="chapter-list" id="chapterList"></div></nav>
    <div id="lessonRoot"></div>
  </main>
</div>

<script>
/* ============================================================
   通勤微課內容模板

   核心原則：
   1. segments 沒有固定數量。依影片真正的「學習單元」決定。
   2. 不要為了湊段落而切段，也不要把兩個需要獨立理解的概念硬塞同一段。
   3. 每段 audio[].text 同時是「語音內容」與「逐字文字稿」的唯一來源，
      因此語音唸的字與畫面文字必定一致。
   4. audio、panels、quiz、visualHtml 都是可選的；內容需要才放。
   5. glossary 是課程結尾的專有名詞整理，可選、數量不限；每個術語提供中英對照、白話解釋與語音逐字稿。
   6. termQuiz 緊接在專有名詞後面，專門幫助記熟術語；至少讓每個重要術語被考到一次。
   7. terminology 的 en 欄位後面可顯示獨立英文發音按鈕；若提供 enAudioText，英文按鈕優先播放它。
      題型可輪替「中→英」「英→中」「解釋→名詞」，題數依術語數量決定，太多時自動分頁。
   7. recallQuiz 是最後的整課回想測驗，可選、題數不固定；依課程真正需要記住的重點決定。
   8. time 只是估計，不要求每段等長。
   9. 段落導覽會依實際內容自動產生，使用者可從任何位置直接跳到指定段落。
   ============================================================ */

const COURSE = {
  title: "CCNA 3.1 規則：網路通訊如何遵守共同規則",
  brand: "CCNA 通勤微課",
  segments: [
    {
      eyebrow: "01 · 設備眼中的網路",
      title: "設備不會『看懂』整張網路，它靠協定取得答案",
      lead: "影片先用一台端點設備的視角問三件事：我的位址是什麼？目的地在哪裡？資料應該往哪裡送？",
      time: "約 70 秒",
      visualHtml: `<div class="callout"><b>設備真正需要知道：</b><br>① 我的位址與所在網路<br>② 目的地在本地還是其他網路<br>③ 下一步要把資訊交給誰</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px"><div class="callout" style="text-align:center"><b>位址／鄰居</b><br><span style="font-size:12px">IPv4 · IPv6 · ARP · Neighbor Discovery</span></div><div class="callout" style="text-align:center"><b>服務／傳輸</b><br><span style="font-size:12px">DNS · DHCP · TCP · UDP · HTTP · HTTPS</span></div></div>`,
      audio: [
        {
          title: "白話解釋 · 設備怎麼知道路？",
          subtitle: "先抓住影片開場的核心問題",
          text: "端點設備其實不會像人一樣看著拓樸圖就知道整個網路。它必須依靠不同的通訊協定取得需要的資訊，例如自己的位址、目的地名稱所對應的位址、目的地是不是在同一個網路，以及資料接下來要交給哪一個裝置。影片畫面列出 IPv4、IPv6、ICMP、ICMPv6、TCP、UDP、HTTP、HTTPS、DNS、DHCP、DHCPv6、SSH、Ethernet、WLAN、ARP 和 Neighbor Discovery 等協定，重點不是一次背完，而是先知道網路通訊是很多規則一起合作。"
        }
      ],
      panels: [
        { title: "影片中的協定例子", kind: "detail", body: "畫面列出的例子包括 IPv4、IPv6、ICMP、ICMPv6、TCP、UDP、HTTP、HTTPS、DNS、DHCP、DHCPv6、SSH、Ethernet、WLAN、ARP、Neighbor Discovery 等。這一段先建立『設備靠協定取得資訊與完成通訊』的整體印象。" }
      ],
      quiz: {
        prompt: "哪一個說法最符合影片中『設備如何看網路』的意思？",
        choices: [
          { label: "A　設備會直接知道整張拓樸圖", correct: false },
          { label: "B　設備靠多種協定取得位址、尋址與傳送所需資訊", correct: true },
          { label: "C　只要知道 DNS，就能完成所有網路通訊", correct: false }
        ],
        correctText: "✅ 對。設備不是『看懂』網路，而是由多種協定分工提供通訊所需資訊。",
        wrongText: "回想影片的黑底動畫：設備一直在問自己的位址、目的地位置，以及資料要送去哪裡。"
      }
    },
    {
      eyebrow: "02 · 通訊基礎知識",
      title: "任何通訊都離不開三個基本元素",
      lead: "不管是人與人，還是電腦與電腦，至少要有來源、目的地，以及訊息行經的通道。",
      time: "約 55 秒",
      visualHtml: `<div class="bigmath" style="font-size:22px;line-height:1.7;letter-spacing:0">來源／傳送者<br><span style="font-size:18px">↓</span><br>通道<br><span style="font-size:18px">↓</span><br>目的地／接收者</div>`,
      audio: [
        {
          title: "白話解釋 · 三個基本角色",
          subtitle: "先把通訊骨架記起來",
          text: "影片把所有通訊拆成三個基本元素。第一個是訊息來源，也就是傳送者，它可能是人，也可能是需要送出訊息的電子裝置。第二個是訊息目的地，也就是接收者，負責收到訊息並加以解讀。第三個是通道，也就是訊息從來源到目的地所經過的媒介。之後所有規則，都是為了讓這三者能正確合作。"
        }
      ],
      panels: [
        { title: "中英文對照", kind: "note", body: "Message source (sender)＝訊息來源／傳送者；Message destination (receiver)＝訊息目的地／接收者；Channel＝通道。" }
      ]
    },
    {
      eyebrow: "03 · 通訊協定",
      title: "雙方能連上，不代表雙方一定能理解",
      lead: "協定就是通訊雙方共同遵守的規則；沒有共同規則，即使資訊成功送到，也可能無法被正確解讀。",
      time: "約 65 秒",
      visualHtml: `<div class="callout"><b>類比：</b>兩個人都會說話，不代表隨便排列字詞就能互相理解；網路裝置也需要先同意『怎麼說、怎麼送、怎麼回應』。</div>`,
      audio: [
        {
          title: "白話解釋 · 什麼是通訊協定？",
          subtitle: "把 protocol 當成共同約定",
          text: "影片用人類交談來比喻通訊協定。兩個人在溝通之前，必須先同意溝通方式；如果使用語言不同，或即使使用同一種語言卻沒有共同的語法與規則，就很容易產生誤解。網路也是一樣，通訊協定就是針對某種通訊方式所制定的一組規則，讓來源與目的地能用彼此都能理解的方式交換訊息。"
        }
      ],
      quiz: {
        prompt: "兩台設備已經連上同一個網路，為什麼仍然需要通訊協定？",
        choices: [
          { label: "A　因為連線只提供通路，還需要共同規則才能理解訊息", correct: true },
          { label: "B　因為協定只負責把網路速度變快", correct: false },
          { label: "C　因為協定的唯一用途是替設備取名字", correct: false }
        ],
        correctText: "✅ 沒錯。『能傳到』和『能理解』是兩件事，共同規則負責後者。",
        wrongText: "想像兩個人都能聽見對方，但沒有共同語言與語法。"
      }
    },
    {
      eyebrow: "04 · 規則建立",
      title: "一套可用的通訊規則，要先約定幾件事",
      lead: "影片把人類對話的規則映射到網路：誰在說、誰在收、使用什麼語法、什麼速度與時間，以及需不需要確認。",
      time: "約 60 秒",
      visualHtml: `<div style="display:grid;gap:7px"><div class="callout"><b>① 身分</b>　辨識傳送者與接收者</div><div class="callout"><b>② 語言／語法</b>　雙方採用共同格式</div><div class="callout"><b>③ 速度／時間</b>　何時送、送多快</div><div class="callout"><b>④ 確認</b>　是否需要回應或確認收到</div></div>`,

      wrongText: "想像寄信時，地址必須寫在信封上的正確位置。"
    },
    {
      question: "把信件放進信封的網路類比是哪個術語？",
      choices: [
        { label: "Encapsulation", correct: true },
        { label: "Decoding", correct: false },
        { label: "Broadcast", correct: false }
      ],
      correctText: "正確。Encapsulation 就是封裝。",
      wrongText: "提示：把一種訊息格式放進另一種格式。"
    },
    {
      question: "De-encapsulation 在影片的寄信類比中最像哪個動作？",
      choices: [
        { label: "打開信封並取出信件", correct: true },
        { label: "把地址寫在信封上", correct: false },
        { label: "決定寄給幾個人", correct: false }
      ],
      correctText: "對。De-encapsulation 是解封裝。",
      wrongText: "回想封裝是『放進去』，逆向就是『取出來』。"
    },
    {
      question: "哪個術語用來協調傳送速度，避免接收端跟不上？",
      choices: [
        { label: "Flow Control", correct: true },
        { label: "Access Method", correct: false },
        { label: "Unicast", correct: false }
      ],
      correctText: "正確。Flow Control 是流量控制。",
      wrongText: "提示：影片用『一個人講太快，另一個人跟不上』來比喻。"
    },
    {
      question: "Response Timeout 的中文是什麼？",
      choices: [
        { label: "回應逾時", correct: true },
        { label: "訊息格式化", correct: false },
        { label: "多點傳送", correct: false }
      ],
      correctText: "對。Response Timeout 是回應逾時。",
      wrongText: "提示：它處理『等多久還沒回應』。"
    },
    {
      question: "決定裝置何時能使用媒介開始傳送的是哪個術語？",
      choices: [
        { label: "Access Method", correct: true },
        { label: "Channel", correct: false },
        { label: "Encoding", correct: false }
      ],
      correctText: "正確。Access Method 是存取方法。",
      wrongText: "回想兩個人同時說話會發生資訊衝突的比喻。"
    },
    {
      question: "只把資訊送到單一終端裝置，英文是哪個術語？",
      choices: [
        { label: "Unicast", correct: true },
        { label: "Multicast", correct: false },
        { label: "Broadcast", correct: false }
      ],
      correctText: "對。Unicast 是單播／單點傳送。",
      wrongText: "提示：uni 表示單一。"
    },
    {
      question: "把資訊送到一組指定終端裝置，英文是哪個術語？",
      choices: [
        { label: "Multicast", correct: true },
        { label: "Unicast", correct: false },
        { label: "Broadcast", correct: false }
      ],
      correctText: "正確。Multicast 是多點傳送。",
      wrongText: "提示：不是只給一個，也不是給全部。"
    },
    {
      question: "Broadcast 在本課表示什麼？",
      choices: [
        { label: "把資訊傳送到所有終端裝置", correct: true },
        { label: "只傳送到單一終端裝置", correct: false },
        { label: "只負責控制傳送速度", correct: false }
      ],
      correctText: "對。Broadcast 是廣播。",
      wrongText: "提示：三種傳送範圍中，它的收件人範圍最大。"
    }
  ],

  recallQuiz: [
    {
      question: "任何通訊最基本的三個元素是哪一組？",
      choices: [
        { label: "來源／傳送者、目的地／接收者、通道", correct: true },
        { label: "DNS、DHCP、HTTP", correct: false },
        { label: "編碼、廣播、回應逾時", correct: false }
      ],
      correctText: "對。這三個元素先構成通訊的基本骨架。",
      wrongText: "回想 3.1.2：誰送、誰收、訊息走哪裡。"
    },
    {
      question: "為什麼『能連線』仍然不代表『能溝通』？",
      choices: [
        { label: "因為雙方還需要遵守共同的通訊協定與規則", correct: true },
        { label: "因為每台設備都必須使用同一個 IP 位址", correct: false },
        { label: "因為所有訊息都只能用廣播", correct: false }
      ],
      correctText: "正確。通訊協定負責讓雙方對訊息的格式、時間與行為有共同理解。",
      wrongText: "想像兩個人都聽得見彼此，但沒有共同語言與語法。"
    },
    {
      question: "寄信時，『地址要寫在正確位置』最接近哪個網路概念？",
      choices: [
        { label: "訊息格式化", correct: true },
        { label: "流量控制", correct: false },
        { label: "編碼", correct: false }
      ],
      correctText: "對。這也是影片問題 2 的重點。",
      wrongText: "提示：這一題在問欄位的位置與結構。"
    },
    {
      question: "哪一組是影片列出的三個訊息時間規則？",
      choices: [
        { label: "流量控制、回應逾時、存取方法", correct: true },
        { label: "編碼、解碼、封裝", correct: false },
        { label: "單播、多點傳送、廣播", correct: false }
      ],
      correctText: "正確。速度、等待多久、何時能開始傳送，都是時間規則。",
      wrongText: "回想影片最後的問題 3。"
    },
    {
      question: "一台來源裝置要把同一則資訊送給該範圍中的所有終端裝置，應使用哪種傳送方式？",
      choices: [
        { label: "廣播 Broadcast", correct: true },
        { label: "單播 Unicast", correct: false },
        { label: "多點傳送 Multicast", correct: false }
      ],
      correctText: "對。廣播的目的地範圍是所有終端裝置。",
      wrongText: "先分辨收件人範圍：一個、一組，還是全部。"
    }
  ]
};

const root=document.getElementById('lessonRoot');
const bar=document.getElementById('bar');
const stepLabel=document.getElementById('stepLabel');
const timeLabel=document.getElementById('timeLabel');
const chapterToggle=document.getElementById('chapterToggle');
const chapterNav=document.getElementById('chapterNav');
const chapterList=document.getElementById('chapterList');
const chapterNavCount=document.getElementById('chapterNavCount');
document.getElementById('brand').textContent=COURSE.brand||COURSE.title||'通勤微課';
document.title=(COURSE.title||'通勤微課')+'｜通勤微課';
let current=0;

function escapeHtml(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderAudio(a){return `<div class="audio${a.alt?' alt':''}"><button class="play" data-speech="${escapeHtml(a.text||'')}">▶</button><div><div class="audio-title">${a.title||'語音解釋'}</div><div class="audio-sub">${a.subtitle||''}</div></div><div class="inline-transcript">${escapeHtml(a.text||'')}</div></div>`}
function renderPanel(p){return `<details class="panel ${p.kind||'note'}" ${p.open?'open':''}><summary>${p.title||'補充'}</summary><div class="panel-body">${p.body||''}</div></details>`}
function renderQuiz(q,idx){if(!q)return'';return `<div class="quiz-block"><p class="lead" style="margin-bottom:8px">${q.prompt||''}</p><div class="quiz">${(q.choices||[]).map((c,i)=>`<button class="choice" data-segment="${idx}" data-correct="${c.correct?'1':'0'}">${c.label||('選項 '+(i+1))}</button>`).join('')}</div><div class="feedback" id="feedback-${idx}" data-correct-text="${escapeHtml(q.correctText||'✅ 正確') }" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`}
function buildScreens(){
  const screens=[];
  (COURSE.segments||[]).forEach((s,i)=>screens.push({type:'segment',data:s,segmentIndex:i}));
  const terms=COURSE.glossary||[];
  const glossaryChunkSize=4; // 手機上一頁最多約 4 個術語；超過就自動分頁，不限制總數。
  for(let i=0;i<terms.length;i+=glossaryChunkSize){
    screens.push({type:'glossary',data:terms.slice(i,i+glossaryChunkSize),page:Math.floor(i/glossaryChunkSize)+1,pages:Math.ceil(terms.length/glossaryChunkSize)});
  }
  const termQuiz=COURSE.termQuiz||[];
  const quizChunkSize=5; // 術語很多時不要一頁塞太多題，自動分批複習。
  for(let i=0;i<termQuiz.length;i+=quizChunkSize){
    screens.push({type:'termquiz',data:termQuiz.slice(i,i+quizChunkSize),offset:i,page:Math.floor(i/quizChunkSize)+1,pages:Math.ceil(termQuiz.length/quizChunkSize)});
  }
  if((COURSE.recallQuiz||[]).length) screens.push({type:'recall',data:COURSE.recallQuiz,offset:0});
  return screens;
}
let SCREENS=[];
function screenMeta(scr,index){
  if(scr.type==='segment'){
    const s=scr.data||{};
    return {kicker:s.eyebrow||`學習 ${scr.segmentIndex+1}`,name:s.title||`學習段落 ${scr.segmentIndex+1}`};
  }
  if(scr.type==='glossary') return {kicker:`專有名詞整理${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞複習'};
  if(scr.type==='termquiz') return {kicker:`術語測驗${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞記憶測驗'};
  return {kicker:'最後回想',name:'整堂課回想測驗'};
}
function renderChapterNav(){
  chapterNavCount.textContent=`共 ${SCREENS.length} 段`;
  chapterList.innerHTML=SCREENS.map((scr,i)=>{
    const m=screenMeta(scr,i);
    return `<button type="button" class="chapter-item${i===current?' active':''}" data-jump="${i}" aria-current="${i===current?'step':'false'}"><span class="chapter-num">${i+1}</span><span class="chapter-copy"><span class="chapter-kicker">${escapeHtml(m.kicker)}</span><span class="chapter-name">${escapeHtml(m.name)}</span></span></button>`;
  }).join('');
  chapterList.querySelectorAll('.chapter-item').forEach(btn=>btn.addEventListener('click',()=>{
    show(Number(btn.dataset.jump));
    setChapterNav(false);
  }));
}
function setChapterNav(open){
  const next=typeof open==='boolean'?open:!chapterNav.classList.contains('open');
  chapterNav.classList.toggle('open',next);
  chapterToggle.setAttribute('aria-expanded',next?'true':'false');
}
function renderTerm(t){
  const speech=t.audioText||`${t.zh||''}，英文是 ${t.en||''}。${t.explanation||''}`;
  const enSpeech=t.enAudioText||t.en||'';
  return `<div class="term-card"><div class="term-head"><div><div class="term-zh">${escapeHtml(t.zh||'')}</div><div class="term-en-row"><div class="term-en">${escapeHtml(t.en||'')}</div>${enSpeech?`<button class="term-en-play play" data-speech="${escapeHtml(enSpeech)}" data-lang="en-US" aria-label="播放英文專有名詞" title="播放英文專有名詞">▶</button>`:''}</div></div><button class="term-play play" data-speech="${escapeHtml(speech)}" aria-label="播放專有名詞解釋" title="播放專有名詞解釋">▶</button></div><div class="term-exp">${escapeHtml(t.explanation||'')}</div><div class="term-transcript">${escapeHtml(speech)}</div></div>`;
}
function renderQuestionSet(items,prefix='recall',offset=0,total=items.length){
  return `<div class="recall-score" id="${prefix}Score-${offset}">這一組已作答 0 / ${items.length} 題</div>${items.map((q,localIndex)=>{
    const qi=offset+localIndex;
    return `<div class="recall-item" data-set="${prefix}" data-q="${qi}"><div class="recall-q">${qi+1}. ${q.question||''}</div><div class="recall-options">${(q.choices||[]).map(c=>`<button class="recall-choice" data-set="${prefix}" data-q="${qi}" data-score-id="${prefix}Score-${offset}" data-group-size="${items.length}" data-correct="${c.correct?'1':'0'}">${c.label||''}</button>`).join('')}</div><div class="recall-feedback" id="${prefix}-feedback-${qi}" data-correct-text="${escapeHtml(q.correctText||'答對了')}" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`;
  }).join('')}`;
}
function render(){
  SCREENS=buildScreens();
  if(!SCREENS.length){root.innerHTML='<div class="empty">請加入課程段落，或課程結尾的專有名詞／術語測驗／回想測驗。</div>';stepLabel.textContent='0 段';return}
  root.innerHTML=SCREENS.map((scr,i)=>{
    if(scr.type==='segment'){
      const s=scr.data;
      return `<section class="screen" data-step="${i}" data-time="${s.time||''}" style="display:${i===0?'flex':'none'}">
        <div class="eyebrow">${s.eyebrow||String(scr.segmentIndex+1).padStart(2,'0')}</div>
        <h1>${s.title||''}</h1>
        ${s.lead?`<p class="lead">${s.lead}</p>`:''}
        ${s.visualHtml?`<div class="visual">${s.visualHtml}</div>`:''}
        ${renderQuiz(s.quiz,scr.segmentIndex)}
        ${(s.audio&&s.audio.length)?`<div class="audio-stack">${s.audio.map(renderAudio).join('')}</div>`:''}
        ${(s.panels&&s.panels.length)?`<div class="assist"><div class="assist-label">想更懂時再展開</div>${s.panels.map(renderPanel).join('')}</div>`:''}
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='glossary'){
      return `<section class="screen" data-step="${i}" data-time="術語複習" style="display:none">
        <div class="eyebrow">專有名詞整理${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>把今天遇到的術語一次收好</h1>
        <p class="lead">中文、英文、白話解釋與語音放在一起。語音唸出的內容和下方逐字稿完全相同。</p>
        <div class="term-grid">${scr.data.map(renderTerm).join('')}</div>
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='termquiz'){
      return `<section class="screen" data-step="${i}" data-time="術語測驗" style="display:none">
        <div class="eyebrow">專有名詞記憶測驗${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>剛看完，現在把術語叫回來</h1>
        <p class="lead">專門練中英對照、定義辨識與名詞回想。重要術語至少要被考到一次。</p>
        ${renderQuestionSet(scr.data,'termquiz',scr.offset,(COURSE.termQuiz||[]).length)}
        ${navHtml(i)}
        <div class="tiny">題型可混合中→英、英→中、解釋→名詞｜術語多時自動分頁</div>
      </section>`;
    }
    return `<section class="screen" data-step="${i}" data-time="回想測驗" style="display:none">
      <div class="eyebrow">最後回想</div>
      <h1>不重看內容，試著想回來</h1>
      <p class="lead">這幾題抓整堂課最值得記住的概念、原因、步驟與代表性例子；專有名詞已經在上一輪另外練過。</p>
      ${renderQuestionSet(scr.data,'recall',0,(COURSE.recallQuiz||[]).length)}
      ${navHtml(i,true)}
      <div class="tiny">題數依課程內容決定｜重點是幫助回想，不是增加考試壓力</div>
    </section>`;
  }).join('');
  renderChapterNav();
  bind();show(0);
}
function navHtml(i,isLast=false){return `<div class="footer"><button class="btn secondary prev" ${i===0?'disabled':''}>上一段</button><button class="btn primary next">${isLast||i===SCREENS.length-1?'再看一次':'下一段'}</button></div>`}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel();document.querySelectorAll('.play').forEach(b=>b.textContent='▶')}
function show(i){
  stopSpeech(); const screens=[...document.querySelectorAll('.screen')];
  current=Math.max(0,Math.min(screens.length-1,i));
  screens.forEach((s,n)=>s.style.display=n===current?'flex':'none');
  bar.style.width=((current+1)/screens.length*100)+'%';
  const kind=SCREENS[current]?.type;
  const kindLabel=kind==='glossary'?'術語整理':kind==='termquiz'?'術語測驗':kind==='segment'?'學習':'回想測驗';
  stepLabel.textContent=`${kindLabel} · ${current+1} / ${screens.length}`;
  chapterToggle.textContent=`段落 ${current+1}/${screens.length} ▾`;
  chapterList.querySelectorAll('.chapter-item').forEach((item,n)=>{item.classList.toggle('active',n===current);item.setAttribute('aria-current',n===current?'step':'false')});
  timeLabel.textContent=screens[current].dataset.time||'';
  window.scrollTo({top:0,behavior:'smooth'});
}
function bind(){
  chapterToggle.onclick=()=>setChapterNav();
  document.querySelectorAll('.next').forEach((b,i)=>b.onclick=()=>show(i===SCREENS.length-1?0:i+1));
  document.querySelectorAll('.prev').forEach((b,i)=>b.onclick=()=>show(i-1));
  document.querySelectorAll('.play').forEach(btn=>btn.addEventListener('click',()=>{
    if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放；可直接閱讀下方逐字稿。');return}
    if(window.speechSynthesis.speaking){stopSpeech();return}
    const u=new SpeechSynthesisUtterance(btn.dataset.speech||'');u.lang=btn.dataset.lang||'zh-TW';u.rate=btn.dataset.lang==='en-US' ? .9 : .94;u.pitch=1;const original='▶';btn.textContent='❚❚';u.onend=()=>btn.textContent=original;u.onerror=()=>btn.textContent=original;window.speechSynthesis.speak(u)
  }));
  document.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{
    const idx=c.dataset.segment;const block=c.closest('.quiz-block');block.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById('feedback-'+idx);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show')
  }));
  const answeredBySet={};
  document.querySelectorAll('.recall-choice').forEach(c=>c.addEventListener('click',()=>{
    const qi=c.dataset.q;const setName=c.dataset.set||'recall';const item=c.closest('.recall-item');item.querySelectorAll('.recall-choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById(setName+'-feedback-'+qi);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show');
    const scoreId=c.dataset.scoreId;answeredBySet[scoreId] ||= new Set();answeredBySet[scoreId].add(qi);
    const score=document.getElementById(scoreId);if(score)score.textContent=`這一組已作答 ${answeredBySet[scoreId].size} / ${c.dataset.groupSize} 題`;
  }));
}
render();
</script>
</body>
</html>
