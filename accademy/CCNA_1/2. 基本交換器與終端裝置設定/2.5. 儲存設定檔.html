display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111827;padding:0;font-size:11px;font-weight:900;cursor:pointer;flex:0 0 24px;line-height:1}.term-play{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#111827;color:#fff;padding:0;font-size:16px;font-weight:900;cursor:pointer;flex:0 0 46px;line-height:1}.term-exp{font-size:16px;line-height:1.8;color:#374151;margin-top:10px}.term-transcript{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:16px;line-height:1.8;color:#4b5563}.term-transcript::before{content:'語音逐字稿';display:block;font-size:10.5px;letter-spacing:.08em;font-weight:900;color:#9ca3af;margin-bottom:4px}.recall-score{font-size:13px;color:var(--muted);margin:2px 0 12px}.recall-item{border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:11px;background:#fff}.recall-q{font-weight:900;font-size:16px;line-height:1.65;margin-bottom:9px}.recall-options{display:grid;gap:7px}.recall-choice{border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:13px 12px;font-size:16px;font-weight:750;cursor:pointer}.recall-choice.correct{border-color:#99f6e4;background:#ecfdf5;color:#065f46}.recall-choice.wrong{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.recall-feedback{display:none;margin-top:8px;padding:10px 11px;border-radius:11px;background:#f8fafc;font-size:16px;line-height:1.7}.recall-feedback.show{display:block}.section-kicker{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:10px}@media(max-width:360px){h1{font-size:29px}.screen{min-height:620px}.bigmath{font-size:31px}.audio-title{font-size:12px}.mode{display:none}.topbar{align-items:flex-start}}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-card{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}.compare-kicker{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:6px}.compare-title{font-size:18px;font-weight:950;overflow-wrap:anywhere}.compare-copy{font-size:16px;line-height:1.7;color:#374151;margin-top:7px}.flow{display:grid;gap:8px;align-items:center}.flow-node{padding:13px;border-radius:15px;border:1px solid var(--line);background:#f8fafc;text-align:center}.flow-node b{display:block;font-size:16px;line-height:1.5;overflow-wrap:anywhere}.flow-node span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.flow-arrow{text-align:center;font-size:22px;font-weight:900}.cmd-card{display:grid;gap:7px}.cmd-line{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#111827;color:#f9fafb;border-radius:11px;padding:10px 11px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.cmd-line.emph{font-size:15px;font-weight:900}.cmd-note{font-size:16px;line-height:1.7;color:#4b5563;margin:0 2px 4px}.decision{display:grid;gap:8px}.decision-q{font-size:18px;font-weight:950;text-align:center;padding:14px;background:#111827;color:#fff;border-radius:16px}.decision-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}.decision-row span{font-size:13px;color:var(--muted);font-weight:900}.decision-row b{font-size:16px;line-height:1.55}.cmd-sequence{display:grid;gap:8px}.cmd-sequence>div{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}.cmd-sequence>div>span{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#111827;color:#fff;border-radius:10px;font-size:13px;font-weight:900}.cmd-sequence code{font-size:14px;font-weight:900;overflow-wrap:anywhere}.cmd-sequence b{font-size:16px;line-height:1.55}.step-flow{display:grid;gap:8px}.step-flow>div{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff}.step-flow b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111827;color:#fff}.step-flow span{font-size:16px;line-height:1.65}.panel-extra{font-size:16px;line-height:1.8;margin:10px 0 0}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memory-grid div{padding:12px 8px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center}.memory-grid b{display:block;font-size:24px;margin-bottom:4px}.memory-grid span{font-size:13px;line-height:1.4;overflow-wrap:anywhere}.checklist{display:grid;gap:8px}.checklist div{font-size:16px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#f8fafc}@media(max-width:380px){.compare-grid{grid-template-columns:1fr}.decision-row{grid-template-columns:78px 1fr}.memory-grid{grid-template-columns:1fr}.cmd-line{font-size:13px}}

<body>
<div class="page">
  <div class="topbar"><div class="brand" id="brand">通勤微課 Template</div><div class="top-actions"><div class="mode">🎧 語音＋同步逐字稿</div><button type="button" class="chapter-toggle" id="chapterToggle" aria-expanded="false" aria-controls="chapterNav">段落</button></div></div>
  <main class="shell">
    <div class="progress-wrap"><div class="progress-row"><span id="stepLabel"></span><span id="timeLabel"></span></div><div class="track"><div class="bar" id="bar"></div></div></div>
    <nav class="chapter-nav" id="chapterNav" aria-label="課程段落導覽"><div class="chapter-nav-head"><div class="chapter-nav-title">跳到某一段</div><div class="chapter-nav-count" id="chapterNavCount"></div></div><div class="chapter-list" id="chapterList"></div></nav>
    <div id="lessonRoot"></div>
  </main>
</div>

<script>
/* ============================================================
   通勤微課內容模板

   核心原則：
   1. segments 沒有固定數量。依影片真正的「學習單元」決定。
   2. 不要為了湊段落而切段，也不要把兩個需要獨立理解的概念硬塞同一段。
   3. 每段 audio[].text 同時是「語音內容」與「逐字文字稿」的唯一來源，
      因此語音唸的字與畫面文字必定一致。
   4. audio、panels、quiz、visualHtml 都是可選的；內容需要才放。
   5. glossary 是課程結尾的專有名詞整理，可選、數量不限；每個術語提供中英對照、白話解釋與語音逐字稿。
   6. termQuiz 緊接在專有名詞後面，專門幫助記熟術語；至少讓每個重要術語被考到一次。
   7. terminology 的 en 欄位後面可顯示獨立英文發音按鈕；若提供 enAudioText，英文按鈕優先播放它。
      題型可輪替「中→英」「英→中」「解釋→名詞」，題數依術語數量決定，太多時自動分頁。
   7. recallQuiz 是最後的整課回想測驗，可選、題數不固定；依課程真正需要記住的重點決定。
   8. time 只是估計，不要求每段等長。
   9. 段落導覽會依實際內容自動產生，使用者可從任何位置直接跳到指定段落。
   ============================================================ */

const COURSE = {
  title: "2.5 儲存設定檔｜Cisco IOS 設定保存與還原",
  brand: "CCNA 通勤微課｜2.5 儲存設定檔",
  segments: [
    {
      eyebrow: "01 · 先分清兩份設定",
      title: "running-config 跟 startup-config 差在哪？",
      lead: "一份是設備現在正在用的設定；另一份是重新開機後要載入的設定。先分清 RAM 與 NVRAM，後面的儲存、還原才不會混亂。",
      time: "約 70 秒",
      visualHtml: `<div class="compare-grid"><div class="compare-card"><div class="compare-kicker">RAM · 現在正在跑</div><div class="compare-title">running-config</div><div class="compare-copy">修改後立刻影響設備運作；斷電或重新啟動後，未儲存的內容會消失。</div></div><div class="compare-card"><div class="compare-kicker">NVRAM · 下次開機要用</div><div class="compare-title">startup-config</div><div class="compare-copy">保存啟動時要載入的設定；非揮發性記憶體斷電後仍可保留內容。</div></div></div>`,
      audio: [
        {
          title: "白話解釋 · 兩份設定怎麼記",
          subtitle: "先把『現在』和『下次開機』分開",
          text: "把 Cisco 交換器想成正在編輯一份設定草稿。running-config 是現在設備正在使用的版本，放在 RAM；你在 CLI 做的修改通常會立刻反映在這裡。startup-config 則放在 NVRAM，是設備重新啟動時要載入的版本。只改 running-config 而沒有儲存，重新開機後這些變更可能就不見了。"
        }
      ],
      panels: [
        { title: "查看兩份設定的命令", kind: "detail", body: `<div class="cmd-card"><div class="cmd-line">show running-config</div><div class="cmd-note">查看目前 RAM 中的執行設定。</div><div class="cmd-line">show startup-config</div><div class="cmd-note">查看 NVRAM 中的啟動設定。</div></div>` }
      ]
    },
    {
      eyebrow: "02 · 把修改真的存下來",
      title: "完成設定後，要從 running-config 存到 startup-config",
      lead: "儲存不是自動發生。你要主動把目前執行中的設定複製到 NVRAM，才能避免重新啟動或斷電後遺失。",
      time: "約 65 秒",
      visualHtml: `<div class="flow"><div class="flow-node"><b>running-config</b><span>RAM</span></div><div class="flow-arrow">→</div><div class="flow-node"><b>copy running-config startup-config</b><span>儲存</span></div><div class="flow-arrow">→</div><div class="flow-node"><b>startup-config</b><span>NVRAM</span></div></div>`,
      quiz: {
        prompt: "你剛完成交換器設定，希望斷電後仍保留。下一個最關鍵的動作是？",
        choices: [
          { label: "A　執行 reload", correct: false },
          { label: "B　執行 copy running-config startup-config", correct: true },
          { label: "C　只執行 show running-config", correct: false }
        ],
        correctText: "✅ 對。這會把目前 running-config 備份成 NVRAM 裡的 startup-config。",
        wrongText: "提示：查看設定不等於儲存；重新啟動前要先把目前執行設定寫進 NVRAM。"
      },
      audio: [
        {
          title: "解題語音 · 儲存時腦中怎麼想",
          subtitle: "先確認，再複製，再驗證",
          text: "儲存設定時可以固定用三步思考。第一，先用 show running-config 確認現在的設定正確。第二，在特權 EXEC 模式執行 copy running-config startup-config，看到目的檔名提示時接受 startup-config，完成後會看到 OK。第三，再用 show startup-config 或查看 NVRAM，確認設定真的被保存。"
        }
      ],
      panels: [
        { title: "命令縮寫", kind: "note", body: `<div class="cmd-card"><div class="cmd-line">copy run start</div><div class="cmd-note">課程實作會問這個儲存命令的最短常用縮寫。</div><div class="cmd-line">show run</div><div class="cmd-note">show running-config 的常用縮寫。</div></div>` }
      ]
    },
    {
      eyebrow: "03 · 改錯了但還沒存",
      title: "未儲存的變更，可以用 reload 回到啟動設定",
      lead: "如果 running-config 的修改不如預期，而且還沒存進 startup-config，可以逐條移除改動，或重新載入裝置。",
      time: "約 70 秒",
      visualHtml: `<div class="decision"><div class="decision-q">running-config 改錯了，而且還沒儲存？</div><div class="decision-row"><span>少量錯誤</span><b>逐條移除／修正命令</b></div><div class="decision-row"><span>想整體回復</span><b>reload → 不儲存變更</b></div></div>`,
      quiz: {
        prompt: "執行 reload 時，IOS 發現有尚未儲存的變更並詢問是否儲存。你的目標是捨棄這些變更，應怎麼回答？",
        choices: [
          { label: "A　yes", correct: false },
          { label: "B　no", correct: true },
          { label: "C　copy", correct: false }
        ],
        correctText: "✅ 沒錯。選 no，才不會在 reload 前把原本想捨棄的變更存進 startup-config。",
        wrongText: "想一想：你的目標是『捨棄』未儲存變更，所以不能在重新載入前把它保存。"
      },
      audio: [
        {
          title: "白話解釋 · reload 的角色",
          subtitle: "它會造成短暫離線",
          text: "reload 可以讓設備重新啟動並重新載入 startup-config，因此能丟掉尚未儲存的 running-config 變更。要注意，重新載入期間設備會短暫離線，可能造成網路中斷。如果 IOS 問你是否要先儲存目前變更，而你的目的就是捨棄它們，就要回答 no。"
        }
      ],
      panels: [
        { title: "為什麼不是每次都 reload？", kind: "why", body: "因為 reload 會讓設備重新啟動，期間會暫時無法轉送流量。若只是少量命令輸入錯誤，先逐條修正通常比整台設備重新載入更合適。" }
      ]
    },
    {
      eyebrow: "04 · 連已儲存的設定都不要",
      title: "startup-config 已經存錯：erase startup-config 再重新載入",
      lead: "如果不需要的變更已經寫進 NVRAM，只 reload 還是會把錯誤的 startup-config 載回來。這時要先清除啟動設定。",
      time: "約 75 秒",
      visualHtml: `<div class="cmd-sequence"><div><span>1</span><code>erase startup-config</code></div><div><span>2</span><b>按 Enter 確認</b></div><div><span>3</span><code>reload</code></div><div><span>4</span><b>重新啟動後回到預設啟動狀態</b></div></div>`,
      audio: [
        {
          title: "操作語音 · 清除 NVRAM 中的啟動設定",
          subtitle: "這一步比單純 reload 更徹底",
          text: "當不需要的設定已經被存進 startup-config，就要在特權 EXEC 模式使用 erase startup-config。交換器會要求確認，按 Enter 接受。startup-config 從 NVRAM 移除後，再重新載入設備，RAM 中目前的 running-config 也會隨重啟消失；設備不再有剛才那份已儲存的啟動設定。"
        },

      correctText: "沒錯。教材明確指出 enable secret 會優先於 enable password。",
      wrongText: "回想 Packet Tracer 的 Step 6：它是較新的加密 secret，用於特權模式。"
    }
  ],

  recallQuiz: [
    {
      question: "你修改了 hostname，但還沒儲存。此時突然斷電，最可能失去哪一份內容？",
      choices: [
        { label: "尚未寫入 startup-config 的 running-config 變更", correct: true },
        { label: "NVRAM 本身一定會被清空", correct: false },
        { label: "MOTD 一定會永久保留，不受儲存影響", correct: false }
      ],
      correctText: "對。未儲存的變更只在 RAM 的 running-config，斷電後會失去。",
      wrongText: "先判斷這次修改有沒有從 RAM 寫進 NVRAM。"
    },
    {
      question: "設定完成後的最佳收尾順序是哪一個？",
      choices: [
        { label: "show run → copy running-config startup-config → 驗證 startup-config", correct: true },
        { label: "erase startup-config → reload → show run", correct: false },
        { label: "reload → enable → 不檢查設定", correct: false }
      ],
      correctText: "正確：先看、再存、最後驗。",
      wrongText: "回想 S1 儲存段落的三字口訣：看、存、驗。"
    },
    {
      question: "running-config 改錯而且尚未儲存，想整體回到原本啟動設定。哪個做法符合課程？",
      choices: [
        { label: "reload，遇到儲存提示時回答 no", correct: true },
        { label: "先 copy running-config startup-config 再 reload", correct: false },
        { label: "先 erase startup-config，再把錯誤設定存回去", correct: false }
      ],
      correctText: "對。不要在 reload 前把原本想捨棄的變更存下來。",
      wrongText: "如果你先 copy run start，就等於把錯誤正式保存了。"
    },
    {
      question: "錯誤設定已經寫進 startup-config，想清掉它。哪個流程最符合影片？",
      choices: [
        { label: "erase startup-config → 確認 → reload", correct: true },
        { label: "show run → enable → login", correct: false },
        { label: "service password-encryption → reload", correct: false }
      ],
      correctText: "正確。先清 NVRAM 裡的啟動設定，再重新載入。",
      wrongText: "只 reload 會再次讀取那份已經存錯的 startup-config。"
    },
    {
      question: "你要把設備設定另外留成可編輯文字備份，最合理的流程是？",
      choices: [
        { label: "開啟終端 logging → 顯示 running/startup config → 保存輸出檔", correct: true },
        { label: "只執行 enable secret", correct: false },
        { label: "只查看 dir nvram:，不記錄終端輸出", correct: false }
      ],
      correctText: "沒錯。影片示範就是利用終端機的 session logging 擷取設定文字。",
      wrongText: "重點是要把終端視窗顯示的文字真正寫到設備外的檔案。"
    },
    {
      question: "Packet Tracer 的 S2 練習真正要確認的是什麼？",
      choices: [
        { label: "能獨立重做設定、驗證並把設定保存到 startup-config", correct: true },
        { label: "只要把主機名稱改成 S2 就完成", correct: false },
        { label: "只要會背密碼，不必驗證與儲存", correct: false }
      ],
      correctText: "對。S2 是把前面查看、設定、保護、驗證與儲存整套流程再做一次。",
      wrongText: "回想 PDF 最後要求：名稱、console、特權密碼、MOTD、加密、確認設定，以及儲存。"
    }
  ]
};

const root=document.getElementById('lessonRoot');
const bar=document.getElementById('bar');
const stepLabel=document.getElementById('stepLabel');
const timeLabel=document.getElementById('timeLabel');
const chapterToggle=document.getElementById('chapterToggle');
const chapterNav=document.getElementById('chapterNav');
const chapterList=document.getElementById('chapterList');
const chapterNavCount=document.getElementById('chapterNavCount');
document.getElementById('brand').textContent=COURSE.brand||COURSE.title||'通勤微課';
document.title=(COURSE.title||'通勤微課')+'｜通勤微課';
let current=0;

function escapeHtml(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderAudio(a){return `<div class="audio${a.alt?' alt':''}"><button class="play" data-speech="${escapeHtml(a.text||'')}">▶</button><div><div class="audio-title">${a.title||'語音解釋'}</div><div class="audio-sub">${a.subtitle||''}</div></div><div class="inline-transcript">${escapeHtml(a.text||'')}</div></div>`}
function renderPanel(p){return `<details class="panel ${p.kind||'note'}" ${p.open?'open':''}><summary>${p.title||'補充'}</summary><div class="panel-body">${p.body||''}</div></details>`}
function renderQuiz(q,idx){if(!q)return'';return `<div class="quiz-block"><p class="lead" style="margin-bottom:8px">${q.prompt||''}</p><div class="quiz">${(q.choices||[]).map((c,i)=>`<button class="choice" data-segment="${idx}" data-correct="${c.correct?'1':'0'}">${c.label||('選項 '+(i+1))}</button>`).join('')}</div><div class="feedback" id="feedback-${idx}" data-correct-text="${escapeHtml(q.correctText||'✅ 正確') }" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`}
function buildScreens(){
  const screens=[];
  (COURSE.segments||[]).forEach((s,i)=>screens.push({type:'segment',data:s,segmentIndex:i}));
  const terms=COURSE.glossary||[];
  const glossaryChunkSize=4; // 手機上一頁最多約 4 個術語；超過就自動分頁，不限制總數。
  for(let i=0;i<terms.length;i+=glossaryChunkSize){
    screens.push({type:'glossary',data:terms.slice(i,i+glossaryChunkSize),page:Math.floor(i/glossaryChunkSize)+1,pages:Math.ceil(terms.length/glossaryChunkSize)});
  }
  const termQuiz=COURSE.termQuiz||[];
  const quizChunkSize=5; // 術語很多時不要一頁塞太多題，自動分批複習。
  for(let i=0;i<termQuiz.length;i+=quizChunkSize){
    screens.push({type:'termquiz',data:termQuiz.slice(i,i+quizChunkSize),offset:i,page:Math.floor(i/quizChunkSize)+1,pages:Math.ceil(termQuiz.length/quizChunkSize)});
  }
  if((COURSE.recallQuiz||[]).length) screens.push({type:'recall',data:COURSE.recallQuiz,offset:0});
  return screens;
}
let SCREENS=[];
function screenMeta(scr,index){
  if(scr.type==='segment'){
    const s=scr.data||{};
    return {kicker:s.eyebrow||`學習 ${scr.segmentIndex+1}`,name:s.title||`學習段落 ${scr.segmentIndex+1}`};
  }
  if(scr.type==='glossary') return {kicker:`專有名詞整理${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞複習'};
  if(scr.type==='termquiz') return {kicker:`術語測驗${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞記憶測驗'};
  return {kicker:'最後回想',name:'整堂課回想測驗'};
}
function renderChapterNav(){
  chapterNavCount.textContent=`共 ${SCREENS.length} 段`;
  chapterList.innerHTML=SCREENS.map((scr,i)=>{
    const m=screenMeta(scr,i);
    return `<button type="button" class="chapter-item${i===current?' active':''}" data-jump="${i}" aria-current="${i===current?'step':'false'}"><span class="chapter-num">${i+1}</span><span class="chapter-copy"><span class="chapter-kicker">${escapeHtml(m.kicker)}</span><span class="chapter-name">${escapeHtml(m.name)}</span></span></button>`;
  }).join('');
  chapterList.querySelectorAll('.chapter-item').forEach(btn=>btn.addEventListener('click',()=>{
    show(Number(btn.dataset.jump));
    setChapterNav(false);
  }));
}
function setChapterNav(open){
  const next=typeof open==='boolean'?open:!chapterNav.classList.contains('open');
  chapterNav.classList.toggle('open',next);
  chapterToggle.setAttribute('aria-expanded',next?'true':'false');
}
function renderTerm(t){
  const speech=t.audioText||`${t.zh||''}，英文是 ${t.en||''}。${t.explanation||''}`;
  const enSpeech=t.enAudioText||t.en||'';
  return `<div class="term-card"><div class="term-head"><div><div class="term-zh">${escapeHtml(t.zh||'')}</div><div class="term-en-row"><div class="term-en">${escapeHtml(t.en||'')}</div>${enSpeech?`<button class="term-en-play play" data-speech="${escapeHtml(enSpeech)}" data-lang="en-US" aria-label="播放英文專有名詞" title="播放英文專有名詞">▶</button>`:''}</div></div><button class="term-play play" data-speech="${escapeHtml(speech)}" aria-label="播放專有名詞解釋" title="播放專有名詞解釋">▶</button></div><div class="term-exp">${escapeHtml(t.explanation||'')}</div><div class="term-transcript">${escapeHtml(speech)}</div></div>`;
}
function renderQuestionSet(items,prefix='recall',offset=0,total=items.length){
  return `<div class="recall-score" id="${prefix}Score-${offset}">這一組已作答 0 / ${items.length} 題</div>${items.map((q,localIndex)=>{
    const qi=offset+localIndex;
    return `<div class="recall-item" data-set="${prefix}" data-q="${qi}"><div class="recall-q">${qi+1}. ${q.question||''}</div><div class="recall-options">${(q.choices||[]).map(c=>`<button class="recall-choice" data-set="${prefix}" data-q="${qi}" data-score-id="${prefix}Score-${offset}" data-group-size="${items.length}" data-correct="${c.correct?'1':'0'}">${c.label||''}</button>`).join('')}</div><div class="recall-feedback" id="${prefix}-feedback-${qi}" data-correct-text="${escapeHtml(q.correctText||'答對了')}" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`;
  }).join('')}`;
}
function render(){
  SCREENS=buildScreens();
  if(!SCREENS.length){root.innerHTML='<div class="empty">請加入課程段落，或課程結尾的專有名詞／術語測驗／回想測驗。</div>';stepLabel.textContent='0 段';return}
  root.innerHTML=SCREENS.map((scr,i)=>{
    if(scr.type==='segment'){
      const s=scr.data;
      return `<section class="screen" data-step="${i}" data-time="${s.time||''}" style="display:${i===0?'flex':'none'}">
        <div class="eyebrow">${s.eyebrow||String(scr.segmentIndex+1).padStart(2,'0')}</div>
        <h1>${s.title||''}</h1>
        ${s.lead?`<p class="lead">${s.lead}</p>`:''}
        ${s.visualHtml?`<div class="visual">${s.visualHtml}</div>`:''}
        ${renderQuiz(s.quiz,scr.segmentIndex)}
        ${(s.audio&&s.audio.length)?`<div class="audio-stack">${s.audio.map(renderAudio).join('')}</div>`:''}
        ${(s.panels&&s.panels.length)?`<div class="assist"><div class="assist-label">想更懂時再展開</div>${s.panels.map(renderPanel).join('')}</div>`:''}
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='glossary'){
      return `<section class="screen" data-step="${i}" data-time="術語複習" style="display:none">
        <div class="eyebrow">專有名詞整理${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>把今天遇到的術語一次收好</h1>
        <p class="lead">中文、英文、白話解釋與語音放在一起。語音唸出的內容和下方逐字稿完全相同。</p>
        <div class="term-grid">${scr.data.map(renderTerm).join('')}</div>
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='termquiz'){
      return `<section class="screen" data-step="${i}" data-time="術語測驗" style="display:none">
        <div class="eyebrow">專有名詞記憶測驗${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>剛看完，現在把術語叫回來</h1>
        <p class="lead">專門練中英對照、定義辨識與名詞回想。重要術語至少要被考到一次。</p>
        ${renderQuestionSet(scr.data,'termquiz',scr.offset,(COURSE.termQuiz||[]).length)}
        ${navHtml(i)}
        <div class="tiny">題型可混合中→英、英→中、解釋→名詞｜術語多時自動分頁</div>
      </section>`;
    }
    return `<section class="screen" data-step="${i}" data-time="回想測驗" style="display:none">
      <div class="eyebrow">最後回想</div>
      <h1>不重看內容，試著想回來</h1>
      <p class="lead">這幾題抓整堂課最值得記住的概念、原因、步驟與代表性例子；專有名詞已經在上一輪另外練過。</p>
      ${renderQuestionSet(scr.data,'recall',0,(COURSE.recallQuiz||[]).length)}
      ${navHtml(i,true)}
      <div class="tiny">題數依課程內容決定｜重點是幫助回想，不是增加考試壓力</div>
    </section>`;
  }).join('');
  renderChapterNav();
  bind();show(0);
}
function navHtml(i,isLast=false){return `<div class="footer"><button class="btn secondary prev" ${i===0?'disabled':''}>上一段</button><button class="btn primary next">${isLast||i===SCREENS.length-1?'再看一次':'下一段'}</button></div>`}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel();document.querySelectorAll('.play').forEach(b=>b.textContent='▶')}
function show(i){
  stopSpeech(); const screens=[...document.querySelectorAll('.screen')];
  current=Math.max(0,Math.min(screens.length-1,i));
  screens.forEach((s,n)=>s.style.display=n===current?'flex':'none');
  bar.style.width=((current+1)/screens.length*100)+'%';
  const kind=SCREENS[current]?.type;
  const kindLabel=kind==='glossary'?'術語整理':kind==='termquiz'?'術語測驗':kind==='segment'?'學習':'回想測驗';
  stepLabel.textContent=`${kindLabel} · ${current+1} / ${screens.length}`;
  chapterToggle.textContent=`段落 ${current+1}/${screens.length} ▾`;
  chapterList.querySelectorAll('.chapter-item').forEach((item,n)=>{item.classList.toggle('active',n===current);item.setAttribute('aria-current',n===current?'step':'false')});
  timeLabel.textContent=screens[current].dataset.time||'';
  window.scrollTo({top:0,behavior:'smooth'});
}
function bind(){
  chapterToggle.onclick=()=>setChapterNav();
  document.querySelectorAll('.next').forEach((b,i)=>b.onclick=()=>show(i===SCREENS.length-1?0:i+1));
  document.querySelectorAll('.prev').forEach((b,i)=>b.onclick=()=>show(i-1));
  document.querySelectorAll('.play').forEach(btn=>btn.addEventListener('click',()=>{
    if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放；可直接閱讀下方逐字稿。');return}
    if(window.speechSynthesis.speaking){stopSpeech();return}
    const u=new SpeechSynthesisUtterance(btn.dataset.speech||'');u.lang=btn.dataset.lang||'zh-TW';u.rate=btn.dataset.lang==='en-US' ? .9 : .94;u.pitch=1;const original='▶';btn.textContent='❚❚';u.onend=()=>btn.textContent=original;u.onerror=()=>btn.textContent=original;window.speechSynthesis.speak(u)
  }));
  document.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{
    const idx=c.dataset.segment;const block=c.closest('.quiz-block');block.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById('feedback-'+idx);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show')
  }));
  const answeredBySet={};
  document.querySelectorAll('.recall-choice').forEach(c=>c.addEventListener('click',()=>{
    const qi=c.dataset.q;const setName=c.dataset.set||'recall';const item=c.closest('.recall-item');item.querySelectorAll('.recall-choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById(setName+'-feedback-'+qi);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show');
    const scoreId=c.dataset.scoreId;answeredBySet[scoreId] ||= new Set();answeredBySet[scoreId].add(qi);
    const score=document.getElementById(scoreId);if(score)score.textContent=`這一組已作答 ${answeredBySet[scoreId].size} / ${c.dataset.groupSize} 題`;
  }));
}
render();
</script>
</body>
</html>
