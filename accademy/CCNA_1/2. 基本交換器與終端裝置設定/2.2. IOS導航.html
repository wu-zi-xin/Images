;padding-top:8px}.assist-label{font-size:12px;font-weight:900;color:var(--muted);margin:4px 0 8px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;overflow:hidden}.panel summary{cursor:pointer;list-style:none;padding:12px 13px;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:space-between}.panel summary::-webkit-details-marker{display:none}.panel summary::after{content:'＋';color:#9ca3af;font-size:18px}.panel[open] summary::after{content:'－'}.panel-body{padding:0 13px 13px;font-size:14px;line-height:1.72;color:#374151}.panel.why{background:#fffbeb}.panel.detail{background:#eff6ff}.panel.note{background:#f8fafc}.quiz{display:grid;gap:9px;margin:8px 0 12px}.choice{border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left;padding:14px 15px;font-size:15px;font-weight:800;cursor:pointer}.choice.correct{border-color:#99f6e4;background:#ecfdf5;color:#065f46}.choice.wrong{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.feedback{display:none;padding:11px 13px;border-radius:13px;background:#f8fafc;font-size:14px;line-height:1.6}.feedback.show{display:block}.footer{margin-top:auto;padding-top:15px;display:flex;gap:9px}.btn{flex:1;border:0;border-radius:15px;padding:13px 15px;font-weight:900;cursor:pointer}.secondary{background:#f3f4f6;color:#1f2937}.primary{background:#111827;color:#fff}.btn:disabled{opacity:.35}.tiny{text-align:center;color:var(--muted);font-size:11.5px;margin-top:10px}.empty{padding:28px 16px;text-align:center;color:var(--muted);line-height:1.7}.term-grid{display:grid;gap:10px;margin:8px 0 12px}.term-card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px}.term-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.term-zh{font-size:18px;font-weight:950}.term-en-row{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}.term-en{font-size:12px;color:var(--muted)}.term-en-play{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111827;padding:0;font-size:11px;font-weight:900;cursor:pointer;flex:0 0 24px;line-height:1}.term-play{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#111827;color:#fff;padding:0;font-size:16px;font-weight:900;cursor:pointer;flex:0 0 40px;line-height:1}.term-exp{font-size:14px;line-height:1.7;color:#374151;margin-top:10px}.term-transcript{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.75;color:#4b5563}.term-transcript::before{content:'語音逐字稿';display:block;font-size:10.5px;letter-spacing:.08em;font-weight:900;color:#9ca3af;margin-bottom:4px}.recall-score{font-size:13px;color:var(--muted);margin:2px 0 12px}.recall-item{border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:11px;background:#fff}.recall-q{font-weight:900;font-size:15px;line-height:1.55;margin-bottom:9px}.recall-options{display:grid;gap:7px}.recall-choice{border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:11px 12px;font-size:14px;font-weight:750;cursor:pointer}.recall-choice.correct{border-color:#99f6e4;background:#ecfdf5;color:#065f46}.recall-choice.wrong{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.recall-feedback{display:none;margin-top:8px;padding:9px 10px;border-radius:11px;background:#f8fafc;font-size:13px;line-height:1.55}.recall-feedback.show{display:block}.section-kicker{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:10px}@media(max-width:360px){h1{font-size:24px}.screen{min-height:620px}.bigmath{font-size:31px}.audio-title{font-size:12px}.mode{display:none}.topbar{align-items:flex-start}}

  <main class="shell">

<script>
/* ============================================================
   通勤微課內容模板

   核心原則：
   1. segments 沒有固定數量。依影片真正的「學習單元」決定。
   2. 不要為了湊段落而切段，也不要把兩個需要獨立理解的概念硬塞同一段。
   3. 每段 audio[].text 同時是「語音內容」與「逐字文字稿」的唯一來源，
      因此語音唸的字與畫面文字必定一致。
   4. audio、panels、quiz、visualHtml 都是可選的；內容需要才放。
   5. glossary 是課程結尾的專有名詞整理，可選、數量不限；每個術語提供中英對照、白話解釋與語音逐字稿。
   6. termQuiz 緊接在專有名詞後面，專門幫助記熟術語；至少讓每個重要術語被考到一次。
   7. terminology 的 en 欄位後面可顯示獨立英文發音按鈕；若提供 enAudioText，英文按鈕優先播放它。
      題型可輪替「中→英」「英→中」「解釋→名詞」，題數依術語數量決定，太多時自動分頁。
   7. recallQuiz 是最後的整課回想測驗，可選、題數不固定；依課程真正需要記住的重點決定。
   8. time 只是估計，不要求每段等長。
   9. 段落導覽會依實際內容自動產生，使用者可從任何位置直接跳到指定段落。
   ============================================================ */

const COURSE = {
  title: "2.2 IOS 導航｜CLI 模式與切換",
  brand: "CCNA 通勤微課",
  segments: [
    {
      eyebrow: "01 · 主要命令模式",
      title: "先看提示字元：你現在能做多少事？",
      lead: "IOS CLI 不是所有命令都能在同一個地方輸入；先辨認目前模式，再決定下一步。",
      time: "約 55 秒",
      visualHtml: `<div style="display:grid;gap:10px">
        <div class="callout"><b>使用者 EXEC 模式</b><br><code style="font-size:18px;font-weight:900">Switch&gt;</code><br>只能存取有限數量的基本監視命令。</div>
        <div class="callout"><b>特權 EXEC 模式</b><br><code style="font-size:18px;font-weight:900">Switch#</code><br>可存取更多命令與功能，也是進入設定模式前的重要位置。</div>
      </div>`,
      audio: [
        {
          title: "白話解釋 · 先認位置",
          subtitle: "不看畫面也能跟上",
          text: "在 Cisco IOS 裡，命令會依目前模式分層。看到 Switch 大於符號，代表你在使用者 EXEC 模式；看到 Switch 井字號，代表你在特權 EXEC 模式。先認得提示字元，就知道目前大概有哪些操作權限，也知道接下來該往哪個模式移動。"
        }
      ],
      quiz: {
        prompt: "看到哪一個提示字元，代表目前在特權 EXEC 模式？",
        choices: [
          { label: "A　Switch>", correct: false },
          { label: "B　Switch#", correct: true },
          { label: "C　Switch(config)#", correct: false }
        ],
        correctText: "✅ 對。Switch# 代表特權 EXEC 模式。",
        wrongText: "提示：使用者 EXEC 以 > 結尾；特權 EXEC 以 # 結尾。"
      }
    },
    {
      eyebrow: "02 · 設定模式與子模式",
      title: "要改設定，就會進入 config 的層級",
      lead: "全域設定模式影響裝置整體；再往下可以進入線路或介面等子設定模式。",
      time: "約 65 秒",
      visualHtml: `<div style="display:grid;gap:8px">
        <div class="callout"><code style="font-size:17px;font-weight:900">Switch(config)#</code><br><b>全域設定模式</b>：用來進行會影響裝置整體的設定。</div>
        <div class="callout"><code style="font-size:17px;font-weight:900">Switch(config-line)#</code><br><b>線路設定模式</b>：用於主控台、SSH、Telnet 或 AUX 存取相關設定。</div>
        <div class="callout"><code style="font-size:17px;font-weight:900">Switch(config-if)#</code><br><b>介面設定模式</b>：用於交換器連接埠或網路介面設定。</div>
      </div>`,
      audio: [
        {
          title: "白話解釋 · 為什麼有子模式？",
          subtitle: "不同設定放在不同層級",
          text: "如果要修改裝置設定，會先進入全域設定模式，提示字元會出現 config。接著依要設定的對象，再進入子設定模式。例如線路設定模式的提示字元是 config-line，介面設定模式則是 config-if。這些提示字元不只是外觀不同，而是在告訴你目前正在設定哪一類物件。"
        }
      ],
      panels: [
        { title: "把模式想成資料夾", kind: "why", body: "可以把 IOS 模式想成一層一層的資料夾：EXEC 是入口；全域設定是設定區；line 與 interface 則是更細的子資料夾。命令是否可用，取決於你目前站在哪一層。" }
      ]
    },
    {
      eyebrow: "03 · 提示字元判讀",
      title: "提示字元就是你的『目前位置』",
      lead: "在輸入命令前，先用提示字元確認自己身在何處。",
      time: "約 50 秒",
      visualHtml: `<div style="border:1px solid #e6e8ec;border-radius:18px;overflow:hidden">
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;background:#f8fafc;font-weight:900"><span>提示字元</span><span>所在模式</span></div>
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;border-top:1px solid #e6e8ec"><code>Switch&gt;</code><span>使用者 EXEC</span></div>
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;border-top:1px solid #e6e8ec"><code>Switch#</code><span>特權 EXEC</span></div>
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;border-top:1px solid #e6e8ec"><code>Switch(config)#</code><span>全域設定</span></div>
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;border-top:1px solid #e6e8ec"><code>Switch(config-line)#</code><span>線路設定</span></div>
        <div style="display:grid;grid-template-columns:1.15fr 1fr;padding:11px 12px;border-top:1px solid #e6e8ec"><code>Switch(config-if)#</code><span>介面設定</span></div>
      </div>`,
      audio: [
        {
          title: "解題語音 · 先看括號",
          subtitle: "快速判讀模式",
          text: "判讀提示字元時，可以先看結尾。如果只有大於符號，是使用者 EXEC；只有井字號，是特權 EXEC。如果看到括號 config，就已經進入設定層級。config-line 代表線路子模式，config-if 代表介面子模式。做題或實作時，先認提示字元，再想命令，會比直接背命令穩定。"
        }
      ],
      quiz: {
        prompt: "目前提示字元是 Switch(config-line)#。你最直接能判斷出什麼？",
        choices: [
          { label: "A　正在使用者 EXEC 模式", correct: false },
          { label: "B　正在設定線路相關項目", correct: true },
          { label: "C　已經離開設定模式", correct: false }
        ],
        correctText: "✅ 沒錯。config-line 就是在告訴你目前位於線路設定子模式。",
        wrongText: "先看括號裡的關鍵字：line 指向線路設定子模式。"
      }
    },
    {
      eyebrow: "04 · EXEC 模式切換",
      title: "enable 往上，disable 回來",
      lead: "在使用者 EXEC 與特權 EXEC 之間，最重要的是把方向記清楚。",
      time: "約 45 秒",
      visualHtml: `<div class="bigmath" style="font-size:21px;line-height:1.8;letter-spacing:0">
        <code>Switch&gt;</code><br>
        <span style="font-size:15px">↓ enable</span><br>
        <code>Switch#</code><br>
        <span style="font-size:15px">↓ disable</span><br>
        <code>Switch&gt;</code>
      </div>`,
      audio: [
        {
          title: "白話解釋 · 記方向",
          subtitle: "enable 進特權，disable 回使用者",
          text: "從使用者 EXEC 模式要進入特權 EXEC 模式，輸入 enable。從特權 EXEC 模式要回到使用者 EXEC 模式，輸入 disable。畫面上最直接的變化，就是提示字元從大於符號變成井字號，或再從井字號回到大於符號。"
        }
      ],
      quiz: {
        prompt: "你目前看到 Switch>，下一步要進入特權 EXEC 模式，應輸入什麼？",
        choices: [
          { label: "A　enable", correct: true },
          { label: "B　disable", correct: false },
          { label: "C　exit", correct: false }
        ],
        correctText: "✅ enable 會把 Switch> 帶到 Switch#。",
        wrongText: "想像權限往上一層：enable 是進入特權 EXEC 的命令。"
      }
    },
    {
      eyebrow: "05 · 進入全域設定",
      title: "configure terminal 進 config，exit 退一層",
      lead: "真正要設定交換器時，要先站在特權 EXEC，再進入全域設定模式。",
      time: "約 60 秒",
      visualHtml: `<div class="bigmath" style="font-size:19px;line-height:1.75;letter-spacing:0">
        <code>Switch#</code><br>
        <span style="font-size:14px">configure terminal</span><br>
        ↓<br>
        <code>Switch(config)#</code><br>
        <span style="font-size:14px">exit</span><br>
        ↓<br>
        <code>Switch#</code>
      </div>`,
      audio: [
        {
          title: "解題語音 · 兩步進設定",
          subtitle: "先特權，再 config",
          text: "要進入全域設定模式，先確定提示字元是 Switch 井字號，也就是特權 EXEC。接著輸入 configure terminal，提示字元會變成 Switch 括號 config 井字號。若在全域設定模式輸入 exit，就會退回特權 EXEC。"
        }
      ],
      panels: [
        { title: "影片中也示範縮寫", kind: "note", body: "示範畫面使用了 <code>config t</code> 作為 <code>configure terminal</code> 的縮寫形式；核心概念仍是從特權 EXEC 進入全域設定模式。" }
      ],
      quiz: {
        prompt: "現在是 Switch#。要進入 Switch(config)#，哪個命令符合影片中的流程？",
        choices: [
          { label: "A　configure terminal", correct: true },
          { label: "B　disable", correct: false },
          { label: "C　end", correct: false }
        ],
        correctText: "✅ 對。從特權 EXEC 使用 configure terminal 進入全域設定模式。",
        wrongText: "先找『進入設定』的命令；disable 是回使用者 EXEC，end 是離開設定層級。"
      }
    },
    {

const root=document.getElementById('lessonRoot');

document.getElementById('brand').textContent=COURSE.brand||COURSE.title||'通勤微課';
document.title=(COURSE.title||'通勤微課')+'｜通勤微課';
let current=0;

function escapeHtml(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderAudio(a){return `<div class="audio${a.alt?' alt':''}"><button class="play" data-speech="${escapeHtml(a.text||'')}">▶</button><div><div class="audio-title">${a.title||'語音解釋'}</div><div class="audio-sub">${a.subtitle||''}</div></div><div class="inline-transcript">${escapeHtml(a.text||'')}</div></div>`}
function renderPanel(p){return `<details class="panel ${p.kind||'note'}" ${p.open?'open':''}><summary>${p.title||'補充'}</summary><div class="panel-body">${p.body||''}</div></details>`}
function renderQuiz(q,idx){if(!q)return'';return `<div class="quiz-block"><p class="lead" style="margin-bottom:8px">${q.prompt||''}</p><div class="quiz">${(q.choices||[]).map((c,i)=>`<button class="choice" data-segment="${idx}" data-correct="${c.correct?'1':'0'}">${c.label||('選項 '+(i+1))}</button>`).join('')}</div><div class="feedback" id="feedback-${idx}" data-correct-text="${escapeHtml(q.correctText||'✅ 正確') }" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`}
function buildScreens(){
  const screens=[];
  (COURSE.segments||[]).forEach((s,i)=>screens.push({type:'segment',data:s,segmentIndex:i}));
  const terms=COURSE.glossary||[];
  const glossaryChunkSize=4; // 手機上一頁最多約 4 個術語；超過就自動分頁，不限制總數。
  for(let i=0;i<terms.length;i+=glossaryChunkSize){
    screens.push({type:'glossary',data:terms.slice(i,i+glossaryChunkSize),page:Math.floor(i/glossaryChunkSize)+1,pages:Math.ceil(terms.length/glossaryChunkSize)});
  }
  const termQuiz=COURSE.termQuiz||[];
  const quizChunkSize=5; // 術語很多時不要一頁塞太多題，自動分批複習。
  for(let i=0;i<termQuiz.length;i+=quizChunkSize){
    screens.push({type:'termquiz',data:termQuiz.slice(i,i+quizChunkSize),offset:i,page:Math.floor(i/quizChunkSize)+1,pages:Math.ceil(termQuiz.length/quizChunkSize)});
  }
  if((COURSE.recallQuiz||[]).length) screens.push({type:'recall',data:COURSE.recallQuiz,offset:0});
  return screens;
}
let SCREENS=[];
function screenMeta(scr,index){
  if(scr.type==='segment'){
    const s=scr.data||{};
    return {kicker:s.eyebrow||`學習 ${scr.segmentIndex+1}`,name:s.title||`學習段落 ${scr.segmentIndex+1}`};
  }
  if(scr.type==='glossary') return {kicker:`專有名詞整理${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞複習'};
  if(scr.type==='termquiz') return {kicker:`術語測驗${scr.pages>1?` ${scr.page}/${scr.pages}`:''}`,name:'專有名詞記憶測驗'};
  return {kicker:'最後回想',name:'整堂課回想測驗'};
}
function renderChapterNav(){
  chapterNavCount.textContent=`共 ${SCREENS.length} 段`;
  chapterList.innerHTML=SCREENS.map((scr,i)=>{
    const m=screenMeta(scr,i);
    return `<button type="button" class="chapter-item${i===current?' active':''}" data-jump="${i}" aria-current="${i===current?'step':'false'}"><span class="chapter-num">${i+1}</span><span class="chapter-copy"><span class="chapter-kicker">${escapeHtml(m.kicker)}</span><span class="chapter-name">${escapeHtml(m.name)}</span></span></button>`;
  }).join('');
  chapterList.querySelectorAll('.chapter-item').forEach(btn=>btn.addEventListener('click',()=>{
    show(Number(btn.dataset.jump));
    setChapterNav(false);
  }));
}
function setChapterNav(open){
  const next=typeof open==='boolean'?open:!chapterNav.classList.contains('open');
  chapterNav.classList.toggle('open',next);
  chapterToggle.setAttribute('aria-expanded',next?'true':'false');
}
function renderTerm(t){
  const speech=t.audioText||`${t.zh||''}，英文是 ${t.en||''}。${t.explanation||''}`;
  const enSpeech=t.enAudioText||t.en||'';
  return `<div class="term-card"><div class="term-head"><div><div class="term-zh">${escapeHtml(t.zh||'')}</div><div class="term-en-row"><div class="term-en">${escapeHtml(t.en||'')}</div>${enSpeech?`<button class="term-en-play play" data-speech="${escapeHtml(enSpeech)}" data-lang="en-US" aria-label="播放英文專有名詞" title="播放英文專有名詞">▶</button>`:''}</div></div><button class="term-play play" data-speech="${escapeHtml(speech)}" aria-label="播放專有名詞解釋" title="播放專有名詞解釋">▶</button></div><div class="term-exp">${escapeHtml(t.explanation||'')}</div><div class="term-transcript">${escapeHtml(speech)}</div></div>`;
}
function renderQuestionSet(items,prefix='recall',offset=0,total=items.length){
  return `<div class="recall-score" id="${prefix}Score-${offset}">這一組已作答 0 / ${items.length} 題</div>${items.map((q,localIndex)=>{
    const qi=offset+localIndex;
    return `<div class="recall-item" data-set="${prefix}" data-q="${qi}"><div class="recall-q">${qi+1}. ${q.question||''}</div><div class="recall-options">${(q.choices||[]).map(c=>`<button class="recall-choice" data-set="${prefix}" data-q="${qi}" data-score-id="${prefix}Score-${offset}" data-group-size="${items.length}" data-correct="${c.correct?'1':'0'}">${c.label||''}</button>`).join('')}</div><div class="recall-feedback" id="${prefix}-feedback-${qi}" data-correct-text="${escapeHtml(q.correctText||'答對了')}" data-wrong-text="${escapeHtml(q.wrongText||'再想一下')}"></div></div>`;
  }).join('')}`;
}

  SCREENS=buildScreens();

  root.innerHTML=SCREENS.map((scr,i)=>{
    if(scr.type==='segment'){
      const s=scr.data;
      return `<section class="screen" data-step="${i}" data-time="${s.time||''}" style="display:${i===0?'flex':'none'}">
        <div class="eyebrow">${s.eyebrow||String(scr.segmentIndex+1).padStart(2,'0')}</div>
        <h1>${s.title||''}</h1>
        ${s.lead?`<p class="lead">${s.lead}</p>`:''}
        ${s.visualHtml?`<div class="visual">${s.visualHtml}</div>`:''}
        ${renderQuiz(s.quiz,scr.segmentIndex)}
        ${(s.audio&&s.audio.length)?`<div class="audio-stack">${s.audio.map(renderAudio).join('')}</div>`:''}
        ${(s.panels&&s.panels.length)?`<div class="assist"><div class="assist-label">想更懂時再展開</div>${s.panels.map(renderPanel).join('')}</div>`:''}
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='glossary'){
      return `<section class="screen" data-step="${i}" data-time="術語複習" style="display:none">
        <div class="eyebrow">專有名詞整理${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>把今天遇到的術語一次收好</h1>
        <p class="lead">中文、英文、白話解釋與語音放在一起。語音唸出的內容和下方逐字稿完全相同。</p>
        <div class="term-grid">${scr.data.map(renderTerm).join('')}</div>
        ${navHtml(i)}
      </section>`;
    }
    if(scr.type==='termquiz'){
      return `<section class="screen" data-step="${i}" data-time="術語測驗" style="display:none">
        <div class="eyebrow">專有名詞記憶測驗${scr.pages>1?` · ${scr.page}/${scr.pages}`:''}</div>
        <h1>剛看完，現在把術語叫回來</h1>
        <p class="lead">專門練中英對照、定義辨識與名詞回想。重要術語至少要被考到一次。</p>
        ${renderQuestionSet(scr.data,'termquiz',scr.offset,(COURSE.termQuiz||[]).length)}
        ${navHtml(i)}
        <div class="tiny">題型可混合中→英、英→中、解釋→名詞｜術語多時自動分頁</div>
      </section>`;
    }
    return `<section class="screen" data-step="${i}" data-time="回想測驗" style="display:none">
      <div class="eyebrow">最後回想</div>
      <h1>不重看內容，試著想回來</h1>
      <p class="lead">這幾題抓整堂課最值得記住的概念、原因、步驟與代表性例子；專有名詞已經在上一輪另外練過。</p>
      ${renderQuestionSet(scr.data,'recall',0,(COURSE.recallQuiz||[]).length)}
      ${navHtml(i,true)}
      <div class="tiny">題數依課程內容決定｜重點是幫助回想，不是增加考試壓力</div>
    </section>`;
  }).join('');
  renderChapterNav();
  bind();show(0);
}
function navHtml(i,isLast=false){return `<div class="footer"><button class="btn secondary prev" ${i===0?'disabled':''}>上一段</button><button class="btn primary next">${isLast||i===SCREENS.length-1?'再看一次':'下一段'}</button></div>`}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel();document.querySelectorAll('.play').forEach(b=>b.textContent='▶')}
function show(i){
  stopSpeech(); const screens=[...document.querySelectorAll('.screen')];
  current=Math.max(0,Math.min(screens.length-1,i));
  screens.forEach((s,n)=>s.style.display=n===current?'flex':'none');
  bar.style.width=((current+1)/screens.length*100)+'%';
  const kind=SCREENS[current]?.type;
  const kindLabel=kind==='glossary'?'術語整理':kind==='termquiz'?'術語測驗':kind==='segment'?'學習':'回想測驗';
  stepLabel.textContent=`${kindLabel} · ${current+1} / ${screens.length}`;
  chapterToggle.textContent=`段落 ${current+1}/${screens.length} ▾`;
  chapterList.querySelectorAll('.chapter-item').forEach((item,n)=>{item.classList.toggle('active',n===current);item.setAttribute('aria-current',n===current?'step':'false')});
  timeLabel.textContent=screens[current].dataset.time||'';
  window.scrollTo({top:0,behavior:'smooth'});
}
function bind(){
  chapterToggle.onclick=()=>setChapterNav();
  document.querySelectorAll('.next').forEach((b,i)=>b.onclick=()=>show(i===SCREENS.length-1?0:i+1));
  document.querySelectorAll('.prev').forEach((b,i)=>b.onclick=()=>show(i-1));
  document.querySelectorAll('.play').forEach(btn=>btn.addEventListener('click',()=>{
    if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放；可直接閱讀下方逐字稿。');return}
    if(window.speechSynthesis.speaking){stopSpeech();return}
    const u=new SpeechSynthesisUtterance(btn.dataset.speech||'');u.lang=btn.dataset.lang||'zh-TW';u.rate=btn.dataset.lang==='en-US' ? .9 : .94;u.pitch=1;const original='▶';btn.textContent='❚❚';u.onend=()=>btn.textContent=original;u.onerror=()=>btn.textContent=original;window.speechSynthesis.speak(u)
  }));
  document.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{
    const idx=c.dataset.segment;const block=c.closest('.quiz-block');block.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById('feedback-'+idx);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show')
  }));
  const answeredBySet={};
  document.querySelectorAll('.recall-choice').forEach(c=>c.addEventListener('click',()=>{
    const qi=c.dataset.q;const setName=c.dataset.set||'recall';const item=c.closest('.recall-item');item.querySelectorAll('.recall-choice').forEach(x=>x.classList.remove('correct','wrong'));
    const fb=document.getElementById(setName+'-feedback-'+qi);const ok=c.dataset.correct==='1';c.classList.add(ok?'correct':'wrong');fb.textContent=ok?fb.dataset.correctText:fb.dataset.wrongText;fb.classList.add('show');
    const scoreId=c.dataset.scoreId;answeredBySet[scoreId] ||= new Set();answeredBySet[scoreId].add(qi);
    const score=document.getElementById(scoreId);if(score)score.textContent=`這一組已作答 ${answeredBySet[scoreId].size} / ${c.dataset.groupSize} 題`;
  }));
}
render();
</script>
</body>
</html>
