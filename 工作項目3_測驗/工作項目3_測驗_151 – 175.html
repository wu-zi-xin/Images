<head>
    <meta charset="UTF-8">

    <title>工作項目3_151-175題_互動測驗</title>
    <style>
        /* 基礎與排版設定 */
        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang TC", "微軟正黑體", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px 10px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1em;
            margin-top: 0;
        }

        #quiz-container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #eaeaea;
        }

        /* 進度與標籤 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .multiple-choice-tag {
            background-color: #e74c3c;
            color: white;
            font-size: 0.85em;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        #progress-text {
            font-size: 0.95em;
            color: #95a5a6;
            font-weight: bold;
        }

        /* 題目區 */
        #question-text {
            font-size: 1.25em;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 20px;
        }

        /* 選項區 */
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8f9fa;
            border: 2px solid #dfe6e9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1.05em;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            background: #eef2f5;
            border-color: #b2bec3;
        }

        /* 複選選取狀態 */
        .option-btn.selected:not(:disabled) {
            background: #e0f2fe;
            border-color: #3498db;
            color: #0c5460;
            font-weight: bold;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* 批改狀態顏色 */
        .correct {
            background-color: #d4edda !important;
            border-color: #2ecc71 !important;
            color: #27ae60 !important;
            font-weight: bold;
        }

        .incorrect {
            background-color: #f8d7da !important;
            border-color: #e74c3c !important;
            color: #c0392b !important;
            text-decoration: line-through;
        }

        .missed {
            background-color: #fff3cd !important;
            border-color: #ffc107 !important;
            border-style: dashed !important;
            border-width: 2px !important;
            color: #856404 !important;
            font-weight: bold;
        }

        /* 按鈕區 */
        #submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        #submit-btn:hover {
            background-color: #d35400;
        }

        /* 解析區 */
        #feedback-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f4fcf7;
            border-left: 5px solid #27ae60;
            border-radius: 5px;
        }

        .explanation-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }

        /* 導覽按鈕區 */
        .nav-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .nav-btn {
            padding: 10px 25px;
            font-size: 1em;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #2980b9;
        }

        .nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* 重新測驗按鈕特殊顏色 */
        #restart-btn {
            background-color: #27ae60;
        }

        #restart-btn:hover {
            background-color: #2ecc71;
        }

        /* 手機版自適應 */
        @media (max-width: 600px) {
            #quiz-container {
                padding: 20px;
            }
            .nav-btn {
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>網路架設 乙級 測驗系統</h1>
        <p>工作項目 03：網路架設佈線 第 151 ~ 175 題 (全複選題)</p>
    </div>

    <div id="quiz-container">
        <div class="top-bar">
            <span class="multiple-choice-tag">✔ 複選題 (請選取多項)</span>
            <span id="progress-text">題號： 1 / 25</span>
        </div>

        <div id="question-text">載入中...</div>
        
        <div id="options-container">
            <!-- 選項按鈕會透過 JS 自動產生在這 -->
        </div>

        <button id="submit-btn" onclick="submitAnswer()">確認送出 (批改)</button>

        <div id="feedback-container">
            <div class="explanation-title">💡 深度解析：</div>
            <div id="explanation-text">解析內容</div>
        </div>

        <div class="nav-container">
            <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">◀ 上一題</button>
            <button id="next-btn" class="nav-btn" onclick="nextQuestion()">▶ 下一題</button>
            <!-- 重新測驗按鈕，預設隱藏 -->
            <button id="restart-btn" class="nav-btn" onclick="restartQuiz()" style="display: none;">↻ 重新測驗</button>
        </div>
    </div>

    <script>
        // 題庫資料：工作項目03 (第151-175 題)
        // 陣列 ans 對應選項的數字: 1代表①, 2代表②, 3代表③, 4代表④ (皆以逗號正確分隔)
        const questions = [
            {
                q: "151. 關於通訊網路系統，下列哪些正確？",
                options: [
                    "①系統是指能對輸入訊號進行處理，並產生輸出訊號的裝置",
                    "②傳送端將欲傳送的訊息送入編碼器（Encoder）進行編碼，編碼器會執行訊源編碼（Source Coding）及通道編碼（Channel Coding）",
                    "③濾波器是指能限制訊號頻譜於某個特定頻率的裝置",
                    "④調變是指在接收端恢復原來的基頻訊號"
                ],
                ans: [1,2,3],
                exp: "<b>綜合解析：</b>通訊網路系統由傳送端、通道和接收端組成，各部件擔任訊號的轉換與過濾角色。<br><br><b>【各選項解析】</b><br>① 正確：系統就是處理輸入訊號產生輸出的裝置。<br>② 正確：傳送端編碼包含訊源與通道編碼。<br>③ 正確：濾波器可用於限制訊號頻譜於特定頻率。<br>④ 錯誤：調變是在「傳送端」進行的，接收端恢復訊號的過程稱為「解調」。"
            },
            {
                q: "152. 下列哪些是 OTDR 所用到的光學理論？",
                options: [
                    "①瑞利散射（Rayleigh backscattering）",
                    "②繞射（Diffraction）",
                    "③菲涅爾反射（Fresnel reflection）",
                    "④干涉測量（Interferometry）"
                ],
                ans: [1, 3],
                exp: "<b>綜合解析：</b>光時域反射計（OTDR）是利用光纖中光的背向散射與反射現象來測量衰減及定位斷點的儀器。<br><br><b>【各選項解析】</b><br>① 正確：利用微小雜質造成的瑞利背向散射測量整段光纖損耗。<br>② 錯誤：OTDR 並未使用繞射理論。<br>③ 正確：利用斷點或接頭等折射率突變處的菲涅爾反射來進行定位。<br>④ 錯誤：干涉測量非 OTDR 所運用的理論。"
            },
            {
                q: "153. 關於 OTDR 的參數，下列哪些正確？",
                options: [
                    "①脈衝寬度與盲區無關",
                    "②脈衝寬度愈短，雜訊愈大",
                    "③脈衝寬度愈長，量測出來的曲線愈平滑",
                    "④測試波長愈短，對光纖彎曲愈敏感"
                ],
                ans: [2, 3],
                exp: "<b>綜合解析：</b>OTDR 參數設定會直接影響測量曲線的精準度與盲區距離。<br><br><b>【各選項解析】</b><br>① 錯誤：脈衝寬度會直接決定盲區的長短（愈長盲區愈大）。<br>② 正確：脈衝愈短，打入光纖的能量較小，雜訊相對變大。<br>③ 正確：脈衝長時注入能量大，信噪比高，量測曲線較平滑。<br>④ 錯誤：光纖對彎曲的敏感度是「波長愈長愈敏感」（如1550nm比1310nm敏感）。"
            },
            {
                q: "154. 訊號之傳輸有下列哪些方式？",
                options: [
                    "①全雙工",
                    "②半雙工",
                    "③單工",
                    "④半單工"
                ],
                ans: [1,2,3],
                exp: "<b>綜合解析：</b>通訊系統中依據資料流動方向與時間特性，區分為三種基本傳輸方式。<br><br><b>【各選項解析】</b><br>① 正確：全雙工允許同時雙向傳輸（如電話）。<br>② 正確：半雙工允許雙向傳輸，但不能同時進行（如無線電對講機）。<br>③ 正確：單工僅允許單向傳輸（如廣播電視）。<br>④ 錯誤：學理與實務上並沒有「半單工」這種傳輸模式。"
            },
            {
                q: "155. 下列哪些正確？",
                options: [
                    "①紅外線資料傳輸是以點對點的方式進行",
                    "②藍牙技術無法同時傳輸語音及數據資料",
                    "③紅外線無法穿透障礙物",
                    "④藍牙是一種短距離、低功率、低成本的無線通訊技術"
                ],
                ans: [1, 3, 4],
                exp: "<b>綜合解析：</b>紅外線具備方向性與光學特性，而藍牙技術為短距離、全方位的無線電波通訊。<br><br><b>【各選項解析】</b><br>① 正確：紅外線傳輸一般必須點對點（Line of Sight）。<br>② 錯誤：藍牙技術設計之初即支援「同時」傳輸語音與數據資料。<br>③ 正確：紅外線光波無法穿透實體牆壁等障礙物。<br>④ 正確：短距離、低功率、低成本正是藍牙的技術特徵。"
            },
            {
                q: "156. 線性調變技術包含下列哪些方式？",
                options: [
                    "①雙邊帶抑制載波（Double Sideband Suppressed Carrier, DSB-SC）",
                    "②殘留邊帶（Vestigial Sideband, VSB）",
                    "③無邊帶（Non-sideband, NSB）",
                    "④單邊帶（Single-sideband, SSB）"
                ],
                ans: [1, 2, 4],
                exp: "<b>綜合解析：</b>振幅調變（AM）家族皆屬於線性調變技術。<br><br><b>【各選項解析】</b><br>① 正確：DSB-SC 屬於線性調變的一種。<br>② 正確：VSB 常用於電視訊號傳輸，為線性調變。<br>③ 錯誤：通訊理論中不存在無邊帶（NSB）的調變技術。<br>④ 正確：SSB 具備高頻譜效率，屬於線性調變。"
            },
            {
                q: "157. 下列哪些為乙太網路 Ethernet 的傳輸媒介？",
                options: [
                    "①光纖",
                    "②雙絞線",
                    "③同軸電纜",
                    "④磁帶"
                ],
                ans: [1,2,3],
                exp: "<b>綜合解析：</b>乙太網路在不同時期與速度標準下，使用了各種實體連線媒介。<br><br><b>【各選項解析】</b><br>① 正確：如 100Base-FX 或 10GBASE-SR 皆使用光纖。<br>② 正確：目前最普遍的 1000Base-T 即使用雙絞線。<br>③ 正確：早期的乙太網路（如10Base5、10Base2）就是使用同軸電纜。<br>④ 錯誤：磁帶是資料儲存媒體，非網路傳輸媒介。"
            },
            {
                q: "158. 無線網路可依據傳輸距離的遠近作為區分，下列哪些不正確？",
                options: [
                    "①無線都會區網路（WMAN）可用以聯繫座落於不同區域的辦公大樓或校區",
                    "②無線區域網路（WLAN）適用於單一建築物或辦公室之內，傳輸範圍僅限於 10 公尺內",
                    "③無線個人網路（WPAN）的主要用途是讓個人使用的資訊裝置可互相通訊及資料交換",
                    "④無線廣域網路（WWAN）的傳輸範圍只限跨越不同城市，無法跨越不同國家之間的網路"
                ],
                ans: [2, 4],
                exp: "<b>綜合解析：</b>本題詢問「不正確」的選項。<br><br><b>【各選項解析】</b><br>① 正確（不選）：WMAN（如 WiMAX）範圍確實在都會區。<br>② 錯誤（應選）：WLAN（如 Wi-Fi）傳輸範圍可達數十甚至上百公尺，非僅限10公尺。<br>③ 正確（不選）：WPAN（如藍牙）用於個人裝置互連。<br>④ 錯誤（應選）：WWAN（如 4G/5G/衛星通訊）涵蓋範圍極廣，可以輕鬆跨越國家界線。"
            },
            {
                q: "159. 關於無線電微波（Microwave），下列哪些不正確？",
                options: [
                    "①頻率範圍在 20 GHz 到 1000 GHz 之間",
                    "②通常適用於寬頻（Wideband）及雷達（Radar）系統",
                    "③微波是一種直線波，並不沿著地球曲面傳送",
                    "④傳輸的衰減只需考慮實際使用的頻段，不需考慮天線兩端的距離"
                ],
                ans: [1, 4],
                exp: "<b>綜合解析：</b>本題詢問「不正確」的選項，請注意微波的頻譜與傳輸損耗特性。<br><br><b>【各選項解析】</b><br>① 錯誤（應選）：微波頻率範圍通常定義為 300MHz 到 300GHz。<br>② 正確（不選）：微波常被應用於雷達及寬頻通訊。<br>③ 正確（不選）：微波具視距傳輸特性（Line-of-Sight），無法沿地球曲面傳遞。<br>④ 錯誤（應選）：自由空間路徑損失（Path Loss）與距離的平方成正比，必定需考慮傳輸距離。"
            },
            {
                q: "160. 關於藍牙（Bluetooth）協定，下列哪些不正確？",
                options: [
                    "①基本網路架構為星狀，其形態是各個從裝置（Slave Device）都會與 1 個主裝置（Master Device）連接",
                    "②形成網路的基本單位稱為微網（Piconet），1 個微網內的裝置數目並無限制",
                    "③若多個微網（Piconet）之間有共用的裝置，則所形成的網路稱為擴散網（Scatternet）",
                    "④1 個微網（Piconet）至少包含 1 個主裝置（Master Device）及無數個從裝置（Slave Device）"
                ],
                ans: [2, 4],
                exp: "<b>綜合解析：</b>本題詢問「不正確」的選項，需釐清藍牙微網的裝置數量限制。<br><br><b>【各選項解析】</b><br>① 正確（不選）：微網的邏輯架構確實是以主裝置為中心的星狀拓樸。<br>② 錯誤（應選）：1個微網中，與主裝置處於「活躍狀態」的從裝置最多只能有 7 個，並非無限制。<br>③ 正確（不選）：微網間透過共用裝置相連，會形成擴散網（Scatternet）。<br>④ 錯誤（應選）：同上，從裝置最多只有7個活躍節點，不是無數個。"
            },
            {
                q: "161. 關於藍芽封包格式的標頭欄位，下列哪些正確？",
                options: [
                    "①藍牙封包的標頭碼共有 12 個位元",
                    "②封包類型（Type）代表此封包的種類及所使用的時槽個數",
                    "③標頭錯誤檢查（Header Error Check, HEC）用以檢查標頭在傳送過程中是否發生錯誤",
                    "④序列號碼（Sequence Number, SEQN）是在接收端收到封包時，用以判斷封包是否重複"
                ],
                ans: [2,3,4],
                exp: "<b>綜合解析：</b>藍牙基礎封包格式的標頭有其固定的定義與查錯機制。<br><br><b>【各選項解析】</b><br>① 錯誤：基礎藍牙標頭碼原始大小為 18 個位元（通常經 1/3 FEC 編碼後擴展為 54 個位元）。<br>② 正確：Type 欄位定義了封包類型與佔用的時槽數量。<br>③ 正確：HEC 確保標頭的完整性。<br>④ 正確：SEQN 用於區分新封包與重傳封包，避免重複處理。"
            },
            {
                q: "162. 關於無線隨意網路（Wireless Ad Hoc Network）的特性，下列哪些正確？",
                options: [
                    "①無線隨意網路具有高移動性",
                    "②每個節點不可隨時移動",
                    "③不會受到不法竊聽或遭受惡性堵塞（Jam）與欺騙（Spoof）",
                    "④封包由來源端（Source）傳輸至目的端（Destination），可經多個中繼節點進行轉送"

        // 暫存當前畫面的勾選狀態
        let currentSelection = [];

        const submitBtn = document.getElementById("submit-btn");
        const restartBtn = document.getElementById("restart-btn"); // 重新測驗按鈕

        // 載入題目
        function loadQuestion(index) {
            const qData = questions[index];
            progressText.innerText = `題號： ${index + 1} / ${questions.length}`;
            questionText.innerHTML = qData.q;
            feedbackContainer.style.display = "none";
            optionsContainer.innerHTML = "";

            // 判斷該題是否已提交
            let isSubmitted = false;
            if (userAnswers[index] !== null) {
                isSubmitted = userAnswers[index].submitted;
                currentSelection = [...userAnswers[index].selected];
            } else {
                currentSelection = [];
            }

            // 動態生成選項按鈕
            qData.options.forEach((optText, i) => {
                const optValue = i + 1; // 讓索引從 1 開始 (1代表①, 2代表②...)
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = optText;

                if (isSubmitted) {
                    btn.disabled = true; // 已批改即鎖定
                    const isSelected = currentSelection.includes(optValue);
                    const isCorrectAns = qData.ans.includes(optValue);

                    if (isSelected && isCorrectAns) {
                        btn.classList.add("correct");
                        btn.innerHTML += " <span style='float:right'>✔</span>";
                    } else if (isSelected && !isCorrectAns) {
                        btn.classList.add("incorrect");
                        btn.innerHTML += " <span style='float:right'>✘</span>";
                    } else if (!isSelected && isCorrectAns) {
                        // 漏選的正確答案：加上虛線框、特殊顏色與圖示提示
                        btn.classList.add("missed");
                        btn.innerHTML += " <span style='float:right'>❗ (漏選的正確答案)</span>";
                    }
                } else {
                    // 若還沒送出，套用選取狀態
                    if (currentSelection.includes(optValue)) {
                        btn.classList.add("selected");
                    }
                    btn.onclick = () => toggleSelection(optValue, btn);
                }
                optionsContainer.appendChild(btn);
            });

            // 控制按鈕與解析區的顯示
            if (isSubmitted) {
                submitBtn.style.display = "none";
                explanationText.innerHTML = qData.exp;
                feedbackContainer.style.display = "block";
            } else {
                submitBtn.style.display = "block";
            }

            // 上下題及重新測驗導覽鈕狀態
            prevBtn.disabled = index === 0;
            
            // 如果是最後一題，隱藏「下一題」，顯示「重新測驗」
            if (index === questions.length - 1) {
                nextBtn.style.display = "none";
                restartBtn.style.display = "block";
            } else {
                nextBtn.style.display = "block";
                restartBtn.style.display = "none";
            }
        }

        // 點擊選項邏輯 (切換選取狀態)
        function toggleSelection(optValue, btn) {
            const idx = currentSelection.indexOf(optValue);
            if (idx > -1) {
                currentSelection.splice(idx, 1);
                btn.classList.remove("selected");
            } else {
                currentSelection.push(optValue);
                btn.classList.add("selected");
            }
        }

        // 送出答案批改

                alert("請至少選擇一個選項再送出喔！");
                return;
            }

            const qData = questions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = { selected: [...currentSelection], submitted: true };

            const btns = optionsContainer.getElementsByClassName("option-btn");

            // 鎖定按鈕並上色
            for (let i = 0; i < btns.length; i++) {
                const optValue = i + 1; // 讓對應值為 1, 2, 3, 4
                btns[i].disabled = true;
                btns[i].classList.remove("selected");

                const isSelected = currentSelection.includes(optValue);
                const isCorrectAns = qData.ans.includes(optValue);

                if (isSelected && isCorrectAns) {
                    btns[i].classList.add("correct");
                    btns[i].innerHTML += " <span style='float:right'>✔</span>";
                } else if (isSelected && !isCorrectAns) {
                    btns[i].classList.add("incorrect");
                    btns[i].innerHTML += " <span style='float:right'>✘</span>";
                } else if (!isSelected && isCorrectAns) {
                    btns[i].classList.add("missed");
                    btns[i].innerHTML += " <span style='float:right'>❗ (漏選的正確答案)</span>";

            // 隱藏送出紐，並展開解析
            submitBtn.style.display = "none";
            explanationText.innerHTML = qData.exp;
            feedbackContainer.style.display = "block";
        }

        // 導覽至上一題
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        // 導覽至下一題
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            }
        }

        // 重新測驗功能
        function restartQuiz() {
            if (confirm("確定要清除所有作答紀錄並重新開始測驗嗎？")) {
                currentQuestionIndex = 0; // 重置到第一題
                userAnswers = new Array(questions.length).fill(null); // 清空作答紀錄
                currentSelection = []; // 清空當前選取
                loadQuestion(currentQuestionIndex); // 重新載入
                window.scrollTo({ top: 0, behavior: 'smooth' }); // 平滑捲動到畫面最上方
            }
        }

        // 初始化
        loadQuestion(0);
    </script>
</body>
</html>
