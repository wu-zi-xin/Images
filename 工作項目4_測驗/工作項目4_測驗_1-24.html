<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網路架設佈線 互動測驗 (工作項目04: 1-24題)</title>
<style>
    body {
        font-family: "Helvetica Neue", Helvetica, "PingFang TC", "微軟正黑體", sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 20px 10px;
        line-height: 1.6;
    }
    .header {
        text-align: center;
        margin-bottom: 20px;
    }
    .header h1 {
        color: #2c3e50;
        font-size: 1.8em;
        margin-bottom: 5px;
    }
    .header p {
        color: #7f8c8d;
        font-size: 1em;
        margin-top: 0;
    }
    
    #quiz-container {
        max-width: 700px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        border: 1px solid #eaeaea;
    }

    /* 進度條與狀態 */
    #progress-text {
        text-align: right;
        font-size: 0.9em;
        color: #95a5a6;
        margin-bottom: 15px;
        font-weight: bold;
    }

    /* 題目區 */
    #question-text {
        font-size: 1.25em;
        font-weight: bold;
        color: #34495e;
        margin-bottom: 20px;
    }

    /* 選項區 */
    .option-btn {
        display: block;
        width: 100%;
        text-align: left;
        background: #f8f9fa;
        border: 2px solid #dfe6e9;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        font-size: 1.05em;
        color: #555;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
        background: #eef2f5;
        border-color: #b2bec3;
    }
    .option-btn:disabled {
        cursor: default;
    }

    /* 答對答錯的顏色標示 */
    .correct {
        background-color: #d4edda !important;
        border-color: #2ecc71 !important;
        color: #27ae60 !important;
        font-weight: bold;
    }
    .incorrect {
        background-color: #f8d7da !important;
        border-color: #e74c3c !important;
        color: #c0392b !important;
        font-weight: bold;
    }

    /* 解析區 */
    #feedback-container {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #f4fcf7;
        border-left: 5px solid #27ae60;
        border-radius: 5px;
    }
    .explanation-title {
        font-weight: bold;
        color: #27ae60;
        margin-bottom: 10px;
    }
    .math-box {
        background: #eef2f5;
        padding: 8px;
        border-radius: 6px;
        font-family: monospace;
        color: #c0392b;
        margin: 10px 0;
        display: inline-block;
    }

    /* 導覽按鈕區 */
    .nav-container {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 1px solid #eee;
        padding-top: 20px;
    }
    .nav-btn {
        padding: 10px 25px;
        font-size: 1em;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
    }
    .nav-btn:hover:not(:disabled) {
        background-color: #2980b9;
    }
    .nav-btn:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<div class="header">
    <h1>網路架設 乙級 測驗系統</h1>
    <p>工作項目 04：第 1 ~ 24 題</p>
</div>

<div id="quiz-container">
    <div id="progress-text">題號： 1 / 24</div>
    <div id="question-text">載入中...</div>
    
    <div id="options-container">
        <!-- 選項按鈕會透過 JS 自動產生在這 -->
    </div>

    <div id="feedback-container">
        <div class="explanation-title">💡 深度解析：</div>
        <div id="explanation-text">解析內容</div>
    </div>

    <div class="nav-container">
        <button id="prev-btn" class="nav-btn" onclick="prevQuestion()" disabled>◀ 上一題</button>
        <button id="next-btn" class="nav-btn" onclick="nextQuestion()">下一題 ▶</button>
    </div>
</div>

<script>
    // 題庫資料：工作項目 04 (第 1-24 題)
    const questions = [
        {
            q: "1. 下列何者是 IANA 保留供私人（Private）使用之 IP 位址？",
            options: ["①172.32.1.34", "②172.15.2.43", "③172.20.23.186", "④192.169.0.1"],
            ans: 2, // 第三個選項
            exp: "IANA 規定了三段 Private IP (私有/虛擬 IP) 範圍：<br>Class A：10.0.0.0 ~ 10.255.255.255<br>Class B：172.16.0.0 ~ 172.31.255.255<br>Class C：192.168.0.0 ~ 192.168.255.255<br>選項③的 172.20 剛好落在 Class B 的範圍內。"
        },
        {
            q: "2. 下列何者不是 IANA 保留供私人（Private）使用之 IP 位址？",
            options: ["①10.23.123.54", "②192.168.0.34", "③172.18.168.23", "④172.32.45.127"],
            ans: 3, 
            exp: "選項④的 172.32.45.127 已經超過了 Class B 私有 IP 規定的範圍 (只到 172.31.255.255)，因此它是一個可以在網際網路上路由的公有 IP。"
        },
        {
            q: "3. IANA 保留 Class B 供私人使用之 IP 位址範圍為何？",
            options: ["①172.1.0.0~172.31.255.255", "②172.16.0.0~172.31.255.255", "③172.32.0.0~172.63.255.255", "④172.16.0.0~172.32.255.255"],
            ans: 1,
            exp: "此為強記題。IANA 劃分的 Class B 私有 IP 範圍是由 172.16.0.0 起始，一直到 172.31.255.255 結束。"
        },
        {
            q: "4. IANA 保留 Class C 供私人使用之 IP 位址範圍為何？",
            options: ["①192.168.1.0~192.168.1.254", "②192.168.0.0~192.168.0.255", "③192.168.0.0~192.168.255.255", "④192.168.10.0~192.168.10.255"],
            ans: 2,
            exp: "這是家用分享器最常見的 IP 網段。Class C 私有 IP 範圍是由 192.168.0.0 起始，一直到 192.168.255.255 結束 (包含 256 個獨立的網段)。"
        },
        {
            q: "5. IANA 保留 Class A 供私人使用之 IP 位址範圍為何？",
            options: ["①10.0.0.0~10.0.255.255", "②10.10.0.0~10.10.255.255", "③100.0.0.0~100.100.255.255", "④10.0.0.0~10.255.255.255"],
            ans: 3,
            exp: "Class A 的私有 IP 範圍整整佔用了一個完整的 Class A 區段，即由 10.0.0.0 到 10.255.255.255。"
        },
        {
            q: "6. IANA 保留幾個 Class B 網路供私人使用？",
            options: ["①8", "②16", "③24", "④32"],
            ans: 1,
            exp: "Class B 的私有網段範圍是 172.16 到 172.31。第二個數字從 16 數到 31，總共包含了：31 - 16 + 1 = 16 個標準的 Class B 網路。"
        },
        {
            q: "7. IANA 保留幾個 Class A 網路供私人使用？",
            options: ["①1", "②4", "③128", "④256"],
            ans: 0,
            exp: "Class A 的私有網段範圍是 10.0.0.0 到 10.255.255.255。這剛好就是一整個 10.x.x.x 的網域，因此只有 1 個 Class A 網路。"
        },
        {
            q: "8. IANA 保留幾個 Class C 網路供私人使用？",
            options: ["①1", "②4", "③128", "④256"],
            ans: 3,
            exp: "Class C 的私有網段範圍是 192.168.0.0 到 192.168.255.255。第三個數字從 0 數到 255，總共包含了 256 個標準的 Class C 網路。"
        },
        {
            q: "9. 200.12.34.53/29 所在的網路中，第一個可指定給設備使用之 IP 位址為何？",
            options: ["①200.12.34.1", "②200.12.34.49", "③200.12.34.17", "④200.12.34.53"],
            ans: 1,
            exp: "/29 遮罩代表每個子網大小為 8。53 落在第 6 個區塊 (48~55)。所以網路位址(Network ID)為 200.12.34.48。第一個可用的設備 IP 是 48+1 = <div class='math-box'>200.12.34.49</div>"
        },
        {
            q: "10. 200.12.34.53/26 所在的網路中，最後一個可指定給設備使用之 IP 位址為何？",
            options: ["①200.12.34.62", "②200.12.34.82", "③200.12.34.78", "④200.12.34.54"],
            ans: 0,
            exp: "/26 遮罩代表每個子網大小為 64。53 落在 0~63 區塊內。該區塊的最後一個數字 63 為廣播位址(不可使用)。因此最後一個可用 IP 為廣播位址減 1：<div class='math-box'>200.12.34.62</div>"
        },
        {
            q: "11. 179.34.42.7/23 所在的網路中，最後一個可指定給設備使用之 IP 位址為何？",
            options: ["①179.34.42.254", "②179.34.43.254", "③179.34.42.255", "④179.34.43.255"],
            ans: 1,
            exp: "/23 遮罩代表區塊大小為 2 (變動在第三個位元組)。42.7 落在 42.0 ~ 43.255 之間。最後的廣播位址是 43.255，故最後一個可用 IP 為 <div class='math-box'>179.34.43.254</div>"
        },
        {
            q: "12. 下列哪一個 IP 位址可指定給設備使用？",
            options: ["①145.23.22.255/23", "②34.234.123.47/29", "③160.68.255.255/16", "④190.43.23.159/27"],
            ans: 0,
            exp: "選項②、③、④剛好都落在該網段計算出來的「廣播位址」上，不可給設備使用。選項①的 /23 範圍是 22.0 ~ 23.255，此時 22.255 只是網段中間的一個普通 IP，可以使用。"
        },
        {
            q: "13. 若要將 IP 位址為 56.78.0.0/20 之網路分成 8 個子網路，其子網路遮罩為何？",
            options: ["①255.255.255.224", "②255.255.224.0", "③255.255.254.0", "④255.255.248.0"],
            ans: 2,
            exp: "要分成 8 個子網路，需要借 3 個 bit (2³=8)。原遮罩 /20 + 3 = /23。將 /23 轉為十進位：前兩碼全滿(255.255)，第三碼有 7 個 1 (128+64+32+16+8+4+2=254)，即 <div class='math-box'>255.255.254.0</div>"
        },
        {
            q: "14. 若要將 IP 位址為 56.78.5.34/20 之網路分成 8 個子網路，其第 3 個子網路 IP 位址為何？",
            options: ["①56.78.7.0/23", "②56.78.12.0/23", "③56.78.8.0/23", "④56.78.4.0/23"],
            ans: 3,
            exp: "切成 /23 後區塊大小變成 2 (變動在第三碼)。從 56.78.0.0 開始算：<br>第1個：.0.0<br>第2個：.2.0<br>第3個：<div class='math-box'>.4.0</div>"
        },
        {
            q: "15. 若要將 IP 位址為 56.78.10.34/20 之網路分成 8 個子網路，其第 4 個子網路中最後一個可指定給設備使用之 IP 位址為何？",
            options: ["①56.78.4.127", "②56.78.7.254", "③56.78.8.254", "④56.78.12.254"],
            ans: 1,
            exp: "承上題，第4個子網路的起點是 56.78.6.0，因為下一個(第5個)是 8.0，所以範圍到 7.255(廣播位址)結束。最後可用 IP 就是廣播減一：<div class='math-box'>56.78.7.254</div>"
        },
        {
            q: "16. 若要將 IP 位址為 25.178.10.34/20 之網路分成 8 個子網路，其每個子網路中共有幾個 IP 位址可指定給設備使用？",
            options: ["①512", "②511", "③510", "④509"],
            ans: 2,
            exp: "/20 分成 8 個子網後遮罩變為 /23。主機位元剩 32-23=9 個。總數量為 2⁹ = 512。扣除頭尾不可用的網路位址與廣播位址：512 - 2 = <div class='math-box'>510</div>"
        },
        {
            q: "17. 若要將 IP 位址為 65.8.20.34/20 所在之網路分成 16 個子網路，其每個子網路中共有幾個 IP 位址可指定給設備使用？",
            options: ["①252", "②254", "③255", "④256"],
            ans: 1,
            exp: "/20 分成 16 個子網(借4bit)，遮罩變為 /24。主機位元剩 8 個。總數量為 2⁸ = 256。扣除頭尾不可用：256 - 2 = <div class='math-box'>254</div>"
        },
        {
            q: "18. 若將子網路遮罩為 255.255.252.0 之網路再分成 16 個子網路，其子網路遮罩為何？",
            options: ["①255.255.255.0", "②255.255.255.192", "③255.255.255.224", "④255.255.255.240"],
            ans: 1,
            exp: "原遮罩 252 即為 /22。分成 16 個需要借 4 bit，新遮罩為 22+4 = /26。將 /26 轉回十進位，第四碼有 2 個 1 (128+64 = 192)，即 <div class='math-box'>255.255.255.192</div>"
        },
        {
            q: "19. 一個 Class A 網路最多可分成幾個相當於 Class B 大小的子網路？",
            options: ["①128", "②256", "③512", "④64"],
            ans: 1,
            exp: "Class A 是 /8，Class B 是 /16。從 8 變到 16 增加了 8 個 bit 的切割空間。因此可切出 2⁸ = <div class='math-box'>256</div> 個。"
        },
        {
            q: "20. 一個 Class A 網路最多可分成幾個相當於 Class C 大小的子網路？",
            options: ["①65535", "②32768", "③65534", "④65536"],
            ans: 3,
            exp: "Class A 是 /8，Class C 是 /24。相差了 16 個 bit。因此可切出 2¹⁶ = <div class='math-box'>65536</div> 個。"
        },
        {
            q: "21. 下列何種 Class 之網路可指定給設備使用之 IP 位址數量最多？",
            options: ["①Class A", "②Class B", "③Class C", "④Class D"],
            ans: 0,
            exp: "Class A 留給主機的位元數高達 24 個 bits (1677萬個IP)，是可用 IP 數量最多的類別。"
        },
        {
            q: "22. 下列何種 Class 之網路數量最多？",
            options: ["①Class A", "②Class B", "③Class C", "④Class D"],
            ans: 2,
            exp: "這題問的是「網路段的數量(Network ID)」。Class C 用了前 24 bits 來定義網路段，所以能切割出來的「網段數量」(2²¹ 個) 遠比 A 或 B 多。"
        },
        {
            q: "23. Class A 之網路數量共有幾個？",
            options: ["①2⁸", "②2⁷", "③2⁶", "④2⁹"],
            ans: 1,
            exp: "Class A 的網路 ID 佔 8 個 bits，但規定最左邊的 1 個 bit 必須固定為 0，所以只剩下 7 個 bits 能自由變化。網路數量即為 <div class='math-box'>2⁷</div>"
        },
        {
            q: "24. Class B 之網路數量共有幾個？",
            options: ["①2¹⁶", "②2¹⁵", "③2¹⁴", "④2¹³"],
            ans: 2,
            exp: "Class B 的網路 ID 佔 16 個 bits，但規定最左邊的 2 個 bit 必須固定為 10，剩下 14 個 bits 能自由變化。網路數量即為 <div class='math-box'>2¹⁴</div>"
        }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = new Array(questions.length).fill(null); // 記錄作答狀態

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackContainer = document.getElementById("feedback-container");
    const explanationText = document.getElementById("explanation-text");
    const progressText = document.getElementById("progress-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion(index) {
        const qData = questions[index];
        progressText.innerText = `題號： ${index + 1} / ${questions.length}`;
        questionText.innerHTML = qData.q;
        
        // 隱藏解析
        feedbackContainer.style.display = "none";
        
        // 清空選項並重新生成
        optionsContainer.innerHTML = "";
        qData.options.forEach((optText, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = optText;
            
            // 若此題已經答過，恢復狀態
            if (userAnswers[index] !== null) {
                btn.disabled = true; // 鎖定按鈕
                if (i === qData.ans) {
                    btn.classList.add("correct");
                } else if (i === userAnswers[index]) {
                    btn.classList.add("incorrect");
                }
            } else {
                btn.onclick = () => selectOption(i);
            }
            optionsContainer.appendChild(btn);
        });

        // 若已答過，直接顯示解析
        if (userAnswers[index] !== null) {
            explanationText.innerHTML = qData.exp;
            feedbackContainer.style.display = "block";
        }

        // 按鈕狀態控制
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === questions.length - 1;
    }

    function selectOption(selectedIndex) {
        const qData = questions[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedIndex; // 記錄選擇

        const btns = optionsContainer.getElementsByClassName("option-btn");
        
        // 判定與標示顏色
        for (let i = 0; i < btns.length; i++) {
            btns[i].disabled = true; // 鎖定所有選項
            if (i === qData.ans) {
                btns[i].classList.add("correct"); // 正確答案一律標綠色
            } else if (i === selectedIndex) {
                btns[i].classList.add("incorrect"); // 選錯的標紅色
            }
        }

        // 顯示解析
        explanationText.innerHTML = qData.exp;
        feedbackContainer.style.display = "block";
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        }
    }

    // 初始化第一題
    loadQuestion(0);

</script>

</body>
</html>
