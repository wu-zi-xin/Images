<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script id="MathJax-script" async
	src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
	</script>
    <title>工作項目 共同科目職業安全衛生 測驗 (76-100) - 實戰指南風格</title>
    <style>
        :root {
            --sidebar-bg: #131b2e;
            --sidebar-card: #1d273e;
            --sidebar-border: #2a3654;
            --sidebar-text: #e2e8f0;
            --sidebar-text-muted: #94a3b8;
            --active-blue: #2563eb;
            --active-blue-hover: #1d4ed8;
            --main-bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --callout-bg: #eff6ff;
            --callout-border: #3b82f6;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --missed-bg: #fef3c7;
            --missed-color: #b45309;
            --sidebar-width: 290px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-title-badge {
            background-color: #ec4899;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 0.3rem;
        }

        .app-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.3s ease;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.65rem 0.85rem;
            background-color: var(--sidebar-card);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--active-blue);
        }

        .search-btn {
            padding: 0.65rem 0.95rem;
            background-color: var(--active-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--active-blue-hover);
        }

        .question-grid-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--sidebar-text-muted);
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.55rem;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .q-btn {
            padding: 0.6rem 0.3rem;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .q-btn:hover {
            border-color: var(--active-blue);
            background-color: rgba(37, 99, 235, 0.2);
        }

        .q-btn.active {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .q-btn.answered {
            border-color: var(--active-blue);
            color: #60a5fa;
        }

        .sidebar-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn-sidebar-nav {
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-sidebar-nav:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .main-content {
            flex: 1;
            padding: 2.2rem 1.5rem;
            max-width: 840px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.2rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            color: var(--active-blue);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .type-badge {
            background-color: var(--active-blue);
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .type-badge.multi {
            background-color: #9333ea;
        }

        .question-title-box {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .accent-bar {
            width: 4px;
            height: 1.5rem;
            background-color: var(--active-blue);
            border-radius: 2px;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.65;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            padding: 1.1rem 1.25rem;
            background-color: #f8fafc;
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            min-height: 52px;
            text-align: left;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--active-blue);
            background-color: #eff6ff;
            transform: translateX(4px);
        }

        .option-item.correct {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: var(--success-color);
            font-weight: 700;
        }

        .option-item.wrong {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .option-item.multi-correct-hit {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: var(--success-color);
            font-weight: 700;
        }

        .option-item.multi-wrong-hit {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: var(--error-color);
            font-weight: 700;
        }

        .option-item.multi-missed {
            border-color: #d97706;
            background-color: var(--missed-bg);
            color: var(--missed-color);
            font-weight: 700;
        }

        .missed-tag {
            background-color: #d97706;
            color: #fff;
            font-size: 0.75rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 600;
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.multi-selected {
            background-color: #faf5ff;
            border-color: #9333ea;
            color: #7e22ce;
            font-weight: 600;
        }

        .option-content-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            width: 100%;
        }

        .submit-multi-btn {
            width: 100%;
            padding: 0.9rem;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: background-color 0.2s;
        }
        .submit-multi-btn:hover {
            background-color: #7e22ce;
        }
        .submit-multi-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .feedback-box {
            display: none;
            margin-bottom: 2rem;
            padding: 1.35rem 1.5rem;
            border-radius: 12px;
            background-color: var(--callout-bg);
            border: 1px solid #bfdbfe;
            border-left: 5px solid var(--callout-border);
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
        }

        .analysis-section {
            margin-top: 0.65rem;
            font-size: 0.98rem;
            line-height: 1.65;
            color: var(--text-secondary);
        }

        .analysis-section strong {
            color: var(--text-main);
        }

        .error-analysis {
            margin-top: 0.85rem;
            color: #991b1b;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .btn-nav-main {
            flex: 1;
            padding: 0.9rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 12px;
            background-color: #f1f5f9;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-nav-main:hover:not(:disabled) {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transform: translateY(-2px);
        }

        .btn-nav-main:hover:not(:disabled) .svg-icon {
            stroke: #ffffff;
        }

        .btn-nav-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #cbd5e1;
            background-color: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            transform: none;
        }

        .btn-nav-main:disabled .svg-icon {
            stroke: #94a3b8;
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            stroke: var(--active-blue);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.2s;
        }

        @media (max-width: 768px) {
            :root {
                --header-height: 85px; 
            }

            .header {
                height: var(--header-height);
                align-items: flex-start;
                padding-top: 1rem;
            }

            .hamburger-btn {
                display: block;
                margin-top: 0.1rem;
            }

            .sidebar {
                position: fixed;
                top: var(--header-height); 
                left: 0;
                bottom: 0;
                height: calc(100vh - var(--header-height));
                z-index: 101;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                padding: 1rem 0.75rem;
            }

            .quiz-card {
                padding: 1.4rem 1.1rem;
                border-radius: 14px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .btn-nav-main {
                padding: 0.85rem 0.8rem;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">
            <span class="header-title-badge">測驗</span>
            共同科目 職業安全衛生 工作項目 (76-100)
        </div>
        <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="選單">
            <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="search-box">
                <input type="number" id="searchInput" class="search-input" placeholder="搜尋題號 (76-100)" min="76" max="100">
                <button class="search-btn" onclick="searchQuestion()" aria-label="搜尋">
                    <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>

            <div class="question-grid-title">題號列表導覽：</div>
            <div class="question-grid" id="questionGrid"></div>

            <div class="sidebar-actions">
                <button class="btn-sidebar-nav" onclick="jumpToFirst()">
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
                    跳至第一題
                </button>
                <button class="btn-sidebar-nav" onclick="jumpToLast()">
                    跳至最後一題
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="quiz-card">
                <div class="question-header">
                    <span id="qNumber">第 76 題 / 共 25 題</span>
                    <span id="qTypeBadge" class="type-badge">單選題</span>
                </div>
                
                <div class="question-title-box">
                    <div class="accent-bar"></div>
                    <div class="question-text" id="qText">題目載入中...</div>
                </div>

                <div class="options-list" id="optionsList"></div>

                <button id="submitMultiBtn" class="submit-multi-btn" style="display: none;" onclick="submitMultiAnswer()">送出多選答案</button>

                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-title" id="feedbackStatus"></div>
                    <div class="analysis-section">
                        <strong>正確答案：</strong><span id="correctAnswer"></span>
                    </div>
                    <div class="analysis-section">
                        <strong>詳細解析：</strong>
                        <p id="explanationText" style="margin-top:0.35rem;"></p>
                    </div>
                    <div class="error-analysis" id="errorAnalysisBox">
                        <strong>觀念澄清與錯誤分析：</strong>
                        <p id="errorAnalysisText" style="margin-top:0.35rem;"></p>
                    </div>
                </div>

                <div class="control-panel">
                    <button class="btn-nav-main" id="prevBtn" onclick="prevQuestion()">
                        <svg class="svg-icon" id="prevIcon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        <span>上一個</span>
                    </button>
                    <button class="btn-nav-main" id="nextBtn" onclick="nextQuestion()">
                        <span id="nextText">下一個</span>
                        <svg class="svg-icon" id="nextIcon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            {
                id: 76,
                type: "single",
                title: "有關「童工」之敘述，下列何者正確？",
                options: [
                    "每日工作時間不得超過 8 小時",
                    "不得於午後 8 時至翌晨 8 時之時間內工作",
                    "例假日得在監視下工作",
                    "工資不得低於基本工資之 70%"
                ],
                answer: [0],
                explanation: "勞基法規定童工（15歲以上未滿16歲者）每日工作時間不得超過8小時，且不得於午後8時至翌晨6時之時間內工作（夜間工作限制），例假日不得工作，工資亦無打折規定。",
                errorAnalysis: "童工工時與夜間工作受嚴格保護，不得超時或夜間工作。"
            },
            {
                id: 77,
                type: "single",
                title: "依勞動檢查法施行細則規定，事業單位如不服勞動檢查結果，應於勞動檢查結果通知書送達之次日起 10 日內，以書面敘明理由向勞動檢查機構提出？",
                options: [
                    "申訴",
                    "陳情",
                    "抗議",
                    "異議"
                ],
                answer: [3],
                explanation: "依勞動檢查法施行細則規定，事業單位對勞動檢查結果有異議時，應於通知書送達次日起10日內以書面敘明理由向原勞動檢查機構提出「異議」。",
                errorAnalysis: "不服勞檢結果之法定救濟程序為向原機構提出異議。"
            },
            {
                id: 78,
                type: "single",
                title: "工作者若因雇主違反職業安全衛生法規定而發生職業災害、罹患職業病或身體、精神遭受不法侵害所提起之訴訟，得向勞動部委託之民間團體提出下列何者？",
                options: [
                    "災害理賠",
                    "申請扶助",
                    "精神補償",
                    "國家賠償"
                ],
                answer: [1],
                explanation: "勞工因職災或職場不法侵害提起訴訟時，可依規定向勞動部委託之民間團體（如法律扶助基金會等）申請訴訟「扶助」。",
                errorAnalysis: "勞動部提供勞工職災訴訟與法律扶助機制協助勞工維權。"
            },
            {
                id: 79,
                type: "single",
                title: "計算平日加班費須按平日前每小時工資額加給計算，下列何者錯誤？",
                options: [
                    "前 2 小時至少加給 1/3 倍",
                    "超過 2 小時部分至少加給 2/3 倍",
                    "經勞資協商同意後，一律加給 0.5 倍",
                    "未經雇主同意給加班費者，一律補休"
                ],
                answer: [3],
                explanation: "延長工作時間之工資（加班費）法定標準為前2小時按平日每小時工資額至少加給1/3以上（即給1又1/3倍以上），再超過部分至少加給2/3以上。選項(4)「未經雇主同意給加班費者，一律補休」不符勞基法規定（補休須經勞資雙方合意，且由勞工排定）。",
                errorAnalysis: "加班費法定加給比例有明確下限，補休必須基於勞雇雙方合意。"
            },
            {
                id: 80,
                type: "single",
                title: "下列工作場所何者非屬勞動檢查法所定之危險性工作場所？",
                options: [
                    "農藥製造",
                    "金屬表面處理",
                    "火藥類製造",
                    "從事石油裂解之石化工業 之工作場所"
                ],
                answer: [1],
                explanation: "勞動檢查法所定之危險性工作場所包含：甲類（農藥製造、火藥類製造、石油裂解等）、乙類、丙類、丁類等。金屬表面處理不屬於法定列管之特定危險性工作場所。",
                errorAnalysis: "金屬表面處理非屬法定公告之危險性工作場所審查對象。"
            },
            {
                id: 81,
                type: "single",
                title: "依職業安全衛生設施規則規定，有關電氣安全，下列何者錯誤？",
                options: [
                    "110 伏特之電壓不致造成人員死亡",
                    "電氣室應禁止非工作人員進入",
                    "不可以濕手操作電氣開關，且切斷開關應迅速",

        let currentIndex = 0;
        let userAnswers = {}; 
        let isSubmitted = {}; 

        window.onload = () => {
            renderQuestionGrid();
            loadQuestion(currentIndex);
        };

        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${index === currentIndex ? 'active' : ''} ${userAnswers[index] !== undefined && isSubmitted[index] ? 'answered' : ''}`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentIndex = index;
                    loadQuestion(currentIndex);
                    closeSidebarOnMobile();
                };
                grid.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('qNumber').innerText = `第 ${q.id} 題 / 共 ${questions.length} 題`;
            
            document.getElementById('qText').innerHTML = q.title;

            const badge = document.getElementById('qTypeBadge');
            const submitBtn = document.getElementById('submitMultiBtn');

            if (q.type === 'multi') {
                badge.innerText = "多選題";
                badge.className = "type-badge multi";
                submitBtn.style.display = "block";
            } else {
                badge.innerText = "單選題";
                badge.className = "type-badge";
                submitBtn.style.display = "none";
            }

            const optionsContainer = document.getElementById('optionsList');
            optionsContainer.innerHTML = '';

            const submitted = isSubmitted[index] === true;

            q.options.forEach((optText, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                const labelText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;

                if (q.type === 'single') {
                    optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                    if (submitted) {
                        optDiv.classList.add('disabled');
                        if (optIdx === q.answer[0]) {
                            optDiv.classList.add('correct');
                        } else if (userAnswers[index] === optIdx) {
                            optDiv.classList.add('wrong');
                        }
                    } else {
                        optDiv.onclick = () => {
                            userAnswers[index] = optIdx;
                            isSubmitted[index] = true;
                            loadQuestion(currentIndex);
                        };
                    }
                } else {
                    const isSelected = userAnswers[index] && userAnswers[index].includes(optIdx);

                    if (!submitted) {
                        if (isSelected) {
                            optDiv.classList.add('multi-selected');
                        }
                        optDiv.onclick = () => {
                            toggleMultiSelection(optIdx);
                            loadQuestion(currentIndex);
                        };
                        optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                    } else {
                        optDiv.classList.add('disabled');
                        const isCorrectOpt = q.answer.includes(optIdx);

                        if (isSelected && isCorrectOpt) {
                            optDiv.classList.add('multi-correct-hit');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        } else if (isSelected && !isCorrectOpt) {
                            optDiv.classList.add('multi-wrong-hit');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        } else if (!isSelected && isCorrectOpt) {
                            optDiv.classList.add('multi-missed');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span><span class="missed-tag">未選到</span>`;
                        } else {
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        }
                    }
                }

                optionsContainer.appendChild(optDiv);
            });

            if (q.type === 'multi') {
                submitBtn.disabled = submitted;
            }

            const feedbackBox = document.getElementById('feedbackBox');
            if (submitted) {
                showFeedback(index);
            } else {
                feedbackBox.classList.remove('show');
            }

            updateNavButtons();
            renderQuestionGrid();

            if (window.MathJax) {
                MathJax.typesetPromise([
                    document.getElementById('qText'),
                    document.getElementById('optionsList')
                ]).catch((err) => console.log(err));
            }
        }

        function toggleMultiSelection(optIdx) {
            if (!userAnswers[currentIndex]) {
                userAnswers[currentIndex] = [];
            }
            const idx = userAnswers[currentIndex].indexOf(optIdx);
            if (idx > -1) {
                userAnswers[currentIndex].splice(idx, 1);
            } else {
                userAnswers[currentIndex].push(optIdx);
            }
        }

        function submitMultiAnswer() {
            if (!userAnswers[currentIndex] || userAnswers[currentIndex].length === 0) {
                alert("請至少選擇一個選項！");
                return;
            }
            isSubmitted[currentIndex] = true;
            loadQuestion(currentIndex);
        }

        function showFeedback(qIdx) {
            const q = questions[qIdx];
            const feedbackBox = document.getElementById('feedbackBox');
            const statusDiv = document.getElementById('feedbackStatus');
            
            let isCorrect = false;
            if (q.type === 'single') {
                isCorrect = userAnswers[qIdx] === q.answer[0];
            } else {
                const userSel = [...(userAnswers[qIdx] || [])].sort();
                const correctAns = [...q.answer].sort();
                isCorrect = JSON.stringify(userSel) === JSON.stringify(correctAns);
            }

            statusDiv.innerHTML = isCorrect ? 
                '<span style="color: var(--success-color);">✓ 答對了！解答精準</span>' : 
                '<span style="color: var(--error-color);">✗ 答案不完全正確，請參考下方解析與未選到標示：</span>';

            const correctTextArr = q.answer.map(idx => `${String.fromCharCode(65 + idx)}. ${q.options[idx]}`).join('、');
            document.getElementById('correctAnswer').innerText = correctTextArr;
            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('errorAnalysisText').innerText = q.errorAnalysis;

            feedbackBox.classList.add('show');
        }

        function updateNavButtons() {
            const nextBtn = document.getElementById('nextBtn');
            const nextText = document.getElementById('nextText');
            const prevBtn = document.getElementById('prevBtn');
            const nextIcon = document.getElementById('nextIcon');

            prevBtn.disabled = currentIndex === 0;

            if (currentIndex === questions.length - 1) {
                nextText.innerText = "最後一題";
                nextBtn.disabled = true;
                nextIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            } else {
                nextText.innerText = "下一個";
                nextBtn.disabled = false;
                nextIcon.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function jumpToFirst() {
            currentIndex = 0;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function jumpToLast() {
            currentIndex = questions.length - 1;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function searchQuestion() {
            const inputVal = parseInt(document.getElementById('searchInput').value);
            if (inputVal >= 76 && inputVal <= 100) {
                currentIndex = inputVal - 76;
                loadQuestion(currentIndex);
                closeSidebarOnMobile();
            } else {
                alert(`請輸入有效的題號 (76 - 100)`);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
</body>
</html>
