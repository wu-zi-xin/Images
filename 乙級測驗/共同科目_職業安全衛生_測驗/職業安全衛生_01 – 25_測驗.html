<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script id="MathJax-script" async
	src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
	</script>
    <title>工作項目 共同科目職業安全衛生 測驗 (1-25) - 實戰指南風格</title>
    <style>
        :root {
            --sidebar-bg: #131b2e;
            --sidebar-card: #1d273e;
            --sidebar-border: #2a3654;
            --sidebar-text: #e2e8f0;
            --sidebar-text-muted: #94a3b8;
            --active-blue: #2563eb;
            --active-blue-hover: #1d4ed8;
            --main-bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --callout-bg: #eff6ff;
            --callout-border: #3b82f6;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --missed-bg: #fef3c7;
            --missed-color: #b45309;
            --sidebar-width: 290px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-title-badge {
            background-color: #ec4899;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 0.3rem;
        }

        .app-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.3s ease;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.65rem 0.85rem;
            background-color: var(--sidebar-card);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--active-blue);
        }

        .search-btn {
            padding: 0.65rem 0.95rem;
            background-color: var(--active-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--active-blue-hover);
        }

        .question-grid-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--sidebar-text-muted);
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.55rem;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .q-btn {
            padding: 0.6rem 0.3rem;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .q-btn:hover {
            border-color: var(--active-blue);
            background-color: rgba(37, 99, 235, 0.2);
        }

        .q-btn.active {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .q-btn.answered {
            border-color: var(--active-blue);
            color: #60a5fa;
        }

        .sidebar-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn-sidebar-nav {
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-sidebar-nav:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .main-content {
            flex: 1;
            padding: 2.2rem 1.5rem;
            max-width: 840px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.2rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            color: var(--active-blue);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .type-badge {
            background-color: var(--active-blue);
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .type-badge.multi {
            background-color: #9333ea;
        }

        .question-title-box {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .accent-bar {
            width: 4px;
            height: 1.5rem;
            background-color: var(--active-blue);
            border-radius: 2px;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.65;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            padding: 1.1rem 1.25rem;
            background-color: #f8fafc;
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            min-height: 52px;
            text-align: left;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--active-blue);
            background-color: #eff6ff;
            transform: translateX(4px);
        }

        .option-item.correct {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: var(--success-color);
            font-weight: 700;
        }

        .option-item.wrong {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .option-item.multi-correct-hit {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: var(--success-color);
            font-weight: 700;
        }

        .option-item.multi-wrong-hit {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: var(--error-color);
            font-weight: 700;
        }

        .option-item.multi-missed {
            border-color: #d97706;
            background-color: var(--missed-bg);
            color: var(--missed-color);
            font-weight: 700;
        }

        .missed-tag {
            background-color: #d97706;
            color: #fff;
            font-size: 0.75rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 600;
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.multi-selected {
            background-color: #faf5ff;
            border-color: #9333ea;
            color: #7e22ce;
            font-weight: 600;
        }

        .option-content-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            width: 100%;
        }

        .submit-multi-btn {
            width: 100%;
            padding: 0.9rem;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: background-color 0.2s;
        }
        .submit-multi-btn:hover {
            background-color: #7e22ce;
        }
        .submit-multi-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .feedback-box {
            display: none;
            margin-bottom: 2rem;
            padding: 1.35rem 1.5rem;
            border-radius: 12px;
            background-color: var(--callout-bg);
            border: 1px solid #bfdbfe;
            border-left: 5px solid var(--callout-border);
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
        }

        .analysis-section {
            margin-top: 0.65rem;
            font-size: 0.98rem;
            line-height: 1.65;
            color: var(--text-secondary);
        }

        .analysis-section strong {
            color: var(--text-main);
        }

        .error-analysis {
            margin-top: 0.85rem;
            color: #991b1b;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .btn-nav-main {
            flex: 1;
            padding: 0.9rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 12px;
            background-color: #f1f5f9;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-nav-main:hover:not(:disabled) {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transform: translateY(-2px);
        }

        .btn-nav-main:hover:not(:disabled) .svg-icon {
            stroke: #ffffff;
        }

        .btn-nav-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #cbd5e1;
            background-color: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            transform: none;
        }

        .btn-nav-main:disabled .svg-icon {
            stroke: #94a3b8;
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            stroke: var(--active-blue);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.2s;
        }

        @media (max-width: 768px) {
            :root {
                --header-height: 85px; 
            }

            .header {
                height: var(--header-height);
                align-items: flex-start;
                padding-top: 1rem;
            }

            .hamburger-btn {
                display: block;
                margin-top: 0.1rem;
            }

            .sidebar {
                position: fixed;
                top: var(--header-height); 
                left: 0;
                bottom: 0;
                height: calc(100vh - var(--header-height));
                z-index: 101;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                padding: 1rem 0.75rem;
            }

            .quiz-card {
                padding: 1.4rem 1.1rem;
                border-radius: 14px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .btn-nav-main {
                padding: 0.85rem 0.8rem;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">
            <span class="header-title-badge">測驗</span>
            共同科目 職業安全衛生 工作項目 (1-25)
        </div>
        <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="選單">
            <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="search-box">
                <input type="number" id="searchInput" class="search-input" placeholder="搜尋題號 (1-25)" min="1" max="25">
                <button class="search-btn" onclick="searchQuestion()" aria-label="搜尋">
                    <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>

            <div class="question-grid-title">題號列表導覽：</div>
            <div class="question-grid" id="questionGrid"></div>

            <div class="sidebar-actions">
                <button class="btn-sidebar-nav" onclick="jumpToFirst()">
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
                    跳至第一題
                </button>
                <button class="btn-sidebar-nav" onclick="jumpToLast()">
                    跳至最後一題
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="quiz-card">
                <div class="question-header">
                    <span id="qNumber">第 1 題 / 共 25 題</span>
                    <span id="qTypeBadge" class="type-badge">單選題</span>
                </div>
                
                <div class="question-title-box">
                    <div class="accent-bar"></div>
                    <div class="question-text" id="qText">題目載入中...</div>
                </div>

                <div class="options-list" id="optionsList"></div>

                <button id="submitMultiBtn" class="submit-multi-btn" style="display: none;" onclick="submitMultiAnswer()">送出多選答案</button>

                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-title" id="feedbackStatus"></div>
                    <div class="analysis-section">
                        <strong>正確答案：</strong><span id="correctAnswer"></span>
                    </div>
                    <div class="analysis-section">
                        <strong>詳細解析：</strong>
                        <p id="explanationText" style="margin-top:0.35rem;"></p>
                    </div>
                    <div class="error-analysis" id="errorAnalysisBox">
                        <strong>觀念澄清與錯誤分析：</strong>
                        <p id="errorAnalysisText" style="margin-top:0.35rem;"></p>
                    </div>
                </div>

                <div class="control-panel">
                    <button class="btn-nav-main" id="prevBtn" onclick="prevQuestion()">
                        <svg class="svg-icon" id="prevIcon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        <span>上一個</span>
                    </button>
                    <button class="btn-nav-main" id="nextBtn" onclick="nextQuestion()">
                        <span id="nextText">下一個</span>
                        <svg class="svg-icon" id="nextIcon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                type: "single",
                title: "對於核計勞工所得有無低於基本（最低）工資，下列何者錯誤？",
                options: [
                    "僅計入在正常工時內之報酬",
                    "應計入加班費",
                    "不計入休假日出勤加給之工資",
                    "不計入競賽獎金"
                ],
                answer: [1],
                explanation: "依勞動基準法規定，計算勞工基本工資時，延長工作時間之工資（加班費）及休假日出勤加給之工資等因屬非經常性或額外給付，不應計入基本工資中。選項(2)稱「應計入加班費」為錯誤敘述。",
                errorAnalysis: "基本工資係指勞工在正常工作時間內所得之報酬，延長工時工資、休假日出勤加給及非經常性獎金均不計入。"
            },
            {
                id: 2,
                type: "single",
                title: "下列何者之工資日數得列入計算平均工資？",
                options: [
                    "請事假期間",
                    "職災醫療期間",
                    "發生計算事由之當日前 6 個月",
                    "放無薪假期間"
                ],
                answer: [2],
                explanation: "計算平均工資時，若遇到請事假、職災醫療期間或放無薪假（因不可抗力或事業單位原因停工），依勞基法施行細則規定，該期間之工資與日數均應扣除。因此「發生計算事由之當日前 6 個月」中的正常工作日數與工資方可列入計算。",
                errorAnalysis: "計算平均工資應扣除因請事假、職災醫療等致工資減少或無工資之期間與日數。"
            },
            {
                id: 3,
                type: "single",
                title: "有關「例假」之敘述，下列何者錯誤？",
                options: [
                    "每 7 日應有例假 1 日",
                    "工資照給",
                    "天災出勤時，工資加倍及補休",
                    "須給假，不必給工資"
                ],
                answer: [3],
                explanation: "勞基法規定之例假屬於強制休假且工資照給，選項(4)稱「不必給工資」為錯誤敘述。",
                errorAnalysis: "例假為法定應給假且工資照給之日，非無薪假。"
            },
            {
                id: 4,
                type: "single",
                title: "勞動基準法第 84 條之 1 規定之工作者，因工作特性特殊，就其工作時間之敘述，下列何者正確？",
                options: [
                    "完全不受限制",
                    "無例假與休假",
                    "不另給予延時工資",
                    "得由勞雇雙方另行約定"
                ],
                answer: [3],
                explanation: "勞基法第 84 條之 1（俗稱責任制工作者）規定，經中央主管機關核定公告之監督、管理人員或責任制專業人員，其工作時間、例假、休假、女性夜間工作等得由勞雇雙方另行約定，並報請當地主管機關核備，不受第 30 條、第 32 條、第 36 條、第 37 條、第 49 條規定之限制。",
                errorAnalysis: "責任制並非完全不受勞基法約束，而是工作時間等條件得由勞雇雙方另行約定並報備。"
            },
            {
                id: 5,
                type: "single",
                title: "依勞動基準法規定，雇主應置備勞工工資清冊並應保存幾年？",
                options: ["1 年", "2 年", "5 年", "10 年"],
                answer: [2],
                explanation: "勞基法第 23 條規定，雇主應置備勞工工資清冊，將發放日期、工資項目、金額等記入，並保存 5 年。",
                errorAnalysis: "工資清冊、出勤紀錄等法定人事資料依法均須保存 5 年。"
            },
            {
                id: 6,
                type: "single",
                title: "事業單位僱用勞工多少人以上者，應依勞動基準法規定訂立工作規則？",
                options: ["30 人", "50 人", "100 人", "200 人"],
                answer: [0],
                explanation: "勞基法第 70 條規定，雇主僱用勞工達 30 人以上者，應依其事業性質，訂立工作規則，報請主管機關核備後，公開揭示之。",
                errorAnalysis: "法定應訂立工作規則之事業單位僱用人數門檻為 30 人以上。"
            },
            {

        let currentIndex = 0;
        let userAnswers = {}; 
        let isSubmitted = {}; 

        window.onload = () => {
            renderQuestionGrid();
            loadQuestion(currentIndex);
        };

        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${index === currentIndex ? 'active' : ''} ${userAnswers[index] !== undefined && isSubmitted[index] ? 'answered' : ''}`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentIndex = index;
                    loadQuestion(currentIndex);
                    closeSidebarOnMobile();
                };
                grid.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('qNumber').innerText = `第 ${q.id} 題 / 共 ${questions.length} 題`;
            
            document.getElementById('qText').innerHTML = q.title;

            const badge = document.getElementById('qTypeBadge');
            const submitBtn = document.getElementById('submitMultiBtn');

            if (q.type === 'multi') {
                badge.innerText = "多選題";
                badge.className = "type-badge multi";
                submitBtn.style.display = "block";
            } else {
                badge.innerText = "單選題";
                badge.className = "type-badge";
                submitBtn.style.display = "none";
            }

            const optionsContainer = document.getElementById('optionsList');
            optionsContainer.innerHTML = '';

            const submitted = isSubmitted[index] === true;

            q.options.forEach((optText, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                const labelText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;

                if (q.type === 'single') {
                    optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                    if (submitted) {
                        optDiv.classList.add('disabled');
                        if (optIdx === q.answer[0]) {
                            optDiv.classList.add('correct');
                        } else if (userAnswers[index] === optIdx) {
                            optDiv.classList.add('wrong');
                        }
                    } else {
                        optDiv.onclick = () => {
                            userAnswers[index] = optIdx;
                            isSubmitted[index] = true;
                            loadQuestion(currentIndex);
                        };
                    }
                } else {
                    const isSelected = userAnswers[index] && userAnswers[index].includes(optIdx);

                    if (!submitted) {
                        if (isSelected) {
                            optDiv.classList.add('multi-selected');
                        }
                        optDiv.onclick = () => {
                            toggleMultiSelection(optIdx);
                            loadQuestion(currentIndex);
                        };
                        optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                    } else {
                        optDiv.classList.add('disabled');
                        const isCorrectOpt = q.answer.includes(optIdx);

                        if (isSelected && isCorrectOpt) {
                            optDiv.classList.add('multi-correct-hit');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        } else if (isSelected && !isCorrectOpt) {
                            optDiv.classList.add('multi-wrong-hit');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        } else if (!isSelected && isCorrectOpt) {
                            optDiv.classList.add('multi-missed');
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span><span class="missed-tag">未選到</span>`;
                        } else {
                            optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                        }
                    }
                }

                optionsContainer.appendChild(optDiv);
            });

            if (q.type === 'multi') {
                submitBtn.disabled = submitted;
            }

            const feedbackBox = document.getElementById('feedbackBox');
            if (submitted) {
                showFeedback(index);
            } else {
                feedbackBox.classList.remove('show');
            }

            updateNavButtons();
            renderQuestionGrid();

            if (window.MathJax) {
                MathJax.typesetPromise([
                    document.getElementById('qText'),
                    document.getElementById('optionsList')
                ]).catch((err) => console.log(err));
            }
        }

        function toggleMultiSelection(optIdx) {
            if (!userAnswers[currentIndex]) {
                userAnswers[currentIndex] = [];
            }
            const idx = userAnswers[currentIndex].indexOf(optIdx);
            if (idx > -1) {
                userAnswers[currentIndex].splice(idx, 1);
            } else {
                userAnswers[currentIndex].push(optIdx);
            }
        }

        function submitMultiAnswer() {
            if (!userAnswers[currentIndex] || userAnswers[currentIndex].length === 0) {
                alert("請至少選擇一個選項！");
                return;
            }
            isSubmitted[currentIndex] = true;
            loadQuestion(currentIndex);
        }

        function showFeedback(qIdx) {
            const q = questions[qIdx];
            const feedbackBox = document.getElementById('feedbackBox');
            const statusDiv = document.getElementById('feedbackStatus');
            
            let isCorrect = false;
            if (q.type === 'single') {
                isCorrect = userAnswers[qIdx] === q.answer[0];
            } else {
                const userSel = [...(userAnswers[qIdx] || [])].sort();
                const correctAns = [...q.answer].sort();
                isCorrect = JSON.stringify(userSel) === JSON.stringify(correctAns);
            }

            statusDiv.innerHTML = isCorrect ? 
                '<span style="color: var(--success-color);">✓ 答對了！解答精準</span>' : 
                '<span style="color: var(--error-color);">✗ 答案不完全正確，請參考下方解析與未選到標示：</span>';

            const correctTextArr = q.answer.map(idx => `${String.fromCharCode(65 + idx)}. ${q.options[idx]}`).join('、');
            document.getElementById('correctAnswer').innerText = correctTextArr;
            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('errorAnalysisText').innerText = q.errorAnalysis;

            feedbackBox.classList.add('show');
        }

        function updateNavButtons() {
            const nextBtn = document.getElementById('nextBtn');
            const nextText = document.getElementById('nextText');
            const prevBtn = document.getElementById('prevBtn');
            const nextIcon = document.getElementById('nextIcon');

            prevBtn.disabled = currentIndex === 0;

            if (currentIndex === questions.length - 1) {
                nextText.innerText = "最後一題";
                nextBtn.disabled = true;
                nextIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            } else {
                nextText.innerText = "下一個";
                nextBtn.disabled = false;
                nextIcon.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function jumpToFirst() {
            currentIndex = 0;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function jumpToLast() {
            currentIndex = questions.length - 1;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function searchQuestion() {
            const inputVal = parseInt(document.getElementById('searchInput').value);
            if (inputVal >= 1 && inputVal <= 25) {
                currentIndex = inputVal - 1;
                loadQuestion(currentIndex);
                closeSidebarOnMobile();
            } else {
                alert(`請輸入有效的題號 (1 - 25)`);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
</body>
</html>
