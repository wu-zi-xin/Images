<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作項目3 測驗 (76-100) - 實戰指南風格</title>
    <style>
        :root {
            /* 側邊欄與頁首 - 深藍夜空調 */
            --sidebar-bg: #131b2e;
            --sidebar-card: #1d273e;
            --sidebar-border: #2a3654;
            --sidebar-text: #e2e8f0;
            --sidebar-text-muted: #94a3b8;
            --active-blue: #2563eb;
            --active-blue-hover: #1d4ed8;

            /* 右側主要內容區 - 高閱讀性明亮調 */
            --main-bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-secondary: #475569;
            
            /* 解析與回饋色 */
            --callout-bg: #eff6ff;
            --callout-border: #3b82f6;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --missed-bg: #fef3c7;
            --missed-color: #b45309;

            --sidebar-width: 290px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        /* 頂部 Header */
        .header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-title-badge {
            background-color: #ec4899;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 0.3rem;
        }

        /* 主佈局 */
        .app-container {
            display: flex;
            flex: 1;
        }

        /* 側邊欄 - 深色風格 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.3s ease;
        }

        /* 搜尋列 */
        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.65rem 0.85rem;
            background-color: var(--sidebar-card);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--active-blue);
        }

        .search-btn {
            padding: 0.65rem 0.95rem;
            background-color: var(--active-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--active-blue-hover);
        }

        /* 題號網格 */
        .question-grid-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--sidebar-text-muted);
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.55rem;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .q-btn {
            padding: 0.6rem 0.3rem;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .q-btn:hover {
            border-color: var(--active-blue);
            background-color: rgba(37, 99, 235, 0.2);
        }

        .q-btn.active {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .q-btn.answered {
            border-color: var(--active-blue);
            color: #60a5fa;
        }

        .sidebar-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn-sidebar-nav {
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background-color: var(--sidebar-card);
            color: var(--sidebar-text);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-sidebar-nav:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* 主要測驗內容區 */
        .main-content {
            flex: 1;
            padding: 2.2rem 1.5rem;
            max-width: 840px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.2rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            color: var(--active-blue);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .type-badge {
            background-color: var(--active-blue);
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .type-badge.multi {
            background-color: #9333ea;
        }

        /* 題目內文 */
        .question-title-box {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .accent-bar {
            width: 4px;
            height: 1.5rem;
            background-color: var(--active-blue);
            border-radius: 2px;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.65;
            color: var(--text-main);
        }

        /* 選項清單 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            padding: 1.1rem 1.25rem;
            background-color: #f8fafc;
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            min-height: 52px;
            text-align: left;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--active-blue);
            background-color: #eff6ff;
            transform: translateX(4px);
        }

        /* 單選題狀態 */
        .option-item.correct {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: var(--success-color);
            font-weight: 700;
        }

        .option-item.wrong {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-content-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            width: 100%;
        }

        /* 即時解析區塊 */
        .feedback-box {
            display: none;
            margin-bottom: 2rem;
            padding: 1.35rem 1.5rem;
            border-radius: 12px;
            background-color: var(--callout-bg);
            border: 1px solid #bfdbfe;
            border-left: 5px solid var(--callout-border);
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
        }

        .analysis-section {
            margin-top: 0.65rem;
            font-size: 0.98rem;
            line-height: 1.65;
            color: var(--text-secondary);
        }

        .analysis-section strong {
            color: var(--text-main);
        }

        .error-analysis {
            margin-top: 0.85rem;
            color: #991b1b;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 控制按鈕列 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .btn-nav-main {
            flex: 1;
            padding: 0.9rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 12px;
            background-color: #f1f5f9;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-nav-main:hover:not(:disabled) {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transform: translateY(-2px);
        }

        .btn-nav-main:hover:not(:disabled) .svg-icon {
            stroke: #ffffff;
        }

        .btn-nav-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #cbd5e1;
            background-color: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            transform: none;
        }

        .btn-nav-main:disabled .svg-icon {
            stroke: #94a3b8;
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            stroke: var(--active-blue);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.2s;
        }

        /* RWD 手機版 */
        @media (max-width: 768px) {
/* 定義手機版標題列的高度（如果文字真的很多，可以把這裡的 80px 調大一點，例如 90px 或 100px） */
    :root {
        --header-height: 85px; 
    }

    .header {
        height: var(--header-height);
        align-items: flex-start; /* 讓標題允許多行文字往下長 */
        padding-top: 1rem;
    }

    .hamburger-btn {
        display: block;
        margin-top: 0.1rem;
    }

    .sidebar {
        position: fixed;
        /* 直接用剛才定義好的變數，讓側邊欄完美停在 Header 的正下方 */
        top: var(--header-height); 
        left: 0;
        bottom: 0;
        height: calc(100vh - var(--header-height)); /* 扣除 Header 高度，剛好填滿剩餘畫面 */
        z-index: 101;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
    }

    .sidebar.open {
        transform: translateX(0);
    }

            .main-content {
                padding: 1rem 0.75rem;
            }

            .quiz-card {
                padding: 1.4rem 1.1rem;
                border-radius: 14px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .btn-nav-main {
                padding: 0.85rem 0.8rem;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <!-- 頁首 Header -->
    <header class="header">
        <div class="header-title">
            <span class="header-title-badge">測驗</span>
            17200 網路架設 乙級 工作項目 03：區域網路與網際網路規劃架設 (76-100)
        </div>
        <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="選單">
            <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="app-container">
        <!-- 側邊欄 -->
        <aside class="sidebar" id="sidebar">
            <div class="search-box">
                <input type="number" id="searchInput" class="search-input" placeholder="搜尋題號 (76-100)" min="76" max="100">
                <button class="search-btn" onclick="searchQuestion()" aria-label="搜尋">
                    <svg class="svg-icon" style="stroke: #ffffff;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>

            <div class="question-grid-title">題號列表導覽：</div>
            <div class="question-grid" id="questionGrid">
                <!-- 動態 76-100 題號 -->
            </div>

            <div class="sidebar-actions">
                <button class="btn-sidebar-nav" onclick="jumpToFirst()">
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
                    跳至第一題
                </button>
                <button class="btn-sidebar-nav" onclick="jumpToLast()">
                    跳至最後一題
                    <svg class="svg-icon" style="stroke: var(--sidebar-text-muted);" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
                </button>
            </div>
        </aside>

        <!-- 主要測驗卡片區 -->
        <main class="main-content">
            <div class="quiz-card">
                <div class="question-header">
                    <span id="qNumber">第 76 題 / 共 25 題</span>
                    <span id="qTypeBadge" class="type-badge">單選題</span>
                </div>
                
                <div class="question-title-box">
                    <div class="accent-bar"></div>
                    <div class="question-text" id="qText">題目載入中...</div>
                </div>

                <div class="options-list" id="optionsList">
                    <!-- 動態選項 -->
                </div>

                <!-- 即時解析區 -->
                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-title" id="feedbackStatus"></div>
                    <div class="analysis-section">
                        <strong>正確答案：</strong><span id="correctAnswer"></span>
                    </div>
                    <div class="analysis-section">
                        <strong>詳細解析：</strong>
                        <p id="explanationText" style="margin-top:0.35rem;"></p>
                    </div>
                    <div class="error-analysis" id="errorAnalysisBox">
                        <strong>觀念澄清與錯誤分析：</strong>
                        <p id="errorAnalysisText" style="margin-top:0.35rem;"></p>
                    </div>
                </div>

                <!-- 控制按鈕列 -->
                <div class="control-panel">
                    <button class="btn-nav-main" id="prevBtn" onclick="prevQuestion()">
                        <svg class="svg-icon" id="prevIcon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        <span>上一個</span>
                    </button>
                    <button class="btn-nav-main" id="nextBtn" onclick="nextQuestion()">
                        <span id="nextText">下一個</span>
                        <svg class="svg-icon" id="nextIcon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 工作項目3 (76-100題) 題庫資料庫
        const questions = [
            {
                id: 76,
                type: "single",
                title: "下列何者為 ARP 協定功能？",
                options: [
                    "搜尋 Layer 3 目的位址",
                    "用以開發 Layer 4 資源表的快取",
                    "用以對應 IP 位址與 MAC 位址",
                    "送出廣播訊息尋找路由器 IP 位址"
                ],
                answer: [2],
                explanation: "ARP（Address Resolution Protocol，位址解析協定）的主要功能是將網路層的 IP 位址解析（對應）成資料鏈結層的硬體 MAC 位址。",
                errorAnalysis: "ARP 專門負責 IP 與 MAC 的轉換，與 Layer 4 或尋找路由器 IP 無關。"
            },
            {
                id: 77,
                type: "single",
                title: "當進行網路測試時，下列何者正確？",
                options: [
                    "應依序從 OSI 參考模型之第一層到第二層，依此類推",
                    "應直接處理 OSI 層中之特定層",
                    "應與管理階層共同處理",
                    "應以隨機方式測試 OSI 參考模型中的任一層"
                ],
                answer: [0],
                    explanation: "在進行網路問題排查或測試時，通常建議採用由下而上（From Bottom-Up）的方法，即從 OSI 參考模型的第一層（實體層）開始依序向上測試。",
                errorAnalysis: "網路除錯標準程序通常由實體層逐層向上檢查，而非隨機或直接跳到特定層。"
            },
            {
                id: 78,
                type: "single",
                title: "在處理網路連線問題時，下列何者正確？",
                options: [
                    "從 Layer 1 開始",
                    "從 Layer 2 開始",
                    "從 Layer 3 開始",
                    "從 Layer 7 開始"
                ],
                answer: [0],
                explanation: "處理網路連線故障排除（Troubleshooting）時，標準做法是從 OSI 第一層（實體層，如檢查實體線路、電源、接頭）開始排查。",
                errorAnalysis: "先確定實體線路與設備有電、連接正常，才能排除上層通訊問題。"
            },
            {
                id: 79,
                type: "single",
                title: "ICMP 為下列何者之縮寫？",
                options: [
                    "Internet Control Message Parameter",
                    "Internal Control Message Protocol",
                    "Internet Control Message Protocol",
                    "Internet Control Message Performance"
                ],
                answer: [2],
                explanation: "ICMP 的全名為 Internet Control Message Protocol（網際網路控制訊息協定），常用於傳遞錯誤訊息與網路診斷（如 ping 指令）。",
                errorAnalysis: "需注意英文原詞為 Internet Control Message Protocol。"
            },
            {
                id: 80,
                type: "single",
                title: "Telnet 為 OSI 參考模型中的哪一層協定？",
                options: [
                    "Layer 1",
                    "Layer 5",
                    "Layer 6",
                    "Layer 7"
                ],
                answer: [3],
                explanation: "Telnet 是一種遠端登入協定，運作在 OSI 參考模型的第七層（應用層）。",
                errorAnalysis: "應用層（Layer 7）協定還包含 HTTP、FTP、DNS、Telnet 等。"
            },
            {
                id: 81,
                type: "single",
                title: "比較二進位相位鍵控（Binary Phase-Shift Keying, BPSK）和四相相位鍵控（Quadrature Phase-Shift Keying, QPSK）的敘述，下列何者錯誤？",
                options: [
                    "QPSK 的傳輸速度比較快",
                    "QPSK 所需要的傳輸頻寬較大",
                    "BPSK 抗雜訊的能力較高",
                    "BPSK 較容易實作"
                ],
                answer: [1],
                explanation: "QPSK 在相同的符元率（Symbol Rate）下，每個符元可攜帶 2 個位元（BPSK 為 1 個位元），因此 QPSK 傳輸速度較快且「不需較大頻寬」即可傳送更多資料（頻寬效率較高）。故選項(2)敘述錯誤。",
                errorAnalysis: "QPSK 的頻寬效率比 BPSK 好，在同頻寬下可提供雙倍傳輸率。"
            },
            {
                id: 82,
                type: "single",
                title: "下列何種設備提供 LAN 的邏輯區間？",
                options: [
                    "路由器（Router）",
                    "橋接器（Bridge）",
                    "交換器（Switch）",
                    "集線器（Hub）"
                ],
                answer: [0],
                explanation: "路由器（Router）工作在網路層（Layer 3），可用於分隔廣播網域並提供 LAN 的邏輯區間與子網路劃分。",
                errorAnalysis: "集線器與交換器主要處理實體/資料鏈結層，無法有效做邏輯子網路區隔。"
            },
            {
                id: 83,
                type: "single",
                title: "區域網路中，下列何者不是採用 Layer 3 設備的目的？",
                options: [
                    "允許 LAN 區隔出子網路",
                    "允許與 WAN 連接",
                    "提供網路的邏輯結構",

                errorAnalysis: "無拉力/使用狀態下為 10 倍外徑；施工佈放時則有不同的規範倍數。"

            {

                type: "single",
                title: "依據「建築物屋內外電信設備設置技術規範」規定，屋内光纖之彎曲半徑應符合製造廠之規定，如無建議值時，佈放施工時不可小於光纖外徑的幾倍？",
                options: [

                answer: [1],
                explanation: "依據技術規範，屋內光纖在「佈放施工中」（受到拉力）時，其彎曲半徑不可小於光纖外徑的 15 倍。",
                errorAnalysis: "施工拉力狀態要求較嚴格（15倍），完工靜止狀態則可放寬至 10 倍外徑。"

        let currentIndex = 0;
        let userAnswers = {}; // 記錄使用者的選擇
        let isSubmitted = {}; // 記錄該題是否已經作答

        window.onload = () => {
            renderQuestionGrid();
            loadQuestion(currentIndex);
        };

        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${index === currentIndex ? 'active' : ''} ${userAnswers[index] !== undefined && isSubmitted[index] ? 'answered' : ''}`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentIndex = index;
                    loadQuestion(currentIndex);
                    closeSidebarOnMobile();
                };
                grid.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('qNumber').innerText = `第 ${q.id} 題 / 共 ${questions.length} 題`;
            document.getElementById('qText').innerText = q.title;

            const badge = document.getElementById('qTypeBadge');
            badge.innerText = "單選題";
            badge.className = "type-badge";

            const optionsContainer = document.getElementById('optionsList');
            optionsContainer.innerHTML = '';

            const submitted = isSubmitted[index] === true;

            q.options.forEach((optText, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                const labelText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;

                optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                if (submitted) {
                    optDiv.classList.add('disabled');
                    if (optIdx === q.answer[0]) {
                        optDiv.classList.add('correct');
                    } else if (userAnswers[index] === optIdx) {
                        optDiv.classList.add('wrong');
                    }
                } else {
                    optDiv.onclick = () => {
                        userAnswers[index] = optIdx;
                        isSubmitted[index] = true;
                        loadQuestion(currentIndex);
                    };
                }

                optionsContainer.appendChild(optDiv);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            if (submitted) {
                showFeedback(index);
            } else {
                feedbackBox.classList.remove('show');
            }

            updateNavButtons();
            renderQuestionGrid();
        }

        function showFeedback(qIdx) {
            const q = questions[qIdx];
            const feedbackBox = document.getElementById('feedbackBox');
            const statusDiv = document.getElementById('feedbackStatus');
            
            const isCorrect = userAnswers[qIdx] === q.answer[0];

            statusDiv.innerHTML = isCorrect ? 
                '<span style="color: var(--success-color);">✓ 答對了！解答精準</span>' : 
                '<span style="color: var(--error-color);">✗ 答案不正確，請參考下方解析：</span>';

            const correctTextArr = q.answer.map(idx => `${String.fromCharCode(65 + idx)}. ${q.options[idx]}`).join('、');
            document.getElementById('correctAnswer').innerText = correctTextArr;
            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('errorAnalysisText').innerText = q.errorAnalysis;

            feedbackBox.classList.add('show');
        }

        // 更新導覽按鈕
        function updateNavButtons() {
            const nextBtn = document.getElementById('nextBtn');
            const nextText = document.getElementById('nextText');
            const prevBtn = document.getElementById('prevBtn');
            const nextIcon = document.getElementById('nextIcon');

            prevBtn.disabled = currentIndex === 0;

            if (currentIndex === questions.length - 1) {
                nextText.innerText = "最後一題";
                nextBtn.disabled = true;
                nextIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            } else {
                nextText.innerText = "下一個";
                nextBtn.disabled = false;
                nextIcon.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function jumpToFirst() {
            currentIndex = 0;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function jumpToLast() {
            currentIndex = questions.length - 1;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function searchQuestion() {
            const inputVal = parseInt(document.getElementById('searchInput').value);
            if (inputVal >= 76 && inputVal <= 100) {
                currentIndex = inputVal - 76;
                loadQuestion(currentIndex);
                closeSidebarOnMobile();
            } else {
                alert(`請輸入有效的題號 (76 - 100)`);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
