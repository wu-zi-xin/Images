        .control-panel {
            display: flex;
            justify-content: space-between;

        .btn-nav-main {

            background-color: #f1f5f9;
            border: 1px solid var(--card-border);

            transition: all 0.2s ease;

        .btn-nav-main:hover:not(:disabled) {
            background-color: var(--active-blue);
            color: #ffffff;
            border-color: var(--active-blue);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transform: translateY(-2px);

        .btn-nav-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #cbd5e1;
            background-color: #e2e8f0;
            color: #94a3b8;

        .svg-icon {

        @media (max-width: 768px) {

            .hamburger-btn {
                display: block;
                margin-top: 0.1rem;
            }

            .sidebar {
                position: fixed;
                top: var(--header-height); 
                left: 0;
                bottom: 0;
                height: calc(100vh - var(--header-height));

                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                padding: 1rem 0.75rem;
            }

            .quiz-card {
                padding: 1.4rem 1.1rem;

            }

            .question-text {
                font-size: 1.1rem;
            }
        }
    </style>

    <script>
        const questions = [
            {
                id: 76,
                type: "single",
                title: "下列何種方式有助於節省洗衣機的用水量？",
                options: [
                    "洗衣機洗滌的衣物盡量裝滿，一次洗完",
                    "購買洗衣機時選購有省水標章的洗衣機，可有效節約用水",
                    "無需將衣物適當分類",
                    "洗滌衣物時盡量選擇高水位才洗得乾淨"
                ],
                answer: [1],
                explanation: "購買具備「省水標章」的洗衣機，能以更少的用水達到優異的洗滌效果，是直接且有效的節水方式。",
                errorAnalysis: "衣物過多或裝滿可能影響洗滌效率；應適當分類並選用適當水位。"
            },
            {
                id: 77,
                type: "single",
                title: "如果水龍頭流量過大，下列何種處理方式錯誤？",
                options: [
                    "加裝節水墊片或起波器",
                    "加裝可自動關閉水龍頭的自動感應器",
                    "直接換裝沒有省水標章的水龍頭",
                    "直接調整水龍頭到適當水量"
                ],
                answer: [2],
                explanation: "若要改善流量過大，應選擇加裝省水器材或更換具備省水標章的水龍頭，換裝「沒有省水標章」的水龍頭是錯誤的做法。",
                errorAnalysis: "應選用具省水標章的設備以落實節水。"
            },
            {
                id: 78,
                type: "single",
                title: "洗菜水、洗碗水、洗衣水、洗澡水等的清洗水，不可直接利用來做什麼用途？",
                options: ["洗地板", "沖馬桶", "澆花", "飲用水"],
                answer: [3],
                explanation: "回收的清洗水（生活雜排水）含有清潔劑、油脂或雜質，僅可作為洗地、沖馬桶或澆花等次級用水，絕對不可作為「飲用水」。",
                errorAnalysis: "生活回收水未達生飲標準，嚴禁直接飲用。"
            },
            {
                id: 79,
                type: "single",
                title: "如果馬桶有不正常的漏水問題，下列何者處理方式錯誤？",
                options: [
                    "因為馬桶還能正常使用，所以不用著急，等到不能用時再報修即可",
                    "立刻檢查馬桶水箱零件有無鬆脫，並確認有無漏水",
                    "滴幾滴食用色素到水箱裡，檢查有無色水流進馬桶，代表可能有漏水",
                    "通知水電行或檢修人員來檢修，徹底根絕漏水問題"
                ],
                answer: [0],
                explanation: "馬桶漏水往往會造成長期且大量的隱形水資源浪費，應立即報修處理，而不是拖延不管。",
                errorAnalysis: "馬桶暗漏會浪費大量水資源，應及早發現並根絕。"
            },
            {
                id: 80,
                type: "single",
                title: "水費的計量單位是「度」，一度水的容量大約有多少水？",
                options: [
                    "2,000 公升",
                    "3,000 個 600cc 的寶特瓶",
                    "1 立方米的水量",
                    "3 立方米的水量"
                ],
                answer: [2],
                explanation: "一度水等於 1 立方公尺（\\(1\\ m^3\\)），也就是 1,000 公升的水量。",
                errorAnalysis: "1度水 = 1立方公尺 = 1,000公升。"
            },
            {
                id: 81,
                type: "single",
                title: "臺灣在一年中什麼時期會比較缺水（即枯水期）？",
                options: ["6月至 9月", "9月至 12月", "11月至次年 4月", "臺灣全年不缺水"],
                answer: [2],
                explanation: "臺灣的降雨主要集中在夏季（梅雨與颱風季），而每年 11 月至次年 4 月雨量較少，為典型的枯水期。",
                errorAnalysis: "枯水期通常落在冬春之交（11月至次年4月）。"
            },
            {
                id: 82,
                type: "single",
                title: "下列何種現象「不是」直接造成臺灣缺水的原因？",
                options: [
                    "降雨季節分布不平均，有時候連續好幾個月不下雨，有時候又會下起豪大雨",
                    "地形山高坡陡，所以雨一下很快就會流入大海",
                    "因為民生與工商業用水需求量都愈來愈大，所以缺水季節很容易無水可用",
                    "臺灣地區夏天過熱，蒸發量過大"
                ],
                answer: [3],
                explanation: "臺灣缺水的主因在於降雨時空分布不均、陡峭地形導致水留不住及用水需求增加；夏天蒸發雖然存在，但並非主導枯水期缺水的核心關鍵原因。",
                errorAnalysis: "季節分布不均、地形陡峭與用水量大為主要原因。"
            },
            {
                id: 83,
                type: "single",
                title: "冷凍食品該如何讓它退冰，才是既「節能」又「省水」？",
                options: [
                    "直接用水沖食物強迫退冰",
                    "使用微波爐解凍快速又方便",
                    "烹煮前盡早拿出來放置退冰",
                    "用熱水浸泡，每 5 分鐘更換一次"
                ],
                answer: [2],
                explanation: "將冷凍食品提早拿到冷藏室或室溫自然退冰（解凍），不需消耗額外電力或浪費自來水沖洗，最為節能省水。",
                errorAnalysis: "用水沖或持續加熱解凍會消耗額外能源與水資源。"
            },
            {
                id: 84,
                type: "single",

        let currentIndex = 0;
        let userAnswers = {}; 
        let isSubmitted = {}; 

        window.onload = () => {
            renderQuestionGrid();
            loadQuestion(currentIndex);
        };

        function renderQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `q-btn ${index === currentIndex ? 'active' : ''} ${userAnswers[index] !== undefined && isSubmitted[index] ? 'answered' : ''}`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentIndex = index;
                    loadQuestion(currentIndex);
                    closeSidebarOnMobile();
                };
                grid.appendChild(btn);
            });
        }

        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('qNumber').innerText = `第 ${q.id} 題 / 共 ${questions.length} 題`;
            
            document.getElementById('qText').innerHTML = q.title;

            const badge = document.getElementById('qTypeBadge');
            badge.innerText = "單選題";

            const optionsContainer = document.getElementById('optionsList');
            optionsContainer.innerHTML = '';

            const submitted = isSubmitted[index] === true;

            q.options.forEach((optText, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                const labelText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;

                optDiv.innerHTML = `<span class="option-content-left">${labelText}</span>`;
                if (submitted) {
                    optDiv.classList.add('disabled');
                    if (optIdx === q.answer[0]) {
                        optDiv.classList.add('correct');
                    } else if (userAnswers[index] === optIdx) {
                        optDiv.classList.add('wrong');
                    }
                } else {
                    optDiv.onclick = () => {
                        userAnswers[index] = optIdx;
                        isSubmitted[index] = true;
                        loadQuestion(currentIndex);
                    };
                }

                optionsContainer.appendChild(optDiv);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            if (submitted) {
                showFeedback(index);
            } else {
                feedbackBox.classList.remove('show');
            }

            updateNavButtons();
            renderQuestionGrid();

            if (window.MathJax) {
                MathJax.typesetPromise([
                    document.getElementById('qText'),
                    document.getElementById('optionsList')
                ]).catch((err) => console.log(err));
            }
        }

        function showFeedback(qIdx) {
            const q = questions[qIdx];
            const feedbackBox = document.getElementById('feedbackBox');
            const statusDiv = document.getElementById('feedbackStatus');
            
            const isCorrect = userAnswers[qIdx] === q.answer[0];

            statusDiv.innerHTML = isCorrect ? 
                '<span style="color: var(--success-color);">✓ 答對了！解答精準</span>' : 
                '<span style="color: var(--error-color);">✗ 答案不正確，請參考下方解析：</span>';

            const correctTextArr = q.answer.map(idx => `${String.fromCharCode(65 + idx)}. ${q.options[idx]}`).join('、');
            document.getElementById('correctAnswer').innerText = correctTextArr;
            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('errorAnalysisText').innerText = q.errorAnalysis;

            feedbackBox.classList.add('show');
        }

        function updateNavButtons() {
            const nextBtn = document.getElementById('nextBtn');
            const nextText = document.getElementById('nextText');
            const prevBtn = document.getElementById('prevBtn');
            const nextIcon = document.getElementById('nextIcon');

            prevBtn.disabled = currentIndex === 0;

            if (currentIndex === questions.length - 1) {
                nextText.innerText = "最後一題";
                nextBtn.disabled = true;
                nextIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            } else {
                nextText.innerText = "下一個";
                nextBtn.disabled = false;
                nextIcon.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function jumpToFirst() {
            currentIndex = 0;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function jumpToLast() {
            currentIndex = questions.length - 1;
            loadQuestion(currentIndex);
            closeSidebarOnMobile();
        }

        function searchQuestion() {
            const inputVal = parseInt(document.getElementById('searchInput').value);
            if (inputVal >= 76 && inputVal <= 100) {
                currentIndex = inputVal - 76;
                loadQuestion(currentIndex);
                closeSidebarOnMobile();
            } else {
                alert(`請輸入有效的題號 (76 - 100)`);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
