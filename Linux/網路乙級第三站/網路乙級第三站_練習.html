<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>網路乙級第三站 - 手機通勤逐步練習｜新增內容整合版</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-code: #090d16;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 頂部導覽列 (修復破版) */
        header {
            background-color: #020617;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 56px;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .hamburger-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-size: 0.95rem;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mode-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
            display: none; /* 在極小螢幕隱藏以防破版 */
        }
        @media (min-width: 380px) {
            .mode-badge { display: inline-block; }
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .stat-val { font-weight: bold; }
        .stat-val.correct { color: var(--accent-green); }
        .stat-val.streak { color: var(--accent-yellow); }

        /* 外層容器 */
        .container {
            display: flex;
            margin-top: 56px;
            width: 100%;
            min-height: calc(100vh - 56px);
        }

        /* 電腦版側邊欄 */
        .sidebar {
            width: 260px;
            background: #090d16;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: calc(100vh - 56px);
            position: sticky;
            top: 56px;
            overflow-y: auto;
        }
        .sidebar-title {
            padding: 12px 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--bg-card);
            color: #ffffff;
            border-left: 4px solid var(--accent-blue);
        }
        .nav-item .step-tag {
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        /* 手機版抽屜導覽選單 */
        .mobile-drawer {
            position: fixed;
            top: 56px; left: -100%;
            width: 280px; max-width: 80vw;
            height: calc(100vh - 56px);
            background: #090d16;
            border-right: 1px solid var(--border-color);
            z-index: 1002;
            transition: left 0.3s ease;
            overflow-y: auto;
        }
        .mobile-drawer.open { left: 0; }
        .drawer-overlay {
            position: fixed;
            top: 56px; left: 0; width: 100vw; height: calc(100vh - 56px);
            background: rgba(0,0,0,0.6);
            z-index: 1001;
            display: none;
        }
        .drawer-overlay.open { display: block; }

        /* 主畫面區塊 */
        .main-canvas {
            flex: 1;
            min-width: 0; 
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 100%;
        }

        .step-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-direction: column;
            gap: 10px;
        }
        .step-title-group h2 {
            font-size: 1.15rem;
            color: #f8fafc;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .step-title-group p {
            color: var(--text-muted);
            font-size: 0.8rem;
            word-wrap: break-word;
        }
        .pc-toggle {
            display: flex;
            background: #090d16;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .pc-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .pc-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            word-wrap: break-word;
        }

        .question-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
            line-height: 1.4;
        }
        .question-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .question-desc code {
            background: var(--bg-code);
            color: #38bdf8;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-word;
        }

        .terminal-window {
            background: var(--bg-code);
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
            width: 100%;
        }
        .terminal-header {
            background: #1e293b;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #334155;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .terminal-title {
            margin-left: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .terminal-body {
            padding: 12px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            width: 100%;
        }

        /* 終端機版面修復 */
        .cmd-line {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap; /* 允許輸入框換行防破版 */
            width: 100%;
        }
        .prompt {
            color: #10b981;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap; /* 保持提示字元不被切斷 */
        }
        .cmd-input {
            flex: 1;
            min-width: 100px; /* 縮小最小寬度防破版 */
            background: transparent;
            border: none;
            border-bottom: 2px solid #475569;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            padding: 4px 2px;
            outline: none;
            transition: border-color 0.2s;
        }
        .cmd-input:focus {
            border-bottom-color: var(--accent-blue);
        }
        .cmd-input.error {
            border-bottom-color: var(--accent-red) !important;
            animation: shake 0.3s;
        }
        .cmd-input.success {
            border-bottom-color: var(--accent-green) !important;
            color: var(--accent-green);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .vim-window {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.7;
            color: #e5e7eb;
            font-size: 0.85rem;
            overflow-x: auto;
            width: 100%;
        }
        .vim-filename {
            color: #9ca3af;
            font-size: 0.75rem;
            margin-bottom: 6px;
            border-bottom: 1px solid #374151;
            padding-bottom: 4px;
            word-break: break-all;
        }
        
        /* Vim 填空版面修復 */
        .blank-input {
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: #f3f4f6;
            padding: 3px 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            outline: none;
            margin: 2px 2px;
            width: auto;       /* 取消 100% 防止單行擠破版面 */
            min-width: 80px;   /* 設定最小與最大寬度 */
            max-width: 160px;
            transition: all 0.2s;
            display: inline-block;
        }
        .blank-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }
        .blank-input.correct {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            font-weight: bold;
        }
        .blank-input.wrong {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: stretch;
            flex-direction: column;
            width: 100%;
        }
        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 44px;
        }
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-hint {
            background: #334155;
            color: #fbbf24;
        }
        .btn-hint:hover { background: #475569; }
        .btn-skip {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-skip:hover { background: #1e293b; color: white; }

        .feedback-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
            animation: fadeIn 0.3s;
            word-wrap: break-word;
        }
        .feedback-box.correct {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--accent-green);
            color: #34d399;
        }
        .feedback-box.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid var(--accent-red);
            color: #f87171;
        }
        .feedback-box.hint {
            display: block;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid var(--accent-yellow);
            color: #fbbf24;
        }

        .notes-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.85rem;
            word-wrap: break-word;
        }
        .notes-card h3 {
            color: #38bdf8;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            font-size: 0.95rem;
        }
        .notes-card code {
            background: var(--bg-code);
            color: #38bdf8;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 851px) {
            .hamburger-btn { display: none !important; }
            .sidebar { display: flex !important; }
            .mobile-drawer, .drawer-overlay { display: none !important; }
            .controls { flex-direction: row; }
            .controls .btn { width: auto; flex: 1; }
            .step-header { flex-direction: row; align-items: center; }
            .pc-toggle { width: auto; }
            .pc-btn { flex: unset; padding: 6px 14px; }
            .blank-input { width: auto; max-width: 250px; }
        }

        @media (max-width: 850px) {
            .sidebar { display: none !important; }
            .hamburger-btn { display: flex !important; }
            .main-canvas { width: 100%; margin-left: 0; }
        }

        /* ===== 新增內容整合版：簡潔步驟導覽 ===== */
        .question-nav { display:flex; gap:8px; width:100%; }
        .question-nav .btn { min-height:40px; padding:8px 12px; }
        .phase-tip { background:#0b1220; border:1px solid #334155; border-left:4px solid #38bdf8; border-radius:8px; padding:10px 12px; color:#cbd5e1; font-size:.82rem; line-height:1.55; }
        .verify-badge { display:inline-block; padding:2px 7px; border-radius:999px; background:rgba(16,185,129,.14); color:#34d399; border:1px solid rgba(16,185,129,.35); font-size:.72rem; margin-left:6px; }
        .input-badge { display:inline-block; padding:2px 7px; border-radius:999px; background:rgba(56,189,248,.14); color:#38bdf8; border:1px solid rgba(56,189,248,.35); font-size:.72rem; margin-left:6px; }
        .fill-window { background:#111827; border:1px solid #374151; border-radius:8px; padding:12px; font-family:'Courier New',monospace; line-height:1.8; color:#e5e7eb; font-size:.86rem; }
        .fill-title { color:#9ca3af; font-size:.75rem; border-bottom:1px solid #374151; margin-bottom:8px; padding-bottom:5px; }
        @media (max-width:850px){
            .main-canvas{padding:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom));gap:10px}
            .quiz-card,.step-header,.notes-card{border-radius:9px;padding:12px}
            .question-title{font-size:1rem}.question-desc{font-size:.86rem}
            .terminal-body{padding:11px 9px}.cmd-input{font-size:16px}
            .blank-input{font-size:16px;max-width:100%;min-width:90px}
            .question-nav{position:sticky;bottom:0;z-index:20;background:rgba(15,23,42,.95);padding:7px 0 calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
        }


        /* ===== 即時麵包屑流程列：常駐、可點擊、水平自動跟隨 ===== */
        .flow-panel {
            position: sticky;
            top: 62px;
            z-index: 900;
            background: rgba(9, 13, 22, .94);
            border: 1px solid rgba(71, 85, 105, .78);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.26);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .flow-panel-header {
            width: 100%;
            border: 0;
            background: linear-gradient(180deg, rgba(30,41,59,.96), rgba(15,23,42,.94));
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px 8px;
            text-align: left;
        }
        .flow-panel-title {
            min-width: 0;
            font-size: .82rem;
            font-weight: 850;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .flow-panel-summary {
            flex: 0 0 auto;
            font-size: .7rem;
            color: #bfdbfe;
            white-space: nowrap;
            background: rgba(59,130,246,.12);
            border: 1px solid rgba(96,165,250,.25);
            border-radius: 999px;
            padding: 3px 7px;
        }
        .flow-list {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 10px;
            scroll-behavior: smooth;
            scrollbar-width: none;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .flow-list::-webkit-scrollbar { display: none; }
        .flow-item {
            position: relative;
            flex: 0 0 auto;
            min-width: 118px;
            max-width: 168px;
            border: 0;
            background: transparent;
            color: #94a3b8;
            padding: 0 20px 0 0;
            display: grid;
            grid-template-columns: 28px minmax(0,1fr);
            grid-template-rows: auto auto;
            column-gap: 7px;
            row-gap: 1px;
            align-items: center;
            text-align: left;
            cursor: pointer;
            scroll-snap-align: center;
        }
        .flow-item:not(:last-child)::after {
            content: '›';
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 1.25rem;
            font-weight: 900;
        }
        .flow-num {
            grid-column: 1;
            grid-row: 1 / span 2;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: .7rem;
            font-weight: 900;
            transition: .2s ease;
        }
        .flow-name {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: .74rem;
            line-height: 1.2;
            color: #cbd5e1;
        }
        .flow-status {
            grid-column: 2;
            grid-row: 2;
            font-size: .62rem;
            line-height: 1.15;
            color: #64748b;
            white-space: nowrap;
        }
        .flow-item:hover .flow-num { border-color:#64748b; transform: translateY(-1px); }
        .flow-item.done .flow-num {
            background: #065f46;
            border-color: #10b981;
            color: #d1fae5;
            box-shadow: 0 0 0 3px rgba(16,185,129,.08);
        }
        .flow-item.done .flow-name { color: #a7f3d0; }
        .flow-item.done .flow-status { color: #34d399; }
        .flow-item.current {
            min-width: 150px;
            max-width: 190px;
        }
        .flow-item.current .flow-num {
            background: #2563eb;
            border-color: #60a5fa;
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 0 0 4px rgba(59,130,246,.13), 0 0 18px rgba(59,130,246,.25);
        }
        .flow-item.current .flow-name { color: #fff; font-weight: 900; }
        .flow-item.current .flow-status { color: #93c5fd; font-weight: 800; }
        .flow-item.current::before {
            content: '';
            position: absolute;
            left: 0;
            right: 18px;
            bottom: -7px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
        }
        .flow-current-bar {
            display: flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 12px 7px;
            border-top: 1px solid rgba(51,65,85,.65);
            background: rgba(2,6,23,.72);
            color: #cbd5e1;
            font-size: .7rem;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .flow-current-bar b { color: #38bdf8; }
        @media (max-width: 850px) {
            .flow-panel {
                top: 58px;
                margin-left: -2px;
                margin-right: -2px;
                border-radius: 11px;
                box-shadow: 0 8px 24px rgba(0,0,0,.3);
            }
            .flow-panel-header { padding: 7px 9px 6px; }
            .flow-panel-title { font-size: .76rem; }
            .flow-panel-summary { font-size: .64rem; padding: 2px 6px; }
            .flow-list { padding: 7px 8px 8px; }
            .flow-item { min-width: 102px; max-width: 140px; padding-right: 17px; column-gap: 6px; }
            .flow-item.current { min-width: 132px; max-width: 160px; }
            .flow-num { width: 25px; height: 25px; font-size: .66rem; }
            .flow-name { font-size: .69rem; }

        let currentStep = 'step-A';

        function completionKey(step=currentStep, pc=currentPC, idx=currentQuestionIdx) {
            return `${step}|${pc}|${idx}`;
        }

        function saveCompleted() {
            try { localStorage.setItem('netBFlowCompleted', JSON.stringify(completedQuestions)); } catch(e) {}
        }

        function markCurrentCompleted() {
            completedQuestions[completionKey()] = true;
            saveCompleted();
            renderFlowPanel();
        }

        function jumpToFlowQuestion(idx) {
            const questions = quizData[currentStep]?.[currentPC] || [];
            if (idx < 0 || idx >= questions.length) return;
            currentQuestionIdx = idx;
            renderQuestion();
        }

        function renderFlowPanel() {
            const list = document.getElementById('flowList');
            if (!list) return;
            const questions = quizData[currentStep]?.[currentPC] || [];
            const doneCount = questions.reduce((n, q, i) => n + (completedQuestions[completionKey(currentStep,currentPC,i)] ? 1 : 0), 0);
            document.getElementById('flowPcLabel').innerText = currentPC;
            document.getElementById('flowSummary').innerText = `${doneCount} / ${questions.length} 完成`;
            list.innerHTML = questions.map((q,i) => {
                const done = !!completedQuestions[completionKey(currentStep,currentPC,i)];
                const cur = i === currentQuestionIdx;
                const cls = `flow-item${done ? ' done' : ''}${cur ? ' current' : ''}`;
                const status = cur ? '← 目前' : (done ? '✓ 完成' : '待練');
                const icon = done ? '✓' : (i+1);
                return `<button type="button" class="${cls}" data-flow-index="${i}" onclick="jumpToFlowQuestion(${i})"><span class="flow-num">${icon}</span><span class="flow-name">${q.title}</span><span class="flow-status">${status}</span></button>`;
            }).join('');
            const q = questions[currentQuestionIdx];
            const currentBar = document.getElementById('flowCurrentBar');
            if (q) currentBar.innerHTML = `現在正在做 <b>第 ${currentQuestionIdx+1} 步 / 共 ${questions.length} 步</b>：${q.title}`;
            else currentBar.innerHTML = `<b>${currentPC}</b> 這個大項已完成。`;
            requestAnimationFrame(() => {
                const curEl = list.querySelector('.flow-item.current');
                if (curEl) {
                    const target = curEl.offsetLeft - (list.clientWidth - curEl.offsetWidth) / 2;
                    list.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
                }
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isCorrect) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (isCorrect) {
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch(e) {}
        }

        function renderQuestion() {
            const quizCard = document.getElementById('quizCard');
            const questions = quizData[currentStep]?.[currentPC] || [];
            if (questions.length === 0 || currentQuestionIdx >= questions.length) {
                quizCard.innerHTML = `
                    <div style="text-align: center; padding: 20px 10px;">
                        <h3 style="color: #10b981; font-size: 1.2rem; margin-bottom: 10px;">🎉 本大項 (${currentPC}) 練習完成！</h3>
                        <p style="color: #94a3b8; margin-bottom: 15px; font-size: 0.85rem;">此電腦在這一大項已完成，可切換 PC1 / PC2 或進入下一步。</p>
                        <button class="btn btn-primary" style="margin: 0 auto; width: auto; padding: 8px 20px;" onclick="nextStepAuto()">進入下一步驟 ➔</button>
                    </div>
                `;
                updateProgressBar();
                renderFlowPanel();
                return;
            }

            const q = questions[currentQuestionIdx];
            let html = `
                <div class="question-title">${q.title}${q.type === 'select' ? '<span class=\"verify-badge\">驗收選擇</span>' : '<span class=\"input-badge\">手動輸入</span>'}</div>
                <div class="question-desc">${q.desc}</div>
            `;

            if (q.type === 'select') {
                html += `<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">`;
                q.options.forEach((opt, idx) => {
                    html += `
                        <button class="btn btn-skip" style="justify-content: flex-start; text-align: left; padding: 10px 12px; font-size: 0.85rem; height: auto;" onclick="checkSelect(${idx}, ${q.correct})">
                            <b>${String.fromCharCode(65 + idx)}.</b>&nbsp;${opt}
                        </button>
                    `;
                });
                html += `</div>`;
            } else if (q.type === 'terminal') {
                html += `
                    <div class="terminal-window">
                        <div class="terminal-header">
                            <span class="dot dot-red"></span>
                            <span class="dot dot-yellow"></span>
                            <span class="dot dot-green"></span>
                            <span class="terminal-title">Terminal</span>
                        </div>
                        <div class="terminal-body">
                            <div class="cmd-line">
                                <span class="prompt">${q.prompt}</span>
                                <input type="text" class="cmd-input" id="terminalInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="請輸入完整指令..." onkeydown="handleTermKey(event)">
                            </div>
                        </div>
                    </div>
                    <div class="controls">
                        <button class="btn btn-primary" onclick="checkTerminal()">提交驗證 ➔</button>
                        <button class="btn btn-hint" onclick="showHint('${q.hint}')">💡 提示</button>
                        <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
                    </div>
                `;
            } else if (q.type === 'vim') {
                let vimBody = q.template;
                q.blanks.forEach(b => {
                    const inputHtml = `<input type="text" class="blank-input" id="${b.id}" placeholder="${b.placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
                    vimBody = vimBody.replace(`{${b.id}}`, inputHtml);
                });
                html += `
                    <div class="vim-window">
                        <div class="vim-filename">📄 VIM: ${q.filename}</div>
                        <div>${vimBody}</div>
                    </div>
                    <div class="controls">
                        <button class="btn btn-primary" onclick="checkVim()">💾 儲存驗證 ➔</button>
                        <button class="btn btn-hint" onclick="showVimAnswer()">👀 解答</button>
                        <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
                    </div>
                `;
            }

            html += `<div class="feedback-box" id="feedbackBox"></div>`;
            quizCard.innerHTML = html;

            setTimeout(() => {
                const termIn = document.getElementById('terminalInput');
                if (termIn) termIn.focus();
            }, 100);

            updateProgressBar();
            renderFlowPanel();
        }

        function checkSelect(selectedIdx, correctIdx) {

                playBeep(true);
                fb.className = 'feedback-box correct';
                fb.innerHTML = `<b>✅ 正確！</b> ${quizData[currentStep][currentPC][currentQuestionIdx].explanation}`;
                markCurrentCompleted();
                setTimeout(() => { currentQuestionIdx++; renderQuestion(); }, 1200);
            } else {
                streak = 0;
                playBeep(false);
                fb.className = 'feedback-box incorrect';
                fb.innerHTML = `<b>❌ 答案不正確！</b> 請再想想看。`;
            }
            updateStats();
        }

        function checkTerminal() {
            const inputEl = document.getElementById('terminalInput');
            if (!inputEl) return;
            const val = inputEl.value.trim().replace(/\s+/g, ' ');
            const q = quizData[currentStep][currentPC][currentQuestionIdx];
            const fb = document.getElementById('feedbackBox');

            totalAnswered++;
            if (q.answers.some(ans => ans.toLowerCase() === val.toLowerCase())) {
                totalCorrect++;
                streak++;
                playBeep(true);
                inputEl.className = 'cmd-input success';
                fb.className = 'feedback-box correct';
                fb.innerHTML = `<b>✅ 指令正確！</b><br>${q.explanation}`;
                markCurrentCompleted();
                setTimeout(() => { currentQuestionIdx++; renderQuestion(); }, 1200);
            } else {
                streak = 0;
                playBeep(false);
                inputEl.className = 'cmd-input error';
                fb.className = 'feedback-box incorrect';
                fb.innerHTML = `<b>❌ 指令或路徑不符！</b><br>請確認是否有確實輸入對應的資料夾切換 (cd) 或參數。`;
            }
            updateStats();
        }

        function checkVim() {
            const q = quizData[currentStep][currentPC][currentQuestionIdx];
            const fb = document.getElementById('feedbackBox');
            let allCorrect = true;

            q.blanks.forEach(b => {
                const el = document.getElementById(b.id);
                if (el) {
                    const userVal = el.value.trim();
                    if (userVal.toLowerCase() === b.answer.toLowerCase()) {
                        el.className = 'blank-input correct';
                    } else {
                        el.className = 'blank-input wrong';
                        allCorrect = false;
                    }
                }
            });

            totalAnswered++;
            if (allCorrect) {
                totalCorrect++;
                streak++;
                playBeep(true);
                fb.className = 'feedback-box correct';
                fb.innerHTML = `<b>✅ 填寫正確！</b><br>${q.explanation}`;
                markCurrentCompleted();
                setTimeout(() => { currentQuestionIdx++; renderQuestion(); }, 1200);
            } else {
                streak = 0;
                playBeep(false);
                fb.className = 'feedback-box incorrect';
                fb.innerHTML = `<b>❌ 紅框處參數錯誤！</b>`;
            }
            updateStats();
        }

        function showHint(hintText) {
            const fb = document.getElementById('feedbackBox');
            fb.className = 'feedback-box hint';
            fb.innerHTML = `<b>💡 指令提示：</b> <code>${hintText}</code>`;
        }

        function showVimAnswer() {
            const q = quizData[currentStep][currentPC][currentQuestionIdx];
            q.blanks.forEach(b => {
                const el = document.getElementById(b.id);
                if (el) el.value = b.answer;
            });
            const fb = document.getElementById('feedbackBox');
            fb.className = 'feedback-box hint';
            fb.innerHTML = `<b>👀 已自動填入解答</b>`;
        }

        function skipQuestion() {
            currentQuestionIdx++;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) { currentQuestionIdx--; renderQuestion(); }
        }

        function nextQuestionManual() {
            const questions = quizData[currentStep]?.[currentPC] || [];
            if (currentQuestionIdx < questions.length - 1) { currentQuestionIdx++; renderQuestion(); }
        }

        function nextStepAuto() {
            const stepKeys = Object.keys(quizData);
            const curIdx = stepKeys.indexOf(currentStep);
            if (curIdx < stepKeys.length - 1) {
                const nextStepKey = stepKeys[curIdx + 1];
                const navItems = document.querySelectorAll('#desktopNavContainer .nav-item');
                switchStep(nextStepKey, navItems[curIdx + 1]);
            }
        }

        function updateStats() {
            const accEl = document.getElementById('accuracyVal');
            const streakEl = document.getElementById('streakVal');
            const progEl = document.getElementById('progressText');

            const acc = totalAnswered === 0 ? 100 : Math.round((totalCorrect / totalAnswered) * 100);
            accEl.innerText = acc + '%';
            streakEl.innerText = streak;

            const questions = quizData[currentStep]?.[currentPC] || [];
            progEl.innerText = `${currentQuestionIdx + 1} / ${questions.length || 1}`;
        }

        function updateProgressBar() {
            const questions = quizData[currentStep]?.[currentPC] || [];
            const pct = questions.length === 0 ? 100 : ((currentQuestionIdx) / questions.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
        }

        window.onload = init;
    </script>
</body>
</html>
