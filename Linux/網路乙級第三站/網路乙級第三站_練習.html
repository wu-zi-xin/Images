<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網路乙級第三站 - 手機通勤專用逐步模擬系統</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-code: #090d16;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 頂部導覽列 (修復破版) */
        header {
            background-color: #020617;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 56px;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .hamburger-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-size: 0.95rem;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mode-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
            display: none; /* 在極小螢幕隱藏以防破版 */
        }
        @media (min-width: 380px) {
            .mode-badge { display: inline-block; }
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .stat-val { font-weight: bold; }
        .stat-val.correct { color: var(--accent-green); }
        .stat-val.streak { color: var(--accent-yellow); }

        /* 外層容器 */
        .container {
            display: flex;
            margin-top: 56px;
            width: 100%;
            min-height: calc(100vh - 56px);
        }

        /* 電腦版側邊欄 */
        .sidebar {
            width: 260px;
            background: #090d16;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: calc(100vh - 56px);
            position: sticky;
            top: 56px;
            overflow-y: auto;
        }
        .sidebar-title {
            padding: 12px 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--bg-card);
            color: #ffffff;
            border-left: 4px solid var(--accent-blue);
        }
        .nav-item .step-tag {
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        /* 手機版抽屜導覽選單 */
        .mobile-drawer {
            position: fixed;
            top: 56px; left: -100%;
            width: 280px; max-width: 80vw;
            height: calc(100vh - 56px);
            background: #090d16;
            border-right: 1px solid var(--border-color);
            z-index: 1002;
            transition: left 0.3s ease;
            overflow-y: auto;
        }
        .mobile-drawer.open { left: 0; }
        .drawer-overlay {
            position: fixed;
            top: 56px; left: 0; width: 100vw; height: calc(100vh - 56px);
            background: rgba(0,0,0,0.6);
            z-index: 1001;
            display: none;
        }
        .drawer-overlay.open { display: block; }

        /* 主畫面區塊 */
        .main-canvas {
            flex: 1;
            min-width: 0; 
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 100%;
        }

        .step-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-direction: column;
            gap: 10px;
        }
        .step-title-group h2 {
            font-size: 1.15rem;
            color: #f8fafc;
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .step-title-group p {
            color: var(--text-muted);
            font-size: 0.8rem;
            word-wrap: break-word;
        }
        .pc-toggle {
            display: flex;
            background: #090d16;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .pc-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .pc-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            word-wrap: break-word;
        }

        .question-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
            line-height: 1.4;
        }
        .question-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .question-desc code {
            background: var(--bg-code);
            color: #38bdf8;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-word;
        }

        .terminal-window {
            background: var(--bg-code);
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
            width: 100%;
        }
        .terminal-header {
            background: #1e293b;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #334155;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .terminal-title {
            margin-left: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .terminal-body {
            padding: 12px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            width: 100%;
        }

        /* 終端機版面修復 */
        .cmd-line {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap; /* 允許輸入框換行防破版 */
            width: 100%;
        }
        .prompt {
            color: #10b981;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap; /* 保持提示字元不被切斷 */
        }
        .cmd-input {
            flex: 1;
            min-width: 100px; /* 縮小最小寬度防破版 */
            background: transparent;
            border: none;
            border-bottom: 2px solid #475569;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            padding: 4px 2px;
            outline: none;
            transition: border-color 0.2s;
        }
        .cmd-input:focus {
            border-bottom-color: var(--accent-blue);
        }
        .cmd-input.error {
            border-bottom-color: var(--accent-red) !important;
            animation: shake 0.3s;
        }
        .cmd-input.success {
            border-bottom-color: var(--accent-green) !important;
            color: var(--accent-green);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .vim-window {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.7;
            color: #e5e7eb;
            font-size: 0.85rem;
            overflow-x: auto;
            width: 100%;
        }
        .vim-filename {
            color: #9ca3af;
            font-size: 0.75rem;
            margin-bottom: 6px;
            border-bottom: 1px solid #374151;
            padding-bottom: 4px;
            word-break: break-all;
        }
        
        /* Vim 填空版面修復 */
        .blank-input {
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: #f3f4f6;
            padding: 3px 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            outline: none;
            margin: 2px 2px;
            width: auto;       /* 取消 100% 防止單行擠破版面 */
            min-width: 80px;   /* 設定最小與最大寬度 */
            max-width: 160px;
            transition: all 0.2s;
            display: inline-block;
        }
        .blank-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }
        .blank-input.correct {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            font-weight: bold;
        }
        .blank-input.wrong {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: stretch;
            flex-direction: column;
            width: 100%;
        }
        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 44px;
        }
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-hint {
            background: #334155;
            color: #fbbf24;
        }
        .btn-hint:hover { background: #475569; }
        .btn-skip {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-skip:hover { background: #1e293b; color: white; }

        .feedback-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
            animation: fadeIn 0.3s;
            word-wrap: break-word;
        }
        .feedback-box.correct {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--accent-green);
            color: #34d399;
        }
        .feedback-box.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid var(--accent-red);
            color: #f87171;
        }
        .feedback-box.hint {
            display: block;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid var(--accent-yellow);
            color: #fbbf24;
        }

        .notes-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.85rem;
            word-wrap: break-word;
        }
        .notes-card h3 {
            color: #38bdf8;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            font-size: 0.95rem;
        }
        .notes-card code {
            background: var(--bg-code);
            color: #38bdf8;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 851px) {
            .hamburger-btn { display: none !important; }
            .sidebar { display: flex !important; }
            .mobile-drawer, .drawer-overlay { display: none !important; }
            .controls { flex-direction: row; }
            .controls .btn { width: auto; flex: 1; }
            .step-header { flex-direction: row; align-items: center; }
            .pc-toggle { width: auto; }
            .pc-btn { flex: unset; padding: 6px 14px; }
            .blank-input { width: auto; max-width: 250px; }
        }

        @media (max-width: 850px) {
            .sidebar { display: none !important; }
            .hamburger-btn { display: flex !important; }
            .main-canvas { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <button class="hamburger-btn" onclick="toggleMobileDrawer()">☰</button>
            <div class="logo">🌐 網乙考試系統</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="mode-badge">手機通勤</span>
            <div class="stats-bar">
                <div class="stat-item">正確:<span id="accuracyVal" class="stat-val correct">100%</span></div>
                <div class="stat-item">連對:<span id="streakVal" class="stat-val streak">0</span></div>
            </div>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMobileDrawer()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="sidebar-title">考試步驟</div>
        <div id="mobileNavContainer"></div>
    </div>

    <div class="container">
        <div class="sidebar" id="desktopNavContainer">
            <div class="sidebar-title">考試步驟</div>
            <div class="nav-item active" onclick="switchStep('step-A', this)"><span>A. 光碟 (安裝與準備)</span><span class="step-tag">準備</span></div>
            <div class="nav-item" onclick="switchStep('step-B', this)"><span>B. 做線 (實體網路線)</span><span class="step-tag">實體</span></div>
            <div class="nav-item" onclick="switchStep('step-C', this)"><span>C. 套件 (軟體庫與掛載)</span><span class="step-tag">逐步</span></div>
            <div class="nav-item" onclick="switchStep('step-D', this)"><span>D. 試ping (IP與路由)</span><span class="step-tag">逐步</span></div>
            <div class="nav-item" onclick="switchStep('step-E', this)"><span>E. 帳密權 (系統權限)</span><span class="step-tag">逐步</span></div>
            <div class="nav-item" onclick="switchStep('step-F', this)"><span>F. 中文 (內容建置)</span><span class="step-tag">逐步</span></div>
            <div class="nav-item" onclick="switchStep('step-G', this)"><span>G. 設定 (核心配置檔)</span><span class="step-tag">Vim</span></div>
            <div class="nav-item" onclick="switchStep('step-H', this)"><span>H. 重啟與測試 (驗收)</span><span class="step-tag">驗收</span></div>
            <div class="nav-item" onclick="switchStep('step-I', this)"><span>I. 考場觀念與避坑</span><span class="step-tag">觀念</span></div>
        </div>

        <div class="main-canvas">
            <div class="step-header">
                <div class="step-title-group">
                    <h2 id="stepTitle">A. 光碟 (安裝與準備)</h2>
                    <p id="stepSub">嚴格按照考試順序操作</p>
                </div>
                <div class="pc-toggle">
                    <button class="pc-btn active" id="pc1Btn" onclick="togglePC('PC1')">💻 PC1</button>
                    <button class="pc-btn" id="pc2Btn" onclick="togglePC('PC2')">🖥️ PC2</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
                <span>進度: <b id="progressText" style="color: #38bdf8;">1 / 1</b></span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="quiz-card" id="quizCard"></div>

            <div class="notes-card" id="notesCard">
                <h3>💡 重點與解析</h3>
                <div id="notesContent">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        const quizData = {
            'step-A': {
                'PC1': [
                    {
                        type: 'select',
                        title: '1. BIOS 開機順序設定',
                        desc: '開機進入 BIOS，必須將開機順序設定為下列哪一個？',
                        options: ['SATA1 / 網路開機 / USB', '光碟 / USB / SATA2 (舊版關閉 UEFI)', 'UEFI Only / 隨身碟 / SATA1', '直接預設開機即可'],
                        correct: 1,
                        explanation: '考場規定開機順序為：光碟/USB/SATA2，舊版務必關閉 UEFI！'
                    },
                    {
                        type: 'select',
                        title: '2. 安裝磁碟配置與 root 密碼',
                        desc: '安裝 Linux 時，磁碟分割與安全性設定應如何勾選？',
                        options: ['手動分割 /home 為 50GB', '自動 / 全部刪除 / 取回空間，並務必設定 root 密碼', '保留原有磁碟', '不需設定 root 密碼'],
                        correct: 1,
                        explanation: '自動、全部刪除、取回空間，並設定 root 密碼。'
                    }
                ],
                'PC2': [
                    {
                        type: 'select',
                        title: '1. PC2 系統安裝準備',
                        desc: 'PC2 的安裝流程與 PC1 相比為何？',
                        options: ['完全相同：一樣設光碟/USB/SATA2 開機、設 root 密碼、自動刪除磁碟', 'PC2 不需要裝 Linux', 'PC2 必須手動分割磁碟', 'PC2 不需要設 root 密碼'],
                        correct: 0,
                        explanation: 'PC2 的系統安裝步驟與 PC1 完全一樣。'
                    }
                ]
            },
            'step-B': {
                'PC1': [
                    {
                        type: 'select',
                        title: '1. 實體網路線色序',
                        desc: '請選擇正確的 8 芯 Cat5 網路線色序口訣：',
                        options: ['白綠 綠 白橘 藍 白藍 橘 白棕 棕', '白橘 橘 白綠 藍 白藍 綠 白棕 棕 (橘橘綠藍藍綠棕棕)', '白棕 棕 白綠 綠 白藍 藍 白橘 橘', '隨意排列'],
                        correct: 1,
                        explanation: '口訣：橘橘綠藍藍綠棕棕（記得穿插白色）。'
                    },
                    {
                        type: 'select',
                        title: '2. 網路線插孔位置',
                        desc: 'PC1 的 1 號線與 2 號線應分別插在哪個位置？',
                        options: ['1 號線插考場資訊插座(最上方)，2 號線插橋接孔(中間位置)', '1 號線插中間，2 號線插上方', '兩條都插同一個孔', '隨便插'],
                        correct: 0,
                        explanation: '1 號線插最上方資訊插座，2 號線插中間橋接孔。'
                    }
                ],
                'PC2': [
                    {
                        type: 'select',
                        title: '1. PC2 網路線插孔',
                        desc: 'PC2 製作好實體線後，應插在何處？',
                        options: ['插在橋接孔 (只有一個孔，絕不會插錯)', '插在最上方資訊插座', '插在交換器', '不用插線'],
                        correct: 0,
                        explanation: 'PC2 只有一條線接至橋接孔。'
                    }
                ]
            },
            'step-C': {
                'PC1': [
                    {
                        type: 'terminal',
                        title: '1. 切換至 yum.repos.d 目錄',

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isCorrect) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (isCorrect) {
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch(e) {}
        }

                quizCard.innerHTML = `

                fb.className = 'feedback-box correct';

                fb.innerHTML = `<b>❌ 答案不正確！</b> 請再想想看。`;
            }
            updateStats();

        function checkTerminal() {
            const inputEl = document.getElementById('terminalInput');
            if (!inputEl) return;
            const val = inputEl.value.trim().replace(/\s+/g, ' ');
            const q = quizData[currentStep][currentPC][currentQuestionIdx];
            const fb = document.getElementById('feedbackBox');

            totalAnswered++;
            if (q.answers.some(ans => ans.toLowerCase() === val.toLowerCase())) {
                totalCorrect++;
                streak++;
                playBeep(true);
                inputEl.className = 'cmd-input success';
                fb.className = 'feedback-box correct';
                fb.innerHTML = `<b>✅ 指令正確！</b><br>${q.explanation}`;
                setTimeout(() => { currentQuestionIdx++; renderQuestion(); }, 1200);

                playBeep(false);
                inputEl.className = 'cmd-input error';

                fb.innerHTML = `<b>❌ 指令或路徑不符！</b><br>請確認是否有確實輸入對應的資料夾切換 (cd) 或參數。`;

            q.blanks.forEach(b => {
                const el = document.getElementById(b.id);
                if (el) {
                    const userVal = el.value.trim();
                    if (userVal.toLowerCase() === b.answer.toLowerCase()) {
                        el.className = 'blank-input correct';
                    } else {
                        el.className = 'blank-input wrong';
                        allCorrect = false;
                    }
                }

            totalAnswered++;

            const fb = document.getElementById('feedbackBox');
            fb.className = 'feedback-box hint';
            fb.innerHTML = `<b>👀 已自動填入解答</b>`;
        }

        function skipQuestion() {
            currentQuestionIdx++;
            renderQuestion();
        }

        function nextStepAuto() {
            const stepKeys = Object.keys(quizData);
            const curIdx = stepKeys.indexOf(currentStep);
            if (curIdx < stepKeys.length - 1) {
                const nextStepKey = stepKeys[curIdx + 1];
                const navItems = document.querySelectorAll('#desktopNavContainer .nav-item');
                switchStep(nextStepKey, navItems[curIdx + 1]);
            }
        }

        function updateStats() {
            const accEl = document.getElementById('accuracyVal');
            const streakEl = document.getElementById('streakVal');
            const progEl = document.getElementById('progressText');

            const acc = totalAnswered === 0 ? 100 : Math.round((totalCorrect / totalAnswered) * 100);
            accEl.innerText = acc + '%';
            streakEl.innerText = streak;

            const questions = quizData[currentStep]?.[currentPC] || [];
            progEl.innerText = `${currentQuestionIdx + 1} / ${questions.length || 1}`;
        }

        function updateProgressBar() {
            const questions = quizData[currentStep]?.[currentPC] || [];
            const pct = questions.length === 0 ? 100 : ((currentQuestionIdx) / questions.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
        }

        window.onload = init;
    </script>
</body>
</html>
